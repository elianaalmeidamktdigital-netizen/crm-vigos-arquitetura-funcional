  }

  function listaAtual() {
    return state.abaAtual === 'fontes' ? state.fontes : state.campanhas;
  }

  function toggleAtual() {
    return state.abaAtual === 'fontes' ? state.toggleFontes : state.toggleCampanhas;
  }

  function podeCriar() {
    if (state.perfil === 'admin') return true;
    return toggleAtual();
  }

  function render() {
    var isFontes = state.abaAtual === 'fontes';
    document.getElementById('page-title').textContent = isFontes ? 'Fontes' : 'Campanhas';
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === state.abaAtual);
    });
    document.getElementById('desc-line').textContent = isFontes ? 'Gerenciar as fontes das negociações.' : 'Gerenciar as campanhas das negociações.';
    document.getElementById('toggle-label').textContent = isFontes ? 'Permitir que usuários criem novas fontes' : 'Permitir que usuários criem novas campanhas';
    document.getElementById('toggle-permissao').classList.toggle('on', toggleAtual());
    document.getElementById('btn-adicionar').textContent = isFontes ? '+ Adicionar Fonte' : '+ Adicionar Campanha';
    document.getElementById('field-descricao').style.display = isFontes ? 'none' : 'block';
    document.getElementById('input-nome').placeholder = isFontes ? 'Ex: Indicação' : 'Ex: Google Ads';

    var podeCriarAgora = podeCriar();
    document.getElementById('btn-adicionar').style.display = podeCriarAgora ? 'inline-block' : 'none';
    if (!podeCriarAgora) {
      document.getElementById('create-form').classList.remove('open');
    }

    var lista = listaAtual();
    var filtro = document.getElementById('search-box').value.trim().toLowerCase();
    var listaFiltrada = lista.filter(function (item) {
      return item.nome.toLowerCase().indexOf(filtro) !== -1;
    });

    var headerHtml = '<div class="col-check"></div><div class="col-name">' + (isFontes ? 'NOME DA FONTE' : 'NOME DA CAMPANHA') + ' (' + lista.length + ')</div>';
    if (!isFontes) headerHtml += '<div class="col-desc">DESCRIÇÃO</div>';
    headerHtml += '<div class="col-date">CRIADO EM</div><div class="col-date">ÚLTIMA ALTERAÇÃO EM</div><div class="col-action"></div>';
    document.getElementById('row-header').innerHTML = headerHtml;

    var body = document.getElementById('table-body');
    if (listaFiltrada.length === 0) {
      body.innerHTML = '<div class="empty-state">' + (isFontes ? 'Nenhuma fonte cadastrada ainda' : 'Nenhuma campanha cadastrada ainda') + '</div>';
    } else {
      body.innerHTML = listaFiltrada.map(function (item) {
        var checked = state.selecionados.indexOf(item.id) !== -1 ? 'checked' : '';
        var descCol = isFontes ? '' : '<div class="col-desc">' + (item.descricao || '') + '</div>';
        var vinculoTag = item.vinculada ? '<span class="blocked-tag">vinculada</span>' : '';
        return '<div class="row">' +
          '<div class="col-check"><input type="checkbox" class="row-check" data-id="' + item.id + '" ' + checked + '></div>' +
          '<div class="col-name">' + item.nome + vinculoTag + '</div>' +
          descCol +
          '<div class="col-date">' + item.criadoEm + '</div>' +
          '<div class="col-date">' + item.alteradoEm + '</div>' +
          '<div class="col-action"><span class="icon-btn item-delete" data-id="' + item.id + '">🗑</span></div>' +
          '</div>';
      }).join('');
      document.querySelectorAll('.row-check').forEach(function (cb) {
        cb.addEventListener('change', function () {
          var id = parseInt(this.getAttribute('data-id'));
          if (this.checked) {
            state.selecionados.push(id);
          } else {
            state.selecionados = state.selecionados.filter(function (x) { return x !== id; });
          }
          render();
        });
      });
      document.querySelectorAll('.item-delete').forEach(function (el) {
        el.addEventListener('click', function () {
          var id = parseInt(this.getAttribute('data-id'));
          abrirModalExclusao([id]);
        });
      });
    }

    var bulkBar = document.getElementById('bulk-bar');
    if (state.selecionados.length > 0) {
      bulkBar.classList.add('open');
      var label = isFontes ? 'fonte(s)' : 'campanha(s)';
      document.getElementById('bulk-text').textContent = 'Apagar a(s) ' + state.selecionados.length + ' ' + label + ' selecionada(s)';
      bulkBar.onclick = function () { abrirModalExclusao(state.selecionados.slice()); };
    } else {
      bulkBar.classList.remove('open');
    }
  }

  function abrirModalExclusao(ids) {
    state.itemParaExcluir = ids;
    var isFontes = state.abaAtual === 'fontes';
    var lista = listaAtual();
    var itens = lista.filter(function (i) { return ids.indexOf(i.id) !== -1; });
    var algumVinculado = itens.some(function (i) { return i.vinculada; });
    var todosVinculados = itens.every(function (i) { return i.vinculada; });

    document.getElementById('modal-title').textContent = ids.length > 1
      ? 'Deseja excluir ' + ids.length + ' ' + (isFontes ? 'fontes' : 'campanhas') + '?'
      : 'Deseja excluir a ' + (isFontes ? 'Fonte' : 'Campanha') + '?';

    var blockedArea = document.getElementById('modal-blocked-area');
    if (algumVinculado) {
      var qtd = itens.filter(function (i) { return i.vinculada; }).length;
      blockedArea.innerHTML = '<div class="modal-blocked">' + qtd + ' item(ns) selecionado(s) está(ão) vinculado(s) a Negociações e não pode(m) ser excluído(s). <em>Ponto de atenção: formato exato desta mensagem ainda pendente de definição.</em></div>';
    } else {
      blockedArea.innerHTML = '';
    }

    document.getElementById('modal-text').textContent = 'Você pode enviar ' + (ids.length > 1 ? 'os itens elegíveis' : (isFontes ? 'a Fonte' : 'a Campanha')) + ' para a lixeira ou excluir permanentemente da sua conta. Se optar por excluir, lembre-se que não será possível recuperar a informação.';

    document.getElementById('confirm-checkbox').checked = false;
    atualizarBotaoPermanente();

    var btnLixeira = document.getElementById('btn-lixeira');
    var btnPermanente = document.getElementById('btn-permanente');
    if (todosVinculados) {
      btnLixeira.style.opacity = '0.4';
      btnLixeira.style.cursor = 'not-allowed';
      btnLixeira.disabled = true;
    } else {
      btnLixeira.style.opacity = '1';
      btnLixeira.style.cursor = 'pointer';
      btnLixeira.disabled = false;
    }

    document.getElementById('modal-overlay').classList.add('open');
  }

  function atualizarBotaoPermanente() {
    var checked = document.getElementById('confirm-checkbox').checked;
    var btn = document.getElementById('btn-permanente');
    if (state.perfil === 'admin' && checked) {
      btn.classList.add('enabled');
    } else {
      btn.classList.remove('enabled');
    }
  }

  function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    state.itemParaExcluir = null;
  }

  function processarExclusao(tipo) {
    var ids = state.itemParaExcluir;
    if (!ids) return;
    var isFontes = state.abaAtual === 'fontes';
    var lista = isFontes ? state.fontes : state.campanhas;
    var elegiveis = lista.filter(function (i) { return ids.indexOf(i.id) !== -1 && !i.vinculada; });
    var bloqueados = lista.filter(function (i) { return ids.indexOf(i.id) !== -1 && i.vinculada; });

    if (elegiveis.length === 0) {
      toast('Nenhum item pôde ser excluído, todos vinculados a Negociações');
      fecharModal();
      return;
    }

    var idsElegiveis = elegiveis.map(function (i) { return i.id; });
    if (isFontes) {
      state.fontes = state.fontes.filter(function (i) { return idsElegiveis.indexOf(i.id) === -1; });
    } else {
      state.campanhas = state.campanhas.filter(function (i) { return idsElegiveis.indexOf(i.id) === -1; });
    }
    state.selecionados = state.selecionados.filter(function (id) { return idsElegiveis.indexOf(id) === -1; });

    var label = isFontes ? (elegiveis.length > 1 ? 'Fontes' : 'Fonte') : (elegiveis.length > 1 ? 'Campanhas' : 'Campanha');
    var msg = tipo === 'lixeira' ? label + ' enviada(s) para a lixeira' : label + ' excluída(s) permanentemente';
    if (bloqueados.length > 0) {
      msg += ' (' + bloqueados.length + ' bloqueada(s) por vínculo)';
    }
    toast(msg);
    fecharModal();
    render();
  }

  document.getElementById('btn-perfil-admin').addEventListener('click', function () {
    state.perfil = 'admin';
    document.getElementById('btn-perfil-admin').classList.add('active');
    document.getElementById('btn-perfil-usuario').classList.remove('active');
    render();
  });
  document.getElementById('btn-perfil-usuario').addEventListener('click', function () {
    state.perfil = 'usuario';
    document.getElementById('btn-perfil-usuario').classList.add('active');
    document.getElementById('btn-perfil-admin').classList.remove('active');
    render();
  });

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      state.abaAtual = this.getAttribute('data-tab');
      state.selecionados = [];
      document.getElementById('create-form').classList.remove('open');
      document.getElementById('search-box').value = '';
      render();
    });
  });

  document.getElementById('toggle-permissao').addEventListener('click', function () {
    if (state.abaAtual === 'fontes') {
      state.toggleFontes = !state.toggleFontes;
    } else {
      state.toggleCampanhas = !state.toggleCampanhas;
    }
    render();

  document.getElementById('btn-adicionar').addEventListener('click', function () {

    document.getElementById('input-nome').value = '';
    document.getElementById('input-descricao').value = '';
    document.getElementById('error-nome').style.display = 'none';
    document.getElementById('input-nome').classList.remove('error');
  });

  document.getElementById('btn-cancelar').addEventListener('click', function () {
    document.getElementById('create-form').classList.remove('open');
  });

  document.getElementById('btn-salvar').addEventListener('click', function () {
    var nome = document.getElementById('input-nome').value.trim();
    var errorEl = document.getElementById('error-nome');
    var inputEl = document.getElementById('input-nome');
    var isFontes = state.abaAtual === 'fontes';
    var lista = listaAtual();

    if (!nome) {
      errorEl.textContent = 'Este campo é obrigatório';
      errorEl.style.display = 'block';
      inputEl.classList.add('error');
      return;
    }
    var duplicado = lista.some(function (i) { return i.nome === nome; });
    if (duplicado) {
      errorEl.textContent = 'Já existe um registro com este nome';
      errorEl.style.display = 'block';
      inputEl.classList.add('error');
      return;
    }
    errorEl.style.display = 'none';
    inputEl.classList.remove('error');

    var agora = new Date();
    var dataFormatada = String(agora.getDate()).padStart(2, '0') + '/' + String(agora.getMonth() + 1).padStart(2, '0') + '/' + agora.getFullYear() + ' ' + String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');

    if (isFontes) {
      state.fontes.push({ id: state.proximoIdFonte++, nome: nome, criadoEm: dataFormatada, alteradoEm: dataFormatada, vinculada: false });
      toast('Fonte criada com sucesso');
    } else {
      var descricao = document.getElementById('input-descricao').value.trim();
      state.campanhas.push({ id: state.proximoIdCampanha++, nome: nome, descricao: descricao, criadoEm: dataFormatada, alteradoEm: dataFormatada, vinculada: false });
      toast('Campanha criada com sucesso');
    }
    document.getElementById('create-form').classList.remove('open');
    render();
  });

  document.getElementById('search-box').addEventListener('input', render);

  document.getElementById('confirm-checkbox').addEventListener('change', atualizarBotaoPermanente);

  document.getElementById('btn-lixeira').addEventListener('click', function () {
    if (this.disabled) return;
    processarExclusao('lixeira');
  });
  document.getElementById('btn-permanente').addEventListener('click', function () {
    if (state.perfil !== 'admin') return;
    if (!document.getElementById('confirm-checkbox').checked) return;
    processarExclusao('permanente');
  });
  document.getElementById('btn-fechar-modal').addEventListener('click', fecharModal);

  render();
<\/script>
</body>
</html>

  .toggle .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: left .15s; }
  .toggle.on .knob { left: 18px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 440px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(11,25,41,0.15); }
  .modal h3 { font-size: 15px; margin: 0 0 10px; }
  .warn-box { border-left: 3px solid var(--coral-border); background: var(--coral-bg); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
  .warn-box p { margin: 0; font-size: 11.5px; color: var(--coral-text); line-height: 1.5; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-dark); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .2s; z-index: 20; }
  .toast.show { opacity: 1; }
  .tabs { display: flex; gap: 20px; border-bottom: 0.5px solid var(--border-light); margin-bottom: 16px; font-size: 13px; }
  .tab { padding-bottom: 8px; color: var(--text-muted); cursor: pointer; }
  .tab.active { font-weight: 600; color: var(--teal-dim); border-bottom: 2px solid var(--teal); }
  .inline-form { border: 0.5px solid var(--border-light); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; background: #FAFBFC; }
  .field-row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 8px; }
  .field-row > div { flex: 1; }
  .field-row label { font-size: 11.5px; font-weight: 600; display: block; margin-bottom: 4px; }
  .field-row input { width: 100%; border: none; border-bottom: 1.5px solid #CBD5E1; background: transparent; box-sizing: border-box; }
  .hint { font-size: 10.5px; color: #94A3B8; margin: 8px 0 0; line-height: 1.5; }
  .error-text { font-size: 11px; color: #A32D2D; margin: 4px 0 0; }
  .empty-state { text-align: center; padding: 48px 20px 24px; }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }
  .empty-state h4 { font-size: 14px; margin: 0 0 6px; }
  .empty-state p { font-size: 12px; color: var(--text-muted); max-width: 360px; margin: 0 auto; }
  .breadcrumb { font-size: 11px; color: #94A3B8; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 0 0 14px; }
  .back { color: #0C7CD5; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="active">&#8962;</div><div>&#128100;</div><div>&#128257;</div><div>&#127970;</div><div>&#9776;</div><div>&#128202;</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="brand">&#9670; CRM</div>
      <div>&#128269; &#10022; &#9638; &#128276; &#9881; &#127970; Rede Filantropia</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var motivos = [
  { id: 1, nome: "Cliente optou por não realizar o Curso", status: "ativo", emUso: true, criado: "20/09/2022", alterado: "30/09/2022" },
  { id: 2, nome: "Curso já começou / Inscrição encerrada", status: "ativo", emUso: false, criado: "15/09/2023", alterado: "15/09/2023" },
  { id: 3, nome: "Formato do curso (presencial / online)", status: "ativo", emUso: false, criado: "15/09/2023", alterado: "15/09/2023" },
  { id: 4, nome: "Instituição não vai arcar", status: "arquivado", emUso: true, criado: "30/09/2022", alterado: "30/09/2022" }
];
var funilMotivos = { 1: true };
var currentView = "listagem";
var cadastroAberto = false;
var editandoId = null;
var selecionados = [];
var filtroFunil = "todos";

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function render() {
  if (currentView === "listagem") renderListagem();
  else if (currentView === "funil") renderFunil();
  else if (currentView === "negociacao") renderNegociacao();
}

function renderListagem() {
  var rows = motivos.map(function (m) {
    var nomeCell;
    if (m.status === "arquivado") {
      nomeCell = '<span style="color:#94A3B8;">' + m.nome + '<span class="badge">arquivado</span></span>';
    } else {
      nomeCell = '<span class="link" onclick="editarMotivo(' + m.id + ')">' + m.nome + '</span>';
    }
    var acaoCell;
    if (m.status === "arquivado") {
      acaoCell = '<span class="link" onclick="desarquivar(' + m.id + ')" title="Desarquivar">&#8634;</span>';
    } else {
      acaoCell = '<span class="link" onclick="pedirExclusao([' + m.id + '])" title="Excluir">&#128465;</span>';
    }
    return '<tr>' +
      '<td><input type="checkbox" ' + (selecionados.indexOf(m.id) > -1 ? "checked" : "") + ' onchange="toggleSelecionar(' + m.id + ')"></td>' +
      '<td>' + nomeCell + '</td>' +
      '<td style="color:#94A3B8;">' + m.criado + '</td>' +
      '<td style="color:#94A3B8;">' + m.alterado + '</td>' +
      '<td>' + acaoCell + '</td>' +
      '</tr>';
  }).join("");

  var formHtml = "";
  if (cadastroAberto) {
    var valorAtual = editandoId ? motivos.filter(function (m) { return m.id === editandoId; })[0].nome : "";
    formHtml = '<div class="inline-form">' +
      '<div class="field-row">' +
      '<div><label>Motivo de Perda *</label>' +
      '<input type="text" id="input-nome" placeholder="Ex: Não gostou do produto" value="' + valorAtual + '"></div>' +
      '<button class="btn btn-primary" onclick="salvarMotivo()">Salvar</button>' +
      '<button class="btn btn-danger" onclick="cancelarCadastro()">Cancelar</button>' +
      '</div>' +
      '<p class="error-text" id="erro-nome" style="display:none;"></p>' +
      '<p class="hint">Esse item será exibido em todos os funis de venda que podem ver todos os motivos de perda. Acesse as preferências de funil na <span class="link" onclick="irParaFunil()">página de funis de venda</span> para definir em quais funis esse motivo de perda será visível.</p>' +
      '</div>';
  } else {
    formHtml = '<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">' +
      '<button class="btn btn-primary" onclick="abrirCadastro()">+ Adicionar Motivo de Perda</button>' +
      '</div>';
  }

  var barraSelecao = "";
  if (selecionados.length > 0) {
    barraSelecao = '<div style="background:#16324A;color:#fff;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;cursor:pointer;" onclick="pedirExclusao(selecionados)">' +
      '&#128465; Apagar o(s) ' + selecionados.length + ' motivo(s) de perda selecionado(s)</div>';
  }

  document.getElementById('content').innerHTML =
    '<p class="intro">Cadastre todos os motivos de perda de negociações da sua empresa.<br>Além de relatórios, você terá filtros para gerenciar melhor sua empresa e clientes.</p>' +
    formHtml +
    '<div style="margin-bottom:12px;"><input type="text" placeholder="Pesquisar..." style="width:260px;"></div>' +
    barraSelecao +
    '<table><tr><th style="width:22px;"><input type="checkbox" onchange="toggleSelecionarTodos(this.checked)"></th>' +
    '<th>Nome do Motivo de Perda (' + motivos.length + ')</th>' +
    '<th style="width:110px;">Criado em</th><th style="width:130px;">Última alteração</th><th style="width:50px;">Opções</th></tr>' +
    rows + '</table>' +
    '<p style="font-size:10.5px;color:#94A3B8;margin-top:14px;">Motivos ativos configurados neste momento: ' + motivos.filter(function (m) { return m.status === "ativo"; }).length + '. Vá para <span class="link" onclick="irParaFunil()">Preferências do funil</span> para testar o encerramento de negociação como perdida.</p>';
}

function abrirCadastro() { cadastroAberto = true; editandoId = null; render(); }
function editarMotivo(id) { cadastroAberto = true; editandoId = id; render(); }
function cancelarCadastro() { cadastroAberto = false; editandoId = null; render(); }

function salvarMotivo() {
  var val = document.getElementById('input-nome').value.trim();
  var errEl = document.getElementById('erro-nome');
  if (!val) {
    errEl.textContent = "Nome é obrigatório.";
    errEl.style.display = "block";
    return;
  }
  var duplicado = motivos.some(function (m) { return m.nome === val && m.id !== editandoId; });
  if (duplicado) {
    errEl.textContent = "Já existe um motivo com esse nome exato.";
    errEl.style.display = "block";
    return;
  }
  if (editandoId) {
    var m = motivos.filter(function (m) { return m.id === editandoId; })[0];
    m.nome = val;
    m.alterado = "hoje";
    toast("Alterações salvas");
  } else {
    var novoId = Math.max.apply(null, motivos.map(function (m) { return m.id; })) + 1;
    motivos.push({ id: novoId, nome: val, status: "ativo", emUso: false, criado: "hoje", alterado: "hoje" });
    toast("Motivo criado");
  }
  cadastroAberto = false;
  editandoId = null;
  render();
}

function toggleSelecionar(id) {
  if (selecionados.indexOf(id) > -1) {
    selecionados = selecionados.filter(function (x) { return x !== id; });
  } else {
    selecionados = selecionados.concat([id]);
  }
  render();
}
function toggleSelecionarTodos(checked) {
  selecionados = checked ? motivos.filter(function (m) { return m.status === 'ativo'; }).map(function (m) { return m.id; }) : [];
  render();
}

function pedirExclusao(ids) {
  var algumEmUso = ids.some(function (id) {
    var m = motivos.filter(function (m) { return m.id === id; })[0];
    return m && m.emUso;
  });
  if (algumEmUso) {
    var nomes = ids.filter(function (id) {
      var m = motivos.filter(function (m) { return m.id === id; })[0];
      return m && m.emUso;
    }).map(function (id) {
      return motivos.filter(function (m) { return m.id === id; })[0].nome;
    }).join(", ");
    openModal(
      '<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><h3>Arquivar motivo de perda?</h3><span style="color:#94A3B8;cursor:pointer;" onclick="closeModal()">&#10005;</span></div>' +
      '<p style="font-size:12.5px;color:#475569;margin:0 0 10px;line-height:1.5;">O motivo <strong>"' + nomes + '"</strong> está em uso em negociações já perdidas, por isso não pode ser excluído.</p>' +
      '<p style="font-size:12.5px;color:#475569;margin:0 0 14px;line-height:1.5;">Ao arquivar, ele deixa de aparecer nas opções de seleção, mas o histórico das negociações já perdidas com esse motivo é preservado.</p>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px;">' +
      '<button class="btn btn-outline" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" style="background:#5F5E5A;color:#fff;" onclick="confirmarArquivar([' + ids.join(",") + '])">Arquivar motivo</button>' +
      '</div>'
    );
    return;
  }
  var barraLote = ids.length > 1 ? '<div style="background:#16324A;color:#fff;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:11.5px;">&#128465; Apagar o(s) ' + ids.length + ' motivo(s) de perda selecionado(s)</div>' : "";
  openModal(
    '<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><h3>Deseja excluir o Motivo de Perda?</h3><span style="color:#94A3B8;cursor:pointer;" onclick="closeModal()">&#10005;</span></div>' +
    barraLote +
    '<p style="font-size:12.5px;color:#475569;margin:0 0 6px;line-height:1.5;">Você pode enviar o Motivo de Perda para a lixeira ou excluir permanentemente da sua conta.</p>' +
    '<p style="font-size:12.5px;color:#475569;margin:0 0 14px;line-height:1.5;">Se optar por excluir, lembre-se que não será possível recuperar a informação.</p>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:16px;"><input type="checkbox" id="chk-confirma" onchange=\"toggleConfirmaExclusao([' + ids.join(",") + '])\">Entendo que ao excluir não conseguirei recuperar a informação.</label>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;border-top:0.5px solid #E2E8F0;padding-top:14px;">' +
    '<span class="link" style="font-weight:600;" onclick="confirmarLixeira([' + ids.join(",") + '])">Enviar para a lixeira</span>' +
    '<span id="btn-excluir-perm" style="font-size:13px;font-weight:600;color:#CBD5E1;cursor:not-allowed;">Excluir permanentemente</span>' +
    '</div>'
  );
}

function toggleConfirmaExclusao(ids) {
  var checked = document.getElementById('chk-confirma').checked;
  var btn = document.getElementById('btn-excluir-perm');
  if (checked) {
    btn.style.color = "#D32F2F";
    btn.style.cursor = "pointer";
    btn.className = "link";
    btn.onclick = function () { confirmarExclusaoPermanente(ids); };
  } else {
    btn.style.color = "#CBD5E1";
    btn.style.cursor = "not-allowed";
    btn.className = "";
    btn.onclick = null;
  }
}

function confirmarArquivar(ids) {
  ids.forEach(function (id) {
    var m = motivos.filter(function (m) { return m.id === id; })[0];
    if (m) m.status = "arquivado";
  });
  selecionados = [];
  closeModal();
  toast("Motivo arquivado");
  render();
}
function confirmarLixeira(ids) {
  motivos = motivos.filter(function (m) { return ids.indexOf(m.id) === -1; });
  selecionados = [];
  closeModal();
  toast("Enviado para a lixeira");
  render();
}
function confirmarExclusaoPermanente(ids) {
  motivos = motivos.filter(function (m) { return ids.indexOf(m.id) === -1; });
  selecionados = [];
  closeModal();
  toast("Excluído permanentemente");
  render();
}
function desarquivar(id) {
  var m = motivos.filter(function (m) { return m.id === id; })[0];
  if (m) m.status = "ativo";
  toast("Motivo reativado");
  render();
}

function irParaFunil() { currentView = "funil"; render(); }
function irParaListagem() { currentView = "listagem"; render(); }
function irParaNegociacao() { currentView = "negociacao"; render(); }

function renderFunil() {
  var ativosNoFunil = motivos.filter(function (m) { return m.status === "ativo" && funilMotivos[m.id]; });
  var semMotivo = ativosNoFunil.length === 0;
  var listaMotivos = motivos.filter(function (m) { return m.status === "ativo"; });
  if (filtroFunil === "visiveis") listaMotivos = listaMotivos.filter(function (m) { return funilMotivos[m.id]; });
  if (filtroFunil === "ocultos") listaMotivos = listaMotivos.filter(function (m) { return !funilMotivos[m.id]; });

  var avisoHtml = semMotivo ?
    '<div class="warn-box"><p style="font-weight:600;margin-bottom:4px;">&#9888; Funil sem motivos de perda ativos</p>' +
    '<p>Todo funil precisa ter pelo menos um motivo de perda ativado. Enquanto nenhum estiver ativo, o encerramento de negociações como perdidas fica bloqueado neste funil.</p></div>' : "";

  var corpoHtml;
  if (listaMotivos.length === 0) {
    corpoHtml = '<div class="empty-state"><div class="icon">&#128193;</div>' +
      '<h4>Não encontramos motivos de perda com os filtros selecionados</h4>' +
      '<p>Cadastre novos motivos de perda ou experimente mudar os filtros aplicados para encontrar resultados.</p></div>';
  } else {
    var linhas = listaMotivos.map(function (m) {
      return '<tr><td><input type="checkbox"></td><td style="font-weight:500;">' + m.nome + '</td>' +
        '<td style="text-align:right;"><div class="toggle ' + (funilMotivos[m.id] ? 'on' : '') + '" onclick="toggleFunilMotivo(' + m.id + ')"><div class="knob"></div></div></td></tr>';
    }).join("");
    corpoHtml = '<table><tr><th style="width:22px;"><input type="checkbox"></th><th>Nome</th><th style="text-align:right;width:130px;">Exibir no funil &#9432;</th></tr>' +
      linhas + '</table>' +
      '<p style="font-size:11px;color:#94A3B8;margin-top:14px;">Exibindo ' + listaMotivos.length + ' de ' + motivos.filter(function (m) { return m.status === 'ativo'; }).length + ' motivos de perda</p>';
  }

  document.getElementById('content').innerHTML =
    '<p class="breadcrumb">Funis de venda</p>' +
    '<h2><span class="back" onclick="irParaListagem()">&larr;</span> Eliana</h2>' +
    '<div class="tabs"><div class="tab">Produtos e serviços do funil</div><div class="tab active">Motivos de perda do funil</div></div>' +
    avisoHtml +
    '<p style="font-weight:600;margin:0 0 2px;">Selecione os motivos de perda deste funil.</p>' +
    '<p style="color:var(--text-muted);margin:0 0 14px;">Motivos ativados aqui ficam disponíveis para os vendedores ao perder uma negociação neste funil.</p>' +
    '<div style="display:flex;gap:10px;margin-bottom:14px;">' +
    '<input type="text" placeholder="Buscar" style="flex:1;">' +
    '<select onchange="mudarFiltroFunil(this.value)">' +
    '<option value="todos"' + (filtroFunil === 'todos' ? ' selected' : '') + '>Todos os motivos de perda</option>' +
    '<option value="visiveis"' + (filtroFunil === 'visiveis' ? ' selected' : '') + '>Motivos de perda visíveis no funil</option>' +
    '<option value="ocultos"' + (filtroFunil === 'ocultos' ? ' selected' : '') + '>Motivos de perda ocultos no funil</option>' +
    '</select></div>' +
    corpoHtml;
}

function toggleFunilMotivo(id) {
  funilMotivos[id] = !funilMotivos[id];
  render();
}
function mudarFiltroFunil(v) {
  filtroFunil = v;
  render();
}

function renderNegociacao() {
  var ativosNoFunil = motivos.filter(function (m) { return m.status === "ativo" && funilMotivos[m.id]; });
  var semMotivo = ativosNoFunil.length === 0;

  var corpoHtml;
  if (semMotivo) {
    corpoHtml = '<div class="warn-box"><p>Este funil não tem nenhum motivo de perda ativo. Peça a um administrador para ativar ao menos 1 motivo em <span class="link" onclick="irParaFunil()" style="color:var(--coral-text);text-decoration:underline;">Preferências do funil</span> antes de marcar negociações como perdidas.</p></div>';
  } else {
    var opcoes = ativosNoFunil.map(function (m) {
      return '<option value="' + m.id + '">' + m.nome + '</option>';
    }).join("");
    corpoHtml = '<div id="area-motivo" style="display:none;">' +
      '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Motivo da perda *</label>' +
      '<select id="select-motivo" style="width:100%;box-sizing:border-box;margin-bottom:4px;"><option value="">Selecione um motivo</option>' + opcoes + '</select>' +
      '<p class="error-text" id="erro-motivo" style="display:none;"></p>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;">' +
      '<button class="btn btn-outline" onclick="fecharSelecaoMotivo()">Cancelar</button>' +
      '<button class="btn btn-dark" onclick="confirmarPerda()">Confirmar perda</button>' +
      '</div></div>';
  }

  document.getElementById('content').innerHTML =
    '<p class="breadcrumb"><span class="back" onclick="irParaListagem()">&larr; Voltar aos motivos</span></p>' +
    '<div style="max-width:440px;background:#fff;border:0.5px solid var(--border-light);border-radius:12px;padding:1.5rem;box-shadow:0 2px 10px rgba(11,25,41,0.06);">' +
    '<p style="font-size:11px;color:#94A3B8;margin:0 0 4px;">Negociação</p>' +
    '<h3 style="margin:0 0 14px;font-size:15px;">Proposta, Instituto ABC</h3>' +
    '<div style="display:flex;gap:8px;margin-bottom:14px;">' +
    '<button class="btn" style="flex:1;background:#1D9E75;color:#fff;">Ganha</button>' +
    '<button class="btn" style="flex:1;" ' + (semMotivo ? 'disabled' : '') + ' onclick="' + (semMotivo ? '' : 'abrirSelecaoMotivo()') + '" title="' + (semMotivo ? 'Ative ao menos 1 motivo de perda neste funil' : '') + '">Perdida</button>' +
    '</div>' + corpoHtml + '</div>';
}

function abrirSelecaoMotivo() {
  document.getElementById('area-motivo').style.display = 'block';
}
function fecharSelecaoMotivo() {
  document.getElementById('area-motivo').style.display = 'none';
}
function confirmarPerda() {
  var val = document.getElementById('select-motivo').value;
  var err = document.getElementById('erro-motivo');
  if (!val) {
    err.textContent = "Não foi possível confirmar a perda. Selecione um motivo antes de continuar.";
    err.style.display = "block";
    return;
  }
  toast("Negociação marcada como perdida");
  fecharSelecaoMotivo();
}

render();
<\/script>
</body>
</html>
`;

    --amber-bg: #FEF3E2;
    --red: #E45858;
    --red-bg: #FCEAEA;
    --green: #1FAA6E;
    --green-bg: #E7F7EF;
    --blue-bg: #E6F1FB;
    --blue-text: #0C447C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-page); color: var(--text-dark); min-height: 100vh; font-size: 13px; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 52px; background: var(--navy-deep); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 18px; color: #7C93AA; font-size: 16px; }
  .sidebar .active { color: #fff; }
  .sidebar div { cursor: pointer; }
  .main { flex: 1; min-width: 0; }
  .topbar { background: var(--navy-deep); color: #fff; padding: 9px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .topbar .brand { color: var(--teal); font-weight: 600; }
  .content { background: #fff; padding: 1.25rem 1.5rem; }
  .intro { font-size: 12.5px; color: var(--text-muted); margin: 0 0 18px; line-height: 1.6; }
  .btn { font-size: 12px; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #00B8D4; color: #fff; }
  .btn-danger { background: #E91E63; color: #fff; }
  .btn-dark { background: var(--text-dark); color: #fff; }
  .btn-outline { background: #fff; border: 0.5px solid #CBD5E1; color: var(--text-dark); }
  .btn:disabled { background: #EFD3D3; color: #A32D2D; cursor: not-allowed; }
  input[type=text], input[type=email], select, textarea { font-size: 12.5px; padding: 8px 10px; border: 0.5px solid #CBD5E1; border-radius: 6px; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { color: var(--text-muted); text-align: left; font-weight: 500; padding: 8px 6px; border-bottom: 0.5px solid var(--border-light); }
  td { padding: 9px 6px; border-top: 0.5px solid #F0F3F6; }
  .link { color: #0C7CD5; cursor: pointer; }
  .badge { font-size: 9px; background: #F1EFE8; color: #5F5E5A; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }
  .tag { display: inline-block; background: var(--blue-bg); color: var(--blue-text); font-size: 11px; padding: 3px 8px; border-radius: 10px; margin: 2px 4px 2px 0; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 440px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(11,25,41,0.15); max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-size: 15px; margin: 0 0 10px; }
  .warn-box { border-left: 3px solid #D85A30; background: #FAECE7; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
  .warn-box p { margin: 0; font-size: 11.5px; color: #712B13; line-height: 1.5; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-dark); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .2s; z-index: 20; }
  .toast.show { opacity: 1; }
  .drawer-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.35); display: none; z-index: 15; }
  .drawer-overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #fff; box-shadow: -4px 0 14px rgba(0,0,0,0.12); transition: right .2s; z-index: 16; overflow-y: auto; }
  .drawer.open { right: 0; }
  .drawer-header { padding: 16px 20px; border-bottom: 0.5px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; border-top: 4px solid var(--border-light); }
  .drawer-header h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .drawer-header .x { cursor: pointer; color: var(--text-muted); font-size: 16px; }
  .drawer-header.hdr-contato { border-top-color: #0C7CD5; }
  .drawer-header.hdr-contato .entity-icon { color: #0C7CD5; }
  .drawer-header.hdr-empresa { border-top-color: var(--teal); }
  .drawer-header.hdr-empresa .entity-icon { color: var(--teal-dim); }
  .drawer-header.hdr-segmento { border-top-color: #9B59B6; }
  .drawer-header.hdr-segmento .entity-icon { color: #9B59B6; }
  .entity-icon { font-size: 17px; }
  .drawer-body { padding: 16px 20px; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 500; display: block; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field .req { color: var(--red); }
  .section-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.03em; margin: 18px 0 8px; text-transform: uppercase; }
  .link-add { font-size: 12px; color: var(--teal-dim); font-weight: 600; cursor: pointer; }
  .error-text { font-size: 11px; color: #A32D2D; margin: 4px 0 0; }
  .empty-state { text-align: center; padding: 48px 20px 24px; }
  .empty-state h4 { font-size: 14px; margin: 0 0 6px; }
  .empty-state p { font-size: 12px; color: var(--text-muted); max-width: 360px; margin: 0 auto; }
  .breadcrumb { font-size: 11px; color: #94A3B8; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 0 0 14px; }
  .toprow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .search-box { border: 0.5px solid var(--border-light); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: var(--text-muted); max-width: 280px; margin-bottom: 16px; }
  .phone-row, .email-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .phone-row input, .email-row input { flex: 1; }
  .remove-x { color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 4px; }
  .profile-switch { position: fixed; top: 8px; left: 62px; z-index: 25; background: #fff; border: 0.5px solid var(--border-light); border-radius: 6px; padding: 4px 8px; font-size: 11px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div>&#8962;</div><div class="active">&#128100;</div><div>&#8646;</div><div>&#127970;</div><div>&#9776;</div><div>&#128202;</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="brand">&#9670; CRM Vigos</div>
      <div>Rede Filantropia</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="fecharDrawer()"></div>
<div class="drawer" id="drawer"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var nextContatoId = 3;
var nextEmpresaId = 3;

var nextSegmentoId = 8;

var STATE6 = {
  contatos: [
    { id: 1, nome: "Eliana Almeida", cargo: "Diretora", telefones: [{ ddi: "+55", numero: "(11) 93415-8855" }], emails: ["eliana@vcrm.com"], empresaId: 1, baseLegal: "Consentimento", origemMarketing: "", status: "ativo" },
    { id: 2, nome: "Marcos Lima", cargo: "Financeiro", telefones: [], emails: ["marcos@gmail.com"], empresaId: null, baseLegal: "", origemMarketing: "", status: "ativo" }
  ],
  empresas: [
    { id: 1, nome: "V CRM", segmentoId: 7, url: "vcrm.com.br", resumo: "", endereco: "", status: "ativo" },
    { id: 2, nome: "Rede Filantropia", segmentoId: 6, url: "", resumo: "", endereco: "", status: "ativo" }
  ],
  segmentos: [
    { id: 1, nome: "Advocacia", status: "ativo" },
    { id: 2, nome: "Agropecuária", status: "ativo" },
    { id: 3, nome: "Arquitetura", status: "ativo" },
    { id: 4, nome: "Bancos", status: "ativo" },
    { id: 5, nome: "Clínicas / Saúde", status: "ativo" },
    { id: 6, nome: "Terceiro Setor", status: "ativo" },
    { id: 7, nome: "Telefonia", status: "ativo" }
  ],
  permiteUsuarioCriarSegmento: false,
  view: "contatos-listagem",
  editandoContatoId: null,
  editandoEmpresaId: null,
  editandoSegmentoId: null,
  perfil: "admin"
};

function toast6(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function abrirDrawer(html) {
  document.getElementById('drawer').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}
function fecharDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').innerHTML = '';
}

function abrirModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function irPara(view) {
  STATE6.view = view;
  render6();
}

function render6() {
  if (STATE6.view === "contatos-listagem") renderContatosListagem();
  else if (STATE6.view === "empresas-listagem") renderEmpresasListagem();
  else if (STATE6.view === "empresa-detalhe") renderEmpresaDetalhe();
  else if (STATE6.view === "segmentos-listagem") renderSegmentosListagem();
}

function nomeSegmento(segmentoId) {
  if (!segmentoId) return '-';
  var s = STATE6.segmentos.filter(function (x) { return x.id === segmentoId; })[0];
  return s ? s.nome : '-';
}

/* ===================== CONTATOS ===================== */

function nomeEmpresa(empresaId) {
  if (!empresaId) return '<span style="color:#94A3B8;">Sem empresa</span>';
  var emp = STATE6.empresas.filter(function (e) { return e.id === empresaId; })[0];
  return emp ? emp.nome : '<span style="color:#94A3B8;">Sem empresa</span>';
}

function renderContatosListagem() {
  var rows = STATE6.contatos.map(function (c) {
    return '<tr>' +
      '<td><span class="link" onclick="abrirDrawerContato(' + c.id + ')">' + c.nome + '</span></td>' +
      '<td style="color:#94A3B8;">' + (c.cargo || '-') + '</td>' +
      '<td style="color:#94A3B8;">' + (c.emails[0] || '-') + '</td>' +
      '<td style="color:#94A3B8;">' + nomeEmpresa(c.empresaId) + '</td>' +
      '<td><span class="link" onclick="pedirExclusaoContato(' + c.id + ')" title="Excluir">&#128465;</span></td>' +
      '</tr>';
  }).join("");

  document.getElementById('content').innerHTML =
    '<div class="toprow"><h2 style="margin:0;"><span style="color:#0C7CD5;">&#128100;</span> Contatos</h2><button class="btn btn-primary" onclick="abrirDrawerContato(null)">+ Criar contato</button></div>' +
    '<div class="search-box">Buscar por nome &#128269;</div>' +
    '<table><tr><th>Nome</th><th>Cargo</th><th>E-mail</th><th>Empresa</th><th style="width:40px;"></th></tr>' +
    rows + '</table>';
}

function abrirDrawerContato(id) {
  STATE6.editandoContatoId = id;
  var c = id ? STATE6.contatos.filter(function (x) { return x.id === id; })[0] : { nome: "", cargo: "", telefones: [], emails: [], empresaId: null, baseLegal: "", origemMarketing: "" };

  var telefonesHtml = c.telefones.map(function (t, i) {
    return '<div class="phone-row"><input type="text" id="tel-' + i + '" value="' + t.ddi + ' ' + t.numero + '"><span class="remove-x" onclick="removerTelefone(' + i + ')">&#10005;</span></div>';
  }).join("") || '<div class="phone-row"><input type="text" id="tel-0" placeholder="+55 (99) 99999-9999"></div>';

  var emailsHtml = c.emails.map(function (e, i) {
    return '<div class="email-row"><input type="email" id="email-' + i + '" value="' + e + '"><span class="remove-x" onclick="removerEmail(' + i + ')">&#10005;</span></div>';
  }).join("") || '<div class="email-row"><input type="email" id="email-0" placeholder="seunome@email.com"></div>';

  var empresaOptions = '<option value="">Selecionar</option>' + STATE6.empresas.map(function (e) {
    return '<option value="' + e.id + '"' + (c.empresaId === e.id ? " selected" : "") + '>' + e.nome + '</option>';
  }).join("");

  var html = '<div class="drawer-header hdr-contato"><h3><span class="entity-icon">&#128100;</span>' + (id ? "Editar Contato" : "Criar Contato") + '</h3><span class="x" onclick="fecharDrawer()">&#10005;</span></div>' +
    '<div class="drawer-body">' +
    '<div class="field"><label>Nome do contato <span class="req">*</span></label><input type="text" id="f-nome" value="' + c.nome + '"></div>' +
    '<p class="error-text" id="erro-nome-contato" style="display:none;"></p>' +
    '<div class="field"><label>Cargo</label><input type="text" id="f-cargo" value="' + c.cargo + '"></div>' +
    '<div class="field"><label>Telefone</label><div id="lista-telefones">' + telefonesHtml + '</div><span class="link-add" onclick="adicionarTelefone()">+ Adicionar telefone</span></div>' +
    '<div class="field"><label>E-mail</label><div id="lista-emails">' + emailsHtml + '</div><span class="link-add" onclick="adicionarEmail()">+ Adicionar e-mail</span></div>' +
    '<p class="error-text" id="erro-email-contato" style="display:none;"></p>' +
    '<div class="field"><label>Empresa do contato</label><select id="f-empresa">' + empresaOptions + '</select></div>' +
    '<div class="field"><label>Contato e envio de comunicação</label><select id="f-base-legal"><option value="">Não sei dizer ou não possuo base legal</option><option value="Consentimento"' + (c.baseLegal === "Consentimento" ? " selected" : "") + '>Consentimento</option><option value="Legitimo interesse"' + (c.baseLegal === "Legitimo interesse" ? " selected" : "") + '>Legítimo interesse</option></select></div>' +
    '<div class="field"><label>Origem de Marketing</label><input type="text" id="f-origem" value="' + (c.origemMarketing || '') + '"></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px;margin-bottom:8px;"><span style="font-size:11px;color:#94A3B8;letter-spacing:0.03em;">CAMPOS PERSONALIZADOS</span><span style="color:#0C7CD5;cursor:pointer;">&#8635;</span></div>' +
    '<span class="link-add" onclick="alertCampoPersonalizado()">+ Adicionar campo personalizado</span>' +
    '<div style="display:flex;gap:8px;margin-top:18px;"><button class="btn btn-primary" onclick="salvarContato()">' + (id ? "Salvar" : "Criar contato") + '</button><button class="btn btn-outline" onclick="fecharDrawer()">Cancelar</button></div>' +
    '</div>';
  abrirDrawer(html);
}

function alertCampoPersonalizado() {
  alert("Campo personalizado, ver Etapa 3");
}

function adicionarTelefone() {
  var wrap = document.getElementById('lista-telefones');
  var i = wrap.children.length;
  var div = document.createElement('div');
  div.className = 'phone-row';
  div.innerHTML = '<input type="text" id="tel-' + i + '" placeholder="+55 (99) 99999-9999"><span class="remove-x" onclick="this.parentElement.remove()">&#10005;</span>';
  wrap.appendChild(div);
}
function removerTelefone(i) {
  var el = document.getElementById('tel-' + i);
  if (el) el.parentElement.remove();
}
function adicionarEmail() {
  var wrap = document.getElementById('lista-emails');
  var i = wrap.children.length;
  var div = document.createElement('div');
  div.className = 'email-row';
  div.innerHTML = '<input type="email" id="email-' + i + '" placeholder="seunome@email.com"><span class="remove-x" onclick="this.parentElement.remove()">&#10005;</span>';
  wrap.appendChild(div);
}
function removerEmail(i) {
  var el = document.getElementById('email-' + i);
  if (el) el.parentElement.remove();
}

function validarMinimo(valor) {
  return valor && valor.trim().length >= 2;
}
function validarEmailFormato(email) {
  if (!email) return true;
  var re = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
  return re.test(email) && !/[À-ÿ #&%]/.test(email);
}

function salvarContato() {
  var nome = document.getElementById('f-nome').value.trim();
  var erroNome = document.getElementById('erro-nome-contato');
  if (!validarMinimo(nome)) {
    erroNome.textContent = 'Nome é obrigatório e precisa ter no mínimo 2 caracteres.';
    erroNome.style.display = 'block';
    return;
  }
  erroNome.style.display = 'none';

  var emailInputs = document.querySelectorAll('#lista-emails input');
  var emails = [];
  var erroEmail = document.getElementById('erro-email-contato');
  for (var i = 0; i < emailInputs.length; i++) {
    var v = emailInputs[i].value.trim();
    if (v) {
      if (!validarEmailFormato(v)) {
        erroEmail.textContent = 'Formato de e-mail inválido: ' + v;
        erroEmail.style.display = 'block';
        return;
      }
      emails.push(v);
    }
  }
  erroEmail.style.display = 'none';

  var telInputs = document.querySelectorAll('#lista-telefones input');
  var telefones = [];
  for (var j = 0; j < telInputs.length; j++) {
    var tv = telInputs[j].value.trim();
    if (tv) telefones.push({ ddi: "", numero: tv });
  }

  var cargo = document.getElementById('f-cargo').value.trim();
  var empresaId = document.getElementById('f-empresa').value ? parseInt(document.getElementById('f-empresa').value) : null;
  var baseLegal = document.getElementById('f-base-legal').value;
  var origem = document.getElementById('f-origem').value.trim();

  if (STATE6.editandoContatoId) {
    var c = STATE6.contatos.filter(function (x) { return x.id === STATE6.editandoContatoId; })[0];
    c.nome = nome; c.cargo = cargo; c.telefones = telefones; c.emails = emails; c.empresaId = empresaId; c.baseLegal = baseLegal; c.origemMarketing = origem;
    toast6('Alterações salvas');
  } else {
    STATE6.contatos.push({ id: nextContatoId++, nome: nome, cargo: cargo, telefones: telefones, emails: emails, empresaId: empresaId, baseLegal: baseLegal, origemMarketing: origem, status: "ativo" });
    toast6('Contato criado');
  }
  fecharDrawer();
  render6();
}

function pedirExclusaoContato(id) {
  var c = STATE6.contatos.filter(function (x) { return x.id === id; })[0];
  var vinculado = c.empresaId ? true : false;
  abrirModal(
    '<h3>Excluir Contato</h3>' +
    '<p style="font-size:12.5px;color:#64748B;margin-bottom:14px;">Como deseja excluir <strong>' + c.nome + '</strong>?</p>' +
    (vinculado ? '<div class="warn-box"><p>Este Contato está vinculado a uma Empresa. A exclusão removerá essa referência automaticamente.</p></div>' : '') +
    '<div style="display:flex;flex-direction:column;gap:8px;">' +
    '<button class="btn btn-outline" onclick="enviarContatoLixeira(' + id + ')">Enviar para a lixeira</button>' +
    '<button class="btn btn-danger" onclick="confirmarExclusaoPermanenteContato(' + id + ')">Excluir permanentemente</button>' +
    '<button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>' +
    '</div>'
  );
}
function enviarContatoLixeira(id) {
  fecharModal();
  toast6('Contato enviado para a lixeira');
}
function confirmarExclusaoPermanenteContato(id) {
  abrirModal(
    '<h3>Confirmar exclusão permanente</h3>' +
    '<p style="font-size:12.5px;color:#64748B;margin-bottom:14px;">Esta ação não pode ser desfeita.</p>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:14px;"><input type="checkbox" id="check-confirma-exclusao"> Entendo que esta ação é permanente</label>' +
    '<div style="display:flex;gap:8px;"><button class="btn btn-danger" onclick="excluirContatoPermanente(' + id + ')">Excluir permanentemente</button><button class="btn btn-outline" onclick="fecharModal()">Cancelar</button></div>'
  );
}
function excluirContatoPermanente(id) {
  if (!document.getElementById('check-confirma-exclusao').checked) {
    toast6('Marque a confirmação para excluir');
    return;
  }
  STATE6.contatos = STATE6.contatos.filter(function (c) { return c.id !== id; });
  fecharModal();
  toast6('Contato excluído permanentemente');
  render6();
}

/* ===================== EMPRESAS ===================== */

function contatosDaEmpresa(empresaId) {
  return STATE6.contatos.filter(function (c) { return c.empresaId === empresaId; });
}

function renderEmpresasListagem() {
  var rows = STATE6.empresas.map(function (e) {
    return '<tr>' +
      '<td><span class="link" onclick="abrirEmpresaDetalhe(' + e.id + ')">' + e.nome + '</span></td>' +
      '<td style="color:#94A3B8;">' + nomeSegmento(e.segmentoId) + '</td>' +
      '<td style="color:#94A3B8;">' + contatosDaEmpresa(e.id).length + '</td>' +
      '<td><span class="link" onclick="pedirExclusaoEmpresa(' + e.id + ')" title="Excluir">&#128465;</span></td>' +
      '</tr>';
  }).join("");

  document.getElementById('content').innerHTML =
    '<div class="toprow"><h2 style="margin:0;"><span style="color:#0a5f56;">&#127970;</span> Empresas</h2><button class="btn btn-primary" onclick="abrirDrawerEmpresa(null)">+ Criar empresa</button></div>' +
    '<div class="search-box">Buscar por nome &#128269;</div>' +
    '<table><tr><th>Empresa</th><th>Segmento</th><th>Contatos</th><th style="width:40px;"></th></tr>' +
    rows + '</table>';
}

function abrirEmpresaDetalhe(id) {
  STATE6.editandoEmpresaId = id;
  STATE6.view = "empresa-detalhe";
  render6();
}

function renderEmpresaDetalhe() {
  var e = STATE6.empresas.filter(function (x) { return x.id === STATE6.editandoEmpresaId; })[0];
  var contatos = contatosDaEmpresa(e.id);
  var contatosHtml = contatos.map(function (c) {
    return '<tr><td>' + c.nome + '</td><td style="color:#94A3B8;">' + (c.cargo || '-') + '</td></tr>';
  }).join("") || '<tr><td colspan="2" style="color:#94A3B8;">Nenhum contato vinculado</td></tr>';

  document.getElementById('content').innerHTML =
    '<div class="breadcrumb"><span class="link" onclick="irPara(\\'empresas-listagem\\')">Empresas</span> / ' + e.nome + '</div>' +

        <p style="font-size:10px;color:#94A3B8;text-transform:uppercase;padding:10px 14px 4px;margin:0;">Funil de vendas</p>

      \${renderKanbanCols(f.etapas)}
      <div style="background:#F0F9F7;border-radius:8px;padding:10px;border:1px dashed #B8E6DC;">
        <p style="font-size:11.5px;color:#0a5f56;margin:0 0 8px;font-weight:600;">Personalize seu funil de vendas</p>
        <p style="font-size:10.5px;color:#0a5f56;margin:0;">Crie funis e edite-os, adicionando, removendo e renomeando etapas conforme o processo de vendas da sua equipe</p>

}

function renderFunilDropdownItems(funisAtivos, f) {
  let html = '';
  for (const fn of funisAtivos) {
    const estilo = fn.id === f.id ? 'background:#E6F1FB;color:#0C447C;font-weight:600;' : 'color:#16232F;';
    html += '<div onclick="selecionarFunil(' + fn.id + ')" style="padding:9px 14px;font-size:13px;cursor:pointer;' + estilo + '">' + fn.nome + '</div>';
  }
  return html;
}

function renderKanbanCols(etapas) {
  let html = '';
  for (const e of etapas) {
    html += '<div class="kanban-col"><p class="titulo">' + e.nome + ' <span style="color:#94A3B8;font-weight:400;">(' + e.negociacoes + ')</span></p><p class="valor">R$ 0,00</p></div>';
  }
  return html;
}

function toggleFunilDropdown(evt) {
  evt.stopPropagation();
  const el = document.getElementById('funil-dropdown');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function selecionarFunil(id) {
  STATE.activeFunilId = id;
  render();
  showToast('Funil selecionado');
}

/* ============ TELA CONFIG FUNIS (listagem + trilha + etapas) ============ */
function renderConfigFunis(c) {
  const funisAtivos = STATE.funis.filter(x => !x.arquivado);
  c.innerHTML = \`
    <a onclick="goToNegociacoes()" style="font-size:12px;color:#64748B;cursor:pointer;display:inline-block;margin-bottom:1rem;">← Voltar</a>
    <div style="display:flex;gap:16px;border-bottom:1px solid #E2E8F0;margin-bottom:1.5rem;font-size:12px;">
      <div style="padding-bottom:6px;font-weight:600;border-bottom:2px solid #00D9C0;color:#0a5f56;">Funil de vendas</div>
      <div style="padding-bottom:6px;color:#94A3B8;">CRM2CRM</div>
    </div>
    \${funisAtivos.map(f => renderFunilBlock(f)).join('<div style="border-top:1px solid #E2E8F0;margin:2rem 0;"></div>')}
    <button class="btn primary" style="margin-top:1.5rem;" onclick="criarFunil()">Adicionar Funil de Vendas</button>
  \`;
}

function renderFunilBlock(f) {
  let trilha = '';
  for (let i = 0; i < f.etapas.length; i++) {
    const e = f.etapas[i];
    const selClass = STATE.etapaSelecionadaId === e.id ? 'selecionada' : '';
    trilha += '<div class="trilha-bolinha ' + selClass + '" onclick="selecionarEtapa(' + f.id + ', ' + e.id + ')"></div>';
    if (STATE.etapaSelecionadaId === e.id) {
      trilha += '<div class="trilha-setas"><span onclick="moverEtapa(' + f.id + ',' + e.id + ',-1)">‹</span><span onclick="moverEtapa(' + f.id + ',' + e.id + ',1)">›</span></div>';
    }
    if (i < f.etapas.length - 1) {
      trilha += '<div class="trilha-linha"></div>';
    }
  }

  let etapasCards = '';
  for (const e of f.etapas) {
    const onClass = e.destacarEsfriando ? 'on' : '';
    let diasBlock = '';
    if (e.destacarEsfriando) {
      diasBlock = '<div style="margin-top:4px;"><input type="number" value="' + e.dias + '" style="width:36px;font-size:10.5px;padding:2px 4px;border:1px solid #CBD5E1;border-radius:4px;" onchange="atualizarDias(' + f.id + ',' + e.id + ',this.value)"> <span style="font-size:10px;">dias</span></div>';
    }
    etapasCards += '<div class="etapa-card">' +
      '<strong contenteditable="true" onblur="renomearEtapaInline(' + f.id + ', ' + e.id + ', this.innerText)">' + e.nome + '</strong>' +
      '<span>Sigla: ' + e.sigla + '</span>' +
      '<div class="toggle-row"><span style="font-size:10.5px;">Destacar esfriando</span>' +
      '<button class="mini-toggle ' + onClass + '" onclick="toggleEsfriando(' + f.id + ',' + e.id + ')"><span class="knob"></span></button></div>' +
      diasBlock +
      '<p class="cfg-link" onclick="abrirConfigurarEtapa(' + f.id + ', ' + e.id + ')">⚙ Configurar etapa</p>' +
      '</div>';
  }

  let deletarLink = '';
  if (STATE.etapaSelecionadaId) {
    const etapaSel = f.etapas.find(e => e.id === STATE.etapaSelecionadaId);
    const nomeSel = etapaSel ? etapaSel.nome : '';
    deletarLink = '<p style="font-size:11px;color:#E45858;margin-top:1rem;cursor:pointer;" onclick="abrirModalExcluirEtapa(' + f.id + ')">🗑️ Deletar etapas selecionadas: <strong>' + nomeSel + '</strong></p>';
  }

  return \`
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
        <div style="display:flex;align-items:center;gap:8px;">
          <strong style="font-size:15px;">\${f.nome}</strong>
          <button class="btn-icon" onclick="abrirMenuFunil(event, \${f.id})">⋮</button>
        </div>
        <button class="btn" style="font-size:11.5px;">+ Automação entre funis</button>
      </div>
      <div class="trilha">\${trilha}<button class="trilha-add" onclick="criarEtapa(\${f.id})">+</button></div>
      <div class="etapas-grid" style="grid-template-columns:repeat(\${Math.min(f.etapas.length,6)},1fr);">\${etapasCards}</div>
      \${deletarLink}
    </div>
  \`;
}

function selecionarEtapa(funilId, etapaId) {
  STATE.etapaSelecionadaId = STATE.etapaSelecionadaId === etapaId ? null : etapaId;
  render();
}

function moverEtapa(funilId, etapaId, direcao) {
  const f = STATE.funis.find(x => x.id === funilId);
  const idx = f.etapas.findIndex(e => e.id === etapaId);
  const novoIdx = idx + direcao;
  if (novoIdx < 0 || novoIdx >= f.etapas.length) return;
  const temp = f.etapas[idx];
  f.etapas[idx] = f.etapas[novoIdx];
  f.etapas[novoIdx] = temp;
  render();
  showToast('Etapa reordenada');
}

function renomearEtapaInline(funilId, etapaId, novoNome) {
  novoNome = novoNome.trim();
  const f = STATE.funis.find(x => x.id === funilId);
  const e = f.etapas.find(x => x.id === etapaId);
  if (!novoNome) { showToast('Nome da etapa não pode ficar em branco'); render(); return; }
  e.nome = novoNome;
  showToast('Etapa renomeada');
}

function toggleEsfriando(funilId, etapaId) {
  const f = STATE.funis.find(x => x.id === funilId);
  const e = f.etapas.find(x => x.id === etapaId);
  e.destacarEsfriando = !e.destacarEsfriando;
  render();
}
function atualizarDias(funilId, etapaId, valor) {
  const f = STATE.funis.find(x => x.id === funilId);
  const e = f.etapas.find(x => x.id === etapaId);
  e.dias = parseInt(valor) || 1;
}

function criarEtapa(funilId) {
  const f = STATE.funis.find(x => x.id === funilId);
  const novaEtapa = { id: nextEtapaId++, nome: 'Nova Etapa', sigla: 'NE', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 };
  f.etapas.push(novaEtapa);
  render();
  showToast('Etapa criada');
}

function abrirConfigurarEtapa(funilId, etapaId) {
  const f = STATE.funis.find(x => x.id === funilId);
  const e = f.etapas.find(x => x.id === etapaId);
  const idx = f.etapas.findIndex(x => x.id === etapaId);
  const html = \`
    <div style="background:#F7F9FB;border-radius:10px;padding:1rem;max-width:420px;margin-top:1.5rem;">
      <div style="display:flex;justify-content:space-between;margin-bottom:0.75rem;"><h4 style="margin:0;font-size:14px;">Configuração da etapa</h4><span style="color:#94A3B8;cursor:pointer;" onclick="fecharConfigurarEtapa()">✕</span></div>
      <div class="info-box" style="font-size:10.5px;">💡 Quando você define que um campo é obrigatório, a negociação só avança para a próxima etapa se a informação estiver preenchida.</div>
      <label class="field-label">Nome da etapa</label>
      <input class="field-input" id="cfg-etapa-nome" value="\${e.nome}">
      <label class="field-label">Descrição de etapa</label>
      <textarea class="field-input" id="cfg-etapa-desc" style="height:60px;" placeholder="Orientação para o time de vendas nesta etapa.">\${e.descricao}</textarea>
      <div class="modal-footer">
        <button class="btn" onclick="fecharConfigurarEtapa()">Cancelar</button>
        <button class="btn primary" onclick="salvarConfigurarEtapa(\${funilId}, \${etapaId})">Salvar</button>
      </div>
    </div>
  \`;
  window._configEtapaHtml = html;
  window._configEtapaFunilId = funilId;
  render();
  setTimeout(() => {
    const grids = document.querySelectorAll('.etapas-grid');
    grids.forEach(g => {
      if (g.parentElement.querySelector('.trilha')) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = window._configEtapaHtml;
        g.parentElement.appendChild(wrapper.firstElementChild);
      }
    });
  }, 0);
}
function fecharConfigurarEtapa() { window._configEtapaHtml = null; render(); }
function salvarConfigurarEtapa(funilId, etapaId) {
  const f = STATE.funis.find(x => x.id === funilId);
  const e = f.etapas.find(x => x.id === etapaId);
  e.nome = document.getElementById('cfg-etapa-nome').value || e.nome;
  e.descricao = document.getElementById('cfg-etapa-desc').value;
  window._configEtapaHtml = null;
  render();
  showToast('Alterações salvas');
}

function abrirModalExcluirEtapa(funilId) {
  openModal(\`
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><h3>Deseja excluir as Etapas do Funil?</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <p style="font-size:11.5px;color:#47576A;margin:0 0 0.5rem;">Você pode enviar as Etapas do Funil para a lixeira ou excluir permanentemente da sua conta.</p>
    <p style="font-size:11.5px;color:#47576A;margin:0 0 1rem;">Importante: ao excluir uma etapa, todas as negociações vinculadas a ela (caso existam) serão movidas para a primeira etapa do funil.</p>
    <label style="font-size:11.5px;display:flex;gap:8px;align-items:flex-start;margin-bottom:1.25rem;"><input type="checkbox" id="chk-confirma-exclusao" style="width:auto;margin-top:2px;" onchange="togglePermanenteBtn()">Entendo que ao excluir não conseguirei recuperar a informação.</label>
    <div style="display:flex;justify-content:space-between;">
      <button class="btn" style="border:none;color:#0C447C;" onclick="excluirEtapaViaLixeira(\${funilId})">Enviar para a lixeira</button>
      <button class="btn danger-fill disabled" id="btn-excluir-permanente" onclick="excluirEtapaPermanente(\${funilId})" disabled>Excluir permanentemente</button>
    </div>
  \`);
}
function togglePermanenteBtn() {
  const chk = document.getElementById('chk-confirma-exclusao');
  const btn = document.getElementById('btn-excluir-permanente');
  if (chk.checked) { btn.classList.remove('disabled'); btn.disabled = false; }
  else { btn.classList.add('disabled'); btn.disabled = true; }
}

function realocarEExcluir(funilId, permanente) {
  const f = STATE.funis.find(x => x.id === funilId);
  const idx = f.etapas.findIndex(e => e.id === STATE.etapaSelecionadaId);
  if (idx === -1) return false;
  const etapa = f.etapas[idx];

  if (idx === 0 && etapa.negociacoes > 0) {
    closeModal();
    showToast('Bloqueado: 1ª etapa com negociações não pode ser excluída');
    return false;
  }
  if (etapa.negociacoes > 0) {
    f.etapas[0].negociacoes += etapa.negociacoes;
  }
  f.etapas.splice(idx, 1);
  STATE.etapaSelecionadaId = null;
  closeModal();
  render();
  showToast(permanente ? 'Etapa excluída permanentemente' : 'Solicitação de exclusão enviada para a Lixeira');
  return true;
}
function excluirEtapaViaLixeira(funilId) { realocarEExcluir(funilId, false); }
function excluirEtapaPermanente(funilId) { realocarEExcluir(funilId, true); }

/* ============ MENU DE 3 PONTINHOS DO FUNIL ============ */
function abrirMenuFunil(evt, funilId) {
  evt.stopPropagation();
  const menu = document.getElementById('ctx-menu');
  const f = STATE.funis.find(x => x.id === funilId);
  const ativos = STATE.funis.filter(x => !x.arquivado).length;
  menu.innerHTML = \`
    <div class="ctx-item" onclick="closeCtx(); renomearFunilPrompt(\${funilId})">Renomear</div>
    <div class="ctx-item" onclick="closeCtx(); marcarComoPadrao(\${funilId})">Marcar como padrão</div>
    <div class="ctx-item" onclick="closeCtx(); abrirPreferenciasFunil(\${funilId})">Preferências do funil</div>
    <div class="ctx-item" onclick="closeCtx(); abrirEquipesFunil(\${funilId})">Equipes do funil</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item muted" onclick="closeCtx(); arquivarFunil(\${funilId})">Arquivar funil</div>
    <div class="ctx-item danger" onclick="closeCtx(); abrirModalExcluirFunil(\${funilId})">Excluir funil</div>
  \`;
  const rect = evt.target.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  menu.style.left = (rect.left + window.scrollX - 170) + 'px';
  menu.style.width = '210px';
  menu.classList.add('open');
}

function renomearFunilPrompt(funilId) {
  const f = STATE.funis.find(x => x.id === funilId);
  openModal(\`
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><h3>Renomear funil</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <label class="field-label">Nome do funil</label>
    <input class="field-input" id="renomear-funil-input" value="\${f.nome}">
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarRenomearFunil(\${funilId})">Salvar</button>
    </div>
  \`);
}
function confirmarRenomearFunil(funilId) {
  const nome = document.getElementById('renomear-funil-input').value.trim();
  if (!nome) { showToast('Nome não pode ficar em branco'); return; }
  const f = STATE.funis.find(x => x.id === funilId);
  f.nome = nome;
  closeModal();
  render();
  showToast('Funil renomeado');
}

function marcarComoPadrao(funilId) {
  STATE.funis.forEach(f => f.padrao = false);
  STATE.funis.find(x => x.id === funilId).padrao = true;
  render();
}

function arquivarFunil(funilId) {
  const ativos = STATE.funis.filter(x => !x.arquivado);
  if (ativos.length <= 1) {
    showToast('Bloqueado: não é possível arquivar o único funil ativo');
    return;
  }
  const f = STATE.funis.find(x => x.id === funilId);
  f.arquivado = true;
  if (f.padrao) f.padrao = false;
  if (STATE.activeFunilId === funilId) STATE.activeFunilId = STATE.funis.find(x => !x.arquivado).id;
  render();
  showToast('Funil arquivado');
}

function abrirModalExcluirFunil(funilId) {
  const f = STATE.funis.find(x => x.id === funilId);
  openModal(\`
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><h3>Excluir funil "\${f.nome}"?</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <p style="font-size:11.5px;color:#47576A;margin:0 0 1rem;">Esta ação é permitida mesmo sendo o único funil da conta. A exclusão passa pela tela de Lixeira: vira uma solicitação em "Exclusões Pendentes", que precisa ser aprovada para se efetivar.</p>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarExcluirFunil(\${funilId})">Enviar para a Lixeira</button>
    </div>
  \`);
}
function confirmarExcluirFunil(funilId) {
  closeModal();
  showToast('Solicitação de exclusão enviada para a Lixeira');
}

/* ============ CRIAR FUNIL (inline, sem modal) ============ */
function criarFunil() {
  STATE.funilCriadoContador++;
  const novoFunil = {
    id: nextFunilId++,
    nome: \`Funil de vendas \${STATE.funilCriadoContador}\`,
    padrao: false,
    arquivado: false,
    equipesVisiveis: [],
    etapas: [
      { id: nextEtapaId++, nome: 'Sem contato', sigla: 'SC', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },
      { id: nextEtapaId++, nome: 'Contato feito', sigla: 'CF', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },
      { id: nextEtapaId++, nome: 'Identificação do interesse', sigla: 'IDI', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },
      { id: nextEtapaId++, nome: 'Apresentação', sigla: 'A', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },
      { id: nextEtapaId++, nome: 'Proposta enviada', sigla: 'PE', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },
    ],
  };
  STATE.funis.push(novoFunil);
  render();
  showToast('Funil criado');
}

/* ============ PREFERÊNCIAS DO FUNIL ============ */
function renderProdutoCheckboxes() {
  let html = '';
  for (const p of STATE.produtos) {
    const checked = p.exibirNoFunil ? 'checked' : '';
    html += '<label style="font-size:12.5px;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;"><span>' + p.nome + '</span><input type="checkbox" ' + checked + ' onchange="toggleProdutoExibirFromPreferencias(' + p.id + ')"></label>';
  }
  return html;
}

function abrirPreferenciasFunil(funilId) {
  STATE.activeFunilId = funilId;
  const f = STATE.funis.find(x => x.id === funilId);
  const abaProdutosAtiva = STATE.prefAbaAtiva === 'produtos';
  openModal(\`
    <div style="display:flex;justify-content:space-between;margin-bottom:0.75rem;"><h3>\${f.nome}</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <div style="display:flex;gap:20px;border-bottom:1px solid #E2E8F0;margin-bottom:1rem;font-size:13px;">
      <div style="padding-bottom:8px;cursor:pointer;font-weight:\${abaProdutosAtiva ? '600' : '400'};color:\${abaProdutosAtiva ? '#0a5f56' : '#64748B'};border-bottom:\${abaProdutosAtiva ? '2px solid #00D9C0' : 'none'};" onclick="STATE.prefAbaAtiva='produtos'; abrirPreferenciasFunil(STATE.activeFunilId);">Produtos e serviços do funil</div>
      <div style="padding-bottom:8px;cursor:pointer;font-weight:\${abaProdutosAtiva ? '400' : '600'};color:\${abaProdutosAtiva ? '#64748B' : '#0a5f56'};border-bottom:\${abaProdutosAtiva ? 'none' : '2px solid #00D9C0'};" onclick="STATE.prefAbaAtiva='motivos'; abrirPreferenciasFunil(STATE.activeFunilId);">Motivos de perda do funil</div>
    </div>
    \${abaProdutosAtiva ? renderAbaProdutosPreferencias() : renderAbaMotivosPreferencias()}
    <div class="modal-footer"><button class="btn primary" onclick="closeModal()">Fechar</button></div>
  \`);
}
function renderAbaProdutosPreferencias() {
  const semProdutos = STATE.produtos.every(p => !p.exibirNoFunil);
  const aviso = semProdutos ? '<div class="danger-box"><strong>Funil sem produtos e serviços</strong><p style="font-size:11px;margin:4px 0 0;">Todo funil precisa ter pelo menos um produto ou serviço. Caso contrário, serão exibidos todos os produtos e serviços disponíveis.</p></div>' : '';
  return aviso +
    '<div style="border:1px solid #E2E8F0;border-radius:6px;padding:6px;">' + renderProdutoCheckboxes() + '</div>' +
    '<p style="font-size:10px;color:#94A3B8;margin-top:0.75rem;">Este é o mesmo controle da coluna "Exibir no funil" na listagem de Produtos e Serviços; alterar aqui reflete lá, e vice-versa.</p>';
}
function renderAbaMotivosPreferencias() {
  const semMotivos = STATE.motivosPerda.every(m => !m.exibirNoFunil);
  const aviso = semMotivos
    ? '<div class="danger-box"><strong>Funil sem motivos de perda ativos</strong><p style="font-size:11px;margin:4px 0 0;">Todo funil precisa ter pelo menos um motivo de perda ativado. Enquanto nenhum estiver ativo, o encerramento de negociações como perdidas fica bloqueado neste funil. (Diferente da aba Produtos e Serviços: aqui a ausência de seleção bloqueia, não mostra todos.)</p></div>'
    : '';
  return aviso +
    '<div style="border:1px solid #E2E8F0;border-radius:6px;padding:6px;">' + renderMotivoCheckboxes() + '</div>' +
    '<p style="font-size:10px;color:#94A3B8;margin-top:0.75rem;">O cadastro, edição, arquivamento e exclusão dos motivos em si é feito na tela Motivo de Perda (Configurações → Motivo de perda). Aqui você só define quais ficam visíveis neste funil.</p>';
}
function renderMotivoCheckboxes() {
  let html = '';
  for (const m of STATE.motivosPerda) {
    const checked = m.exibirNoFunil ? 'checked' : '';

  }
  return html;
}
function toggleProdutoExibirFromPreferencias(produtoId) {
  const p = STATE.produtos.find(x => x.id === produtoId);
  p.exibirNoFunil = !p.exibirNoFunil;
  abrirPreferenciasFunil(STATE.activeFunilId);
}
function toggleMotivoExibirFromPreferencias(motivoId) {
  const m = STATE.motivosPerda.find(x => x.id === motivoId);
  m.exibirNoFunil = !m.exibirNoFunil;
  abrirPreferenciasFunil(STATE.activeFunilId);
}

/* ============ EQUIPES DO FUNIL ============ */
function abrirEquipesFunil(funilId) {
  STATE.activeFunilId = funilId;
  const f = STATE.funis.find(x => x.id === funilId);
  openDrawer(\`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:16px;">Editar funil</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeDrawer()">✕</span>
    </div>
    <label class="field-label">Nome do funil</label>
    <input class="field-input" id="edit-funil-nome" value="\${f.nome}">
    <label class="field-label">Selecione quem pode ver este funil</label>
    <div style="border:1px solid #0C7CD5;border-radius:6px;padding:9px 10px;margin-bottom:6px;font-size:13px;cursor:default;">Selecionar equipes ▾</div>
    <div style="border:1px solid #E2E8F0;border-radius:8px;padding:6px;margin-bottom:12px;">
      \${renderEquipeCheckboxes(f)}
    </div>
    <div class="info-box">Algumas pessoas podem usar funis que não estão visíveis para determinadas pessoas ou equipes. Por padrão, Administradores sempre veem o funil, mesmo com visibilidade restrita; para restringir também o Administrador, altere o papel dele para Usuário.</div>
    <div class="drawer-footer">
      <button class="btn" onclick="closeDrawer()">Cancelar</button>
      <button class="btn primary" onclick="salvarEquipesFunil(\${funilId})">Salvar</button>
    </div>
  \`);
}
function renderEquipeCheckboxes(f) {
  const todasMarcado = f.equipesVisiveis.length === 0;
  let html = '<label style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;padding:8px 6px;"><input type="checkbox" ' + (todasMarcado ? 'checked' : '') + ' onchange="toggleTodasEquipes(' + f.id + ')">Todas as equipes</label>';
  for (const eq of STATE.equipes) {
    const checked = f.equipesVisiveis.includes(eq.id) ? 'checked' : '';
    html += '<label style="font-size:13px;display:flex;align-items:center;gap:8px;padding:8px 6px;"><input type="checkbox" ' + checked + ' onchange="toggleEquipeVisivel(' + f.id + ',' + eq.id + ')">' + eq.nome + '</label>';
  }
  return html;
}
function toggleTodasEquipes(funilId) {
  const f = STATE.funis.find(x => x.id === funilId);
  f.equipesVisiveis = [];
  abrirEquipesFunil(funilId);
}
function toggleEquipeVisivel(funilId, equipeId) {
  const f = STATE.funis.find(x => x.id === funilId);
  if (f.equipesVisiveis.includes(equipeId)) {
    f.equipesVisiveis = f.equipesVisiveis.filter(id => id !== equipeId);
  } else {
    f.equipesVisiveis = f.equipesVisiveis.filter(id => id !== null).concat([equipeId]);
  }
  abrirEquipesFunil(funilId);
}
function salvarEquipesFunil(funilId) {
  const f = STATE.funis.find(x => x.id === funilId);
  const novoNome = document.getElementById('edit-funil-nome').value.trim();
  if (novoNome) f.nome = novoNome;
  closeDrawer();
  render();
  showToast('Visibilidade do funil atualizada');
}

  \`;
}
function renderTabelaMotivos() {
  let rows = '<tr><th>Nome do Motivo de Perda (' + STATE.motivosPerda.length + ')</th><th>Criado em</th><th style="width:20px;"></th></tr>';
  for (const m of STATE.motivosPerda) {
    rows += '<tr><td>' + m.nome + '</td><td style="color:#94A3B8;">' + m.criadoEm + '</td><td><span style="cursor:pointer;" onclick="excluirMotivoPerda(' + m.id + ')">🗑️</span></td></tr>';
  }
  return '<table>' + rows + '</table>';
}

function criarMotivoPerda() {
  const input = document.getElementById('novo-motivo-input');
  const nome = input.value.trim();
  if (!nome) { showToast('Nome do motivo é obrigatório'); return; }
  const hoje = new Date().toLocaleDateString('pt-BR');
  STATE.motivosPerda.push({ id: nextMotivoId++, nome, criadoEm: hoje });
  render();
  showToast('Motivo de perda criado');
}
function excluirMotivoPerda(id) {
  STATE.motivosPerda = STATE.motivosPerda.filter(m => m.id !== id);
  render();
  showToast('Motivo de perda excluído; negociações que já usavam mantêm o histórico');
}
