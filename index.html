  },
  "2": {
    descricao: `O Funil de Vendas é o espaço onde o time comercial acompanha o andamento das negociações, organizadas em colunas (etapas) por estágio do processo de venda, em formato kanban. É a tela principal de trabalho do vendedor no dia a dia, diferente da Gestão de Acesso, que é uma tela de configuração usada esporadicamente pelo Administrador.</p><p>O sistema já nasce com <strong>1 funil criado por padrão</strong>, chamado "Funil Padrão", com um conjunto de etapas padrão. O MVP do CRM Vigos opera com esse único funil; a estrutura já suporta múltiplos funis simultâneos, mas essa possibilidade fica reservada para a Etapa 11, Múltiplos Funis, fora deste MVP.</p><p>Cada Funil de Vendas é identificado por um nome, e é o "contêiner" que agrupa: suas próprias Etapas, sua configuração de quais Equipes podem vê-lo, e sua seleção de quais Produtos/Serviços e Motivos de Perda estão disponíveis nele. Toda negociação pertence a exatamente 1 funil e a exatamente 1 etapa dentro dele.`,
    porque: `Sem o Funil, não existe lugar para uma Negociação existir: é a peça da qual todo o módulo comercial depende. É também o que dá ao Administrador controle sobre como o processo de vendas da empresa está desenhado: quantas etapas existem, quais nomes elas têm, e quem no time enxerga cada funil.</p><p>A ordem de construção técnica reflete essa dependência: Funil precisa existir antes de Etapa; Etapa precisa existir antes de Negociação.`,
    subetapas: [
      { titulo: "Criar Funil", texto: `O Administrador clica no botão "Adicionar Funil de Vendas", na tela de configuração (Configurações → Funis de vendas). <strong>Não existe modal ou tela intermediária pedindo o nome antes</strong>: o novo funil já nasce direto na listagem, com um nome sugerido automaticamente (ex: "Funil de vendas 12", numerado), em campo de texto já editável, e as etapas padrão já visíveis e configuráveis logo abaixo.<br><br><strong>Nome é obrigatório, mas nasce preenchido</strong>: como o campo já vem com um nome sugerido, na prática o Administrador raramente encontra o campo vazio; ainda assim, se ele apagar todo o conteúdo e tentar sair do campo, o sistema deve impedir salvar em branco.<br><br><strong>Não há validação de nome único</strong>: dois ou mais funis podem coexistir com exatamente o mesmo nome, sem gerar erro. Isso é diferente da regra de Motivo de Perda, que exige nome único.<br><br>Ao ser criado, o funil já nasce com um conjunto de etapas padrão. Não é possível criar um funil "vazio", sem nenhuma etapa; o conjunto padrão serve como ponto de partida, e cada etapa dele pode ser renomeada, reordenada, excluída ou complementada livremente depois.` },
      { titulo: "Funil Padrão", texto: `No MVP, "Funil Padrão" é apenas o <strong>nome</strong> do único funil que já vem criado no sistema, não é uma marcação especial ou um status técnico separado. É esse funil que abre automaticamente na tela de Negociações, pela simples razão de ser o único existente na conta. O nome "Funil Padrão" pode ser trocado livremente pelo Administrador (ação "Renomear"), sem nenhum efeito colateral no funcionamento do sistema.` },
      { titulo: "Menu de ações do Funil", texto: `Cada funil tem um menu de contexto, ícone de três pontos, com 6 ações: <strong>Renomear</strong>, <strong>Marcar como padrão</strong>, <strong>Preferências do funil</strong>, <strong>Equipes do funil</strong>, <strong>Arquivar funil</strong>, <strong>Excluir funil</strong>.<br><br><strong>Renomear</strong>: segue a mesma regra de nome obrigatório da criação; o sistema não permite salvar um nome em branco também aqui.<br><br><strong>Marcar como padrão</strong>: ação direta, sem confirmação visual (toast) e sem indicador visual (badge) na listagem mostrando qual funil está marcado como padrão neste MVP. É uma ação interna, refletida apenas no comportamento do sistema (qual funil abre automaticamente).<br><br><strong>Arquivar funil</strong>: ação reversível e independente de Excluir. Um funil arquivado deixa de aparecer no dropdown de seleção e na visualização kanban ativa, mas permanece acessível em uma lista separada de funis arquivados, de onde pode ser restaurado.<br><br><strong>Regra de borda, arquivar o único funil</strong>: <strong>bloqueado</strong>. Assim como Excluir, o sistema não permite arquivar o único funil ativo da conta, para garantir que sempre exista pelo menos 1 funil operacional visível.<br><br><strong>Regra de borda, arquivar o funil padrão</strong>: se um funil marcado como padrão for arquivado (cenário relevante quando houver múltiplos funis), a marcação de padrão não é transferida automaticamente para outro funil; a conta fica sem funil padrão definido até o Administrador escolher outro manualmente.<br><br><strong>Excluir funil, regras confirmadas</strong>:<br>• Diferente de Arquivar, a exclusão de funil <strong>é permitida mesmo sendo o único funil da conta</strong>. Não existe, neste MVP, uma trava impedindo essa ação.<br>• Segue o mesmo mecanismo transversal da tela de <strong>Lixeira</strong> (Configurações → Lixeira), com 3 abas: Exclusões Pendentes, Exclusões Aprovadas, Exclusões Negadas. A exclusão de um funil vira uma solicitação pendente de aprovação, não uma exclusão imediata.<br><br>⚠️ <em>Ponto de atenção para o time de UX/Produto: como a exclusão de funil não é imediata (passa pela Lixeira), o funil segue existindo e operacional até a exclusão ser aprovada. Isso significa que "o CRM ficar sem nenhum funil" só acontece de fato depois da aprovação da exclusão, vale desenhar esse intervalo com cuidado.</em>` },
      { titulo: "Editar nome de uma Etapa", texto: `O nome de cada etapa é editável diretamente na trilha do funil, clicando sobre o texto. Não abre modal separado, a edição acontece inline.` },
      { titulo: "Criar Etapa", texto: `Botão "+" ao final da trilha adiciona uma nova etapa, que nasce com o nome "Nova Etapa" e uma sigla automática, renomeável em seguida. Uma etapa recém-criada nasce <strong>sem nenhuma negociação vinculada</strong> e vai para o <strong>final</strong> da trilha, como última posição. A reordenação para outra posição é uma ação separada.` },
      { titulo: "Configurar Etapa", texto: `Ícone "Configurar etapa" abre um painel com Nome da etapa e Descrição de etapa, texto livre que explica ao vendedor o que fazer naquela etapa. Este é o mesmo campo Nome da sub-etapa "Editar nome de uma Etapa"; o painel de Configurar Etapa é um segundo caminho para editar o nome, com a vantagem de também expor a Descrição junto.` },
      { titulo: "Destacar negociações esfriando", texto: `Em cada etapa, um toggle "Destacar negociações esfriando na etapa" pode ser ativado, revelando um campo numérico de dias. Esse número define o limite de dias sem interação que caracteriza uma negociação como "esfriando" <strong>naquela etapa especificamente</strong>, ou seja, é uma configuração por etapa, não uma regra única para o funil inteiro (etapas diferentes podem ter limites diferentes de dias).` },
      { titulo: "Reordenar Etapa", texto: `Ao clicar em uma etapa na trilha, aparecem setas ◀ ▶ que movem aquela etapa uma posição para frente ou para trás por clique. É um reposicionamento incremental, não um arrastar-e-soltar livre. Mover uma etapa não afeta as negociações que estão nela; elas permanecem vinculadas à mesma etapa, independente da nova posição dela na trilha.` },
      { titulo: "Excluir Etapa", texto: `O Administrador seleciona a etapa (ou mais de uma) e clica em "Deletar etapas selecionadas". Abre um modal, "Deseja excluir as Etapas do Funil?", com 2 caminhos possíveis:<br><br>• <strong>Enviar para a lixeira</strong>: reversível, vira uma solicitação em "Exclusões Pendentes" na tela de Lixeira (Configurações → Lixeira), que precisa ser aprovada por um Administrador para se efetivar (ou pode ser negada, indo para "Exclusões Negadas").<br>• <strong>Excluir permanentemente</strong>: irreversível; o botão só é habilitado depois que o Administrador marca um checkbox de confirmação ("Entendo que ao excluir não conseguirei recuperar a informação").<br><br>Esta é uma <strong>ação exclusiva de Administrador</strong>: o link "Deletar etapas selecionadas" e a possibilidade de selecionar uma etapa para exclusão ficam ocultos na interface para usuários que não sejam Administrador; não é uma validação que aparece após o clique, o caminho simplesmente não é visível para esse perfil.<br><br><strong>Regra de realocação de negociações</strong>: ao excluir uma etapa que tem negociações vinculadas, elas são movidas automaticamente para a <strong>1ª etapa do funil</strong>.<br><br><strong>Regra de borda, excluindo a própria 1ª etapa</strong>: se a etapa sendo excluída for justamente a 1ª etapa do funil (e tiver negociações nela), a realocação automática não tem para onde apontar. Nesse caso, a ação fica <strong>bloqueada</strong>: o sistema não permite excluir a 1ª etapa do funil enquanto ela for a única "primeira posição" disponível. Na prática, isso significa que o Administrador precisaria primeiro reordenar outra etapa para a 1ª posição, ou criar uma nova 1ª etapa, antes de conseguir excluir a que ocupava esse lugar.<br><br><strong>Regra de borda, última etapa do funil</strong>: como consequência da regra acima, um funil só pode chegar a 0 etapas se estiver completamente vazio de negociações ao longo de todo o processo de exclusão. Se houver qualquer negociação em qualquer etapa restante, a última etapa (que necessariamente será a 1ª) fica protegida contra exclusão.` },
      { titulo: "Preferências do Funil", texto: `Abre em 2 abas: "Produtos e serviços do funil" e "Motivos de perda do funil". Em cada aba, o Administrador seleciona quais itens (já cadastrados globalmente) ficam disponíveis <strong>especificamente naquele funil</strong>.<br><br><strong>Mesmo controle da coluna "Exibir no funil"</strong>: a coluna "Exibir no funil" na listagem de Produtos e Serviços (ver sub-etapa "Cadastrar Produtos e Serviços") e a seleção feita aqui, em Preferências do Funil, são <strong>o mesmo dado, editável em 2 lugares diferentes</strong> por conveniência: marcar/desmarcar um produto aqui reflete na coluna da listagem, e vice-versa. Não são 2 filtros independentes que se combinam.<br><br><strong>Regra de fallback (Produtos e Serviços)</strong>: se nenhum produto for selecionado para um funil, o sistema mostra <strong>todos os produtos disponíveis</strong> por padrão. A ausência de seleção não significa "nenhum produto disponível", significa "sem filtro aplicado".<br><br><strong>Regra de fallback (Motivos de Perda), diferente de Produtos</strong>: a aba "Motivos de perda do funil" <strong>não segue a mesma lógica de fallback</strong> de Produtos e Serviços. Se nenhum motivo estiver ativado (toggle "Exibir no funil") para um funil, o sistema <strong>bloqueia</strong> a possibilidade de marcar negociações como perdidas naquele funil, em vez de exibir todos os motivos disponíveis. Essa regra, incluindo o comportamento completo da aba (toggles, filtro Todos/Visíveis/Ocultos, aviso de bloqueio), está detalhada na Etapa 5, Motivos de Perda, que é a etapa dona dessa entidade; esta etapa (Funil de Vendas) documenta apenas o ponto de acesso, o modal "Preferências do Funil" com suas 2 abas.` },
      { titulo: "Equipes do Funil", texto: `Controla quais Equipes podem visualizar um funil específico, acessado pelo menu de contexto (⋮) do funil na tela de Funil de Vendas, opção "Equipes do funil", ao lado de Renomear, Marcar como padrão, Preferências do funil e Excluir funil. Abre um painel lateral (drawer) "Editar funil" com o nome do funil e um dropdown "Selecione quem pode ver este funil".<br><br><strong>Comportamento padrão</strong>: por padrão, todo funil novo ou já existente fica visível para <strong>todas as equipes</strong>. Restringir a visibilidade é uma ação opt-in do Administrador, feita selecionando 1 ou mais equipes específicas no dropdown em vez de deixar "Todas as equipes" marcado.<br><br><strong>Regra do Administrador</strong>: quando a visibilidade é restrita a equipes específicas, um Administrador continua enxergando o funil como um todo, <strong>independente de pertencer ou não</strong> a uma das equipes selecionadas; a restrição, por padrão, vale apenas para usuários com papel "Usuário". Se for necessário que o próprio Administrador também fique restrito, é preciso rebaixar seu papel para "Usuário" (ver Etapa 1, Gestão de Acesso); não existe uma opção separada para restringir Administradores mantendo o papel de Administrador.<br><br><strong>Reaproveitamento da entidade Equipe</strong>: esta configuração usa a mesma entidade Equipe já documentada na Etapa 1 (Gestão de Acesso); é uma seleção adicional de equipes por funil, e não substitui nem se sobrepõe à visibilidade individual do usuário (Restrita/Equipe/Geral) definida na Etapa 1, que é uma camada complementar e independente.<br><br><strong>Impacto em automações</strong>: se uma automação move automaticamente uma negociação para um funil cujo responsável pela negociação não tem visibilidade (por não pertencer a nenhuma das equipes selecionadas), esse usuário deixa de enxergar a negociação após a movimentação, mesmo continuando como responsável por ela. Isso não bloqueia a automação em si, mas é um ponto de atenção operacional que o Administrador precisa considerar ao configurar visibilidade restrita em funis que recebem negociações via automação.` },
      { titulo: "Cadastrar Motivo de Perda", texto: `Motivo de Perda é uma entidade de apoio própria, com seu ciclo de vida completo (cadastro, edição, arquivamento, desarquivamento, exclusão via lixeira) documentado integralmente na Etapa 5, Motivos de Perda. Esta etapa (Funil de Vendas) reaproveita essa entidade em 2 pontos: a associação por funil, feita na aba "Motivos de perda do funil" dentro de Preferências do Funil (ver sub-etapa "Preferências do Funil" acima), e o consumo dela no momento em que uma negociação é marcada como perdida (fluxo a ser detalhado na Etapa 8, Negociações).<br><br><strong>Nota de consistência</strong>: um Motivo de Perda <strong>em uso</strong> por ao menos 1 negociação já perdida não pode ser excluído; o Administrador só pode arquivá-lo, o que preserva o nome do motivo no histórico das negociações que já o usaram e remove o motivo das opções de seleção para negociações futuras. Um motivo nunca usado pode ser enviado à lixeira normalmente. As regras completas de arquivamento, exclusão e desarquivamento estão na Etapa 5.` },
      { titulo: "Cadastrar Produtos e Serviços", texto: `Em Configurações → Produtos e serviços, o Administrador cadastra produtos com <strong>Nome (obrigatório)</strong>, Descrição (opcional) e Valor.<br><br><strong>Regra de exclusão confirmada</strong>: segue exatamente a mesma lógica do Motivo de Perda: um produto pode ser excluído mesmo estando vinculado a negociações existentes. As negociações que já tinham aquele produto associado mantêm o registro histórico; o produto apenas some da lista de opções para negociações futuras.` },
    ],
    acoes: [
      "Criar, renomear, arquivar e excluir um Funil de Vendas",
      "Restaurar um funil arquivado",
      "Marcar um funil como padrão",
      "Criar, renomear, reordenar e excluir uma Etapa do funil",
      "Configurar Nome e Descrição de uma Etapa",
      "Ativar \"Destacar negociações esfriando\" e definir a quantidade de dias",
      "Selecionar quais Equipes podem visualizar um funil",
      "Selecionar quais Produtos/Serviços e Motivos de Perda ficam disponíveis em um funil",
      "Cadastrar e excluir Motivos de Perda",
      "Cadastrar Produtos e Serviços",
      "Aprovar ou negar solicitações de exclusão na tela de Lixeira",
    ],
    entidades: `<strong>Funil → Etapas</strong>: um funil tem 0 ou mais etapas (nasce com um conjunto padrão, mas pode chegar a 0 se todas forem excluídas e o funil estiver vazio de negociações); uma etapa pertence a exatamente 1 funil. Cada etapa tem uma posição/ordem persistida, que determina a sequência na trilha.</p><p><strong>Funil → Equipes</strong>: relação muitos-para-muitos: um funil pode ser visível para "todas as equipes" ou uma seleção específica; reaproveita a entidade Equipe já definida na Etapa 1.</p><p><strong>Funil → Produtos/Serviços</strong>: relação muitos-para-muitos: um funil seleciona quais produtos ficam disponíveis nele; se nenhum for selecionado, todos os produtos ficam visíveis por padrão.</p><p><strong>Funil → Motivos de Perda</strong>: relação muitos-para-muitos, mediada pela aba "Motivos de perda do funil" em Preferências do Funil. Diferente de Produtos/Serviços, aqui a ausência de seleção <strong>bloqueia</strong> a perda de negociação naquele funil, em vez de exibir todos os motivos por padrão. A entidade MotivoDePerda em si (com seus estados Ativo/Arquivado e o mecanismo de lixeira) é definida na Etapa 5.</p><p><strong>Etapa → Negociações</strong>: uma etapa pode ter 0 ou mais negociações; ao excluir uma etapa, suas negociações são realocadas para a 1ª etapa do funil (nunca ficam órfãs), exceto quando a etapa excluída é ela mesma a 1ª etapa, nesse caso a exclusão é bloqueada.</p><p><strong>Funil → Solicitação de Exclusão (Lixeira)</strong>: quando um funil ou etapa é enviado para a lixeira, gera uma Solicitação de Exclusão com status (Pendente / Aprovada / Negada), o item referenciado, quem solicitou, e quem decidiu (quando aplicável). Essa entidade é transversal e reaproveitada por outras partes do sistema (negociações, empresas, contatos), conforme já indicado na Etapa 1.</p><p><strong>Campos do Funil</strong>: nome (texto, obrigatório, sem validação de unicidade), status de arquivamento (ativo/arquivado).</p><p><strong>Campos da Etapa</strong>: nome (texto, obrigatório), descrição (texto, opcional), sigla (gerada automaticamente a partir do nome), posição/ordem (numérico), limite de dias para "esfriando" (numérico, opcional, só relevante se o toggle estiver ativo).`,
    telas: `<strong>Tela 1: Funil de Vendas, visão kanban</strong>: tela principal, abre ao acessar Negociações, mostra as etapas como colunas e as negociações como cards; estado vazio orienta a criar ou importar dados.</p><p><strong>Tela 2: Dropdown de seleção de funil</strong>: mostra o funil atual e o atalho "Configurar funis".</p><p><strong>Tela 3: Listagem de Funis</strong>: mostra cada funil com sua trilha de etapas visível diretamente ali, e o botão "Adicionar Funil de Vendas".</p><p><strong>Tela 4: Menu de 3 pontinhos do Funil</strong>: Renomear, Marcar como padrão, Preferências do funil, Equipes do funil, Arquivar funil, Excluir funil.</p><p><strong>Tela 5: Criar nova Etapa</strong>: botão "+" ao final da trilha, nome editável inline.</p><p><strong>Tela 6: Painel Configurar Etapa</strong>: Nome da etapa e Descrição de etapa.</p><p><strong>Tela 7: Destacar negociações esfriando</strong>: toggle por etapa, com campo de dias.</p><p><strong>Tela 8: Deletar etapas selecionadas</strong>: link de exclusão que aparece ao selecionar uma etapa na trilha.</p><p><strong>Tela 9: Modal de exclusão de etapa</strong>: escolha entre lixeira e exclusão permanente, com checkbox de confirmação.</p><p><strong>Tela 10: Preferências do Funil</strong>: 2 abas, Produtos e serviços do funil e Motivos de perda do funil.</p><p><strong>Tela 11: Equipes do Funil</strong>: seleção de quem pode ver o funil.</p><p><strong>Tela 12: Motivos de Perda</strong>: listagem e criação inline.</p><p><strong>Tela 13: Produtos e Serviços</strong>: listagem e formulário de criação.`,
    fluxo: `Quatro fluxos cobrem esta etapa: <strong>criação de Funil</strong> (nome obrigatório, nasce com etapas padrão), <strong>exclusão de Etapa</strong> (o mais complexo, com a checagem de 1ª etapa com negociações e a escolha entre lixeira ou exclusão permanente), <strong>Arquivar/Excluir Funil</strong> (bloqueio de arquivamento do único funil ativo, versus exclusão sempre permitida mas passando pela Lixeira), e a <strong>relação Funil → Etapas → Negociações</strong>, mostrando como a realocação de negociações funciona na prática. Os diagramas completos estão logo abaixo.`,
    execucao: `<strong>Validações de campo obrigatório</strong></p><p>Nome do funil: obrigatório. Sistema bloqueia o salvamento e exibe erro se estiver em branco. Nome da etapa: obrigatório, mesma regra.</p><p><strong>Arquivar funil</strong></p><p>Ação reversível e imediata (não passa pela Lixeira). Bloqueada quando o funil a ser arquivado é o único funil ativo da conta.</p><p><strong>Exclusão de funil</strong></p><p>Permitida mesmo sendo o único funil da conta, sem bloqueio equivalente ao arquivamento. Passa pela tela de Lixeira (Configurações → Lixeira): a exclusão vira uma solicitação em "Exclusões Pendentes", que um Administrador precisa aprovar (efetivando a exclusão) ou negar (cancelando o pedido, o funil permanece intacto).</p><p><strong>Exclusão de etapa</strong></p><p>Exclusão permanente exige confirmação explícita via checkbox antes de habilitar o botão "Excluir Permanentemente". Exclusão via lixeira segue o mesmo mecanismo da tela de Lixeira descrito acima. Realocação de negociações para a 1ª etapa deve ser uma operação "tudo ou nada": se o sistema falhar ao mover parte das negociações, nenhuma é movida, e a exclusão da etapa não se completa. Bloqueio automático se a etapa a ser excluída for a 1ª etapa do funil e tiver negociações vinculadas; o sistema deve validar essa condição antes de permitir a ação, não depois. Como consequência dessa regra, um funil só chega a 0 etapas se estiver completamente vazio de negociações.</p><p><strong>Confirmação visual (toast)</strong></p><p>Ações diretas e imediatas do Funil (criar, renomear, marcar como padrão, configurar etapa, criar etapa, reordenar) exibem uma mensagem rápida de confirmação (toast) que aparece por alguns segundos e some sozinha, seguindo o mesmo padrão já definido na Etapa 1. Ações que passam pela Lixeira (excluir funil, excluir etapa via lixeira) exibem um toast equivalente, mas com texto que reflete o envio da solicitação (ex: "Solicitação de exclusão enviada"), não a conclusão da exclusão em si.</p><p><strong>Reordenação de etapa</strong></p><p>É incremental (uma posição por clique), não drag-and-drop livre. Não afeta negociações vinculadas à etapa movida; elas permanecem na mesma etapa, apenas a posição visual na trilha muda.`,
    auditoria: `Toda ação relevante sobre Funil, Etapa, Motivo de Perda e Produto/Serviço deve ser registrada em log de auditoria, contendo:</p><ul><li><strong>Quem</strong>: o Administrador que realizou a ação</li><li><strong>Quando</strong>: data e hora exatas</li><li><strong>O quê</strong>: tipo de alteração</li><li><strong>Valor anterior e novo</strong>: quando aplicável</li></ul><p><strong>Casos específicos a registrar:</strong></p><ul><li><strong>Criação de funil</strong>: nome definido</li><li><strong>Renomeação de funil</strong>: nome anterior para nome novo</li><li><strong>Exclusão de funil</strong>: nome do funil, com indicação se foi solicitação (lixeira) ou aprovação final</li><li><strong>Marcar como padrão</strong>: qual funil passou a ser o padrão</li><li><strong>Criação de etapa</strong>: nome e funil ao qual pertence</li><li><strong>Renomeação/edição de etapa</strong>: nome e/ou descrição anterior para novo</li><li><strong>Reordenação de etapa</strong>: posição anterior para nova posição</li><li><strong>Exclusão de etapa</strong>: nome da etapa, funil, e quantidade de negociações realocadas para a 1ª etapa como consequência</li><li><strong>Criação/exclusão de Motivo de Perda</strong>: nome do motivo</li><li><strong>Criação/exclusão de Produto/Serviço</strong>: nome do produto</li><li><strong>Alteração de Equipes do funil</strong>: lista anterior de equipes para nova lista</li></ul><p>⚠️ <em>Mesma pendência já registrada na Etapa 1: retenção e tela de consulta ao histórico de auditoria ficam para a Etapa de Configurações Avançadas.</em>`,
    criteriosAceite: [
      "Ao clicar em 'Adicionar Funil de Vendas', o funil já nasce na tela com nome sugerido editável, sem modal intermediário",
      "Sistema bloqueia a criação de um funil com nome em branco, exibindo mensagem de erro",

  "3": {
    descricao: `Campos Personalizados é o mecanismo que permite ao Administrador estender o cadastro padrão de 4 entidades do CRM Vigos (Negociação, Empresa, Contato, Produto e Serviço) sem exigir alteração de schema no banco de dados a cada nova necessidade da conta cliente.</p><p>A configuração acontece em uma tela central de Configurações, com 1 aba por entidade. Cada aba é completamente independente das demais: tem sua própria lista fixa de campos padrão, sua própria seção de Sugestão de campos, e sua própria lista de campos personalizados. Não existe compartilhamento de campos entre abas.</p><p>Reaproveita a entidade Etapa do Funil, já definida na Etapa 2, na regra de obrigatoriedade condicionada (sub-etapa 5, exclusiva de Negociação). Reaproveita o mecanismo de Lixeira, já definido no projeto, em um dos dois fluxos de exclusão (sub-etapa 11).`,
    porque: `Sem esse mecanismo, cada campo específico de negócio de um cliente exigiria uma alteração de schema sob demanda, o que não escala para múltiplas contas. Campos Personalizados resolve isso com um modelo de metadados: o schema fixo de cada entidade não muda, e a variação por cliente vive em uma camada de dados separada, replicada de forma idêntica nas 4 entidades.</p><p>Esta etapa é pré-requisito de dados para o formulário e a tela de detalhe de Negociação (Etapa 8), Empresa e Contato (Etapa 6), Produto e Serviço (Etapa 7). É também pré-requisito da validação de avanço de etapa do Funil de Vendas (Etapa 2), aplicável apenas à entidade Negociação.`,
    subetapas: [
      { titulo: "Estrutura de dados de um Campo Personalizado", texto: `Todo Campo Personalizado precisa armazenar, no mínimo, os atributos listados no campo Entidades desta etapa. O que acontece: ao criar um campo (sub-etapa 9), o sistema grava um novo registro de metadado; nenhuma coluna nova é criada na tabela da entidade correspondente. Regra de borda, imutabilidade: entidade e tipo são graváveis apenas na criação; depois de salvos, a API não deve expor um endpoint de atualização para esses dois atributos. Nome, obrigatório, único, visível e ordem continuam editáveis depois. Regra de validação, campo obrigatório em toda listagem: a data de criação (atributo criado_em) deve ser exibida na coluna "Criado em" da tabela de Campos personalizados de cada aba, sempre que houver ao menos 1 campo personalizado cadastrado naquela entidade. (Imagens 8 e 9)` },
      { titulo: "As 4 entidades e suas listas próprias de campos padrão", texto: `Cada aba lista, além dos campos personalizados, os campos padrão daquela entidade específica, sem relação com as listas das outras 3 abas. Negociação tem 12 campos padrão: Nome da negociação, Empresa, Produto e valor, Qualificação, Previsão de fechamento, Fonte, Campanha, Criada em, Valor total, Valor único, Funil, Etapa do funil. (Imagem 1) Empresa tem 5: Nome da empresa, Segmento, URL, Resumo, Endereço. (Imagem 10) Contato tem 5: Nome do contato, Cargo, Telefone, E-mail, Privacidade. (Imagem 8) Produto e Serviço tem 3: Nome, Descrição, Valor. (Imagem 9) Regra de validação: nenhum campo padrão, de nenhuma das 4 entidades, pode ser excluído, por nenhum fluxo, de nenhum perfil de usuário; essa restrição deve ser aplicada na API, não apenas ocultada no frontend. Ponto de atenção: a imagem de referência da aba Produto e Serviço não mostrou explicitamente a seção Sugestão de campos, presente nas outras 3 abas; presume-se que ela existe igualmente nessa aba (por consistência com o padrão das demais), mas isso precisa ser confirmado com uma nova captura antes da implementação final dessa aba específica.` },
      { titulo: "Campos editáveis por entidade, ícone de lápis", texto: `Dentro de cada lista de campos padrão, alguns campos específicos expõem um ícone de lápis na coluna Ações, habilitando edição de propriedades; os demais são somente leitura de configuração. Em Negociação, são editáveis: Empresa, Produto e valor, Fonte, Campanha. (Imagem 1) Em Empresa, são editáveis: Segmento, URL, Resumo, Endereço; Nome da empresa é fixo. (Imagem 10) Em Contato, são editáveis: Cargo, Telefone, E-mail; Nome do contato e Privacidade são fixos. (Imagem 8) Em Produto e Serviço, a captura disponível não mostra nenhum ícone de lápis visível nos 3 campos padrão (Nome, Descrição, Valor); a existência de edição nessa aba fica como pendência a confirmar com nova imagem. Regra de borda: o conjunto de painéis de edição documentado neste momento (sub-etapas 4 a 7) cobre apenas os 4 campos editáveis de Negociação, únicos com imagem de referência real das telas de edição; os campos editáveis das outras 3 abas (Segmento, URL, Resumo, Endereço em Empresa; Cargo, Telefone, E-mail em Contato) ainda não têm painel de edição documentado, pendente de novas imagens.` },
      { titulo: "Edição do campo padrão Empresa (aba Negociação)", texto: `O que acontece: o painel de edição do campo Empresa, na aba Negociação, permite alterar 2 atributos: nome de exibição (texto) e obrigatório (booleano). (Imagem 5) Regra de validação: nome de exibição é obrigatório para salvar a edição. Regra de borda: este campo não expõe controle de visibilidade nem associação com Funil, diferente de Fonte e Campanha (sub-etapa 6).` },
      { titulo: "Edição do campo padrão Produto e valor e obrigatoriedade condicionada por etapa (aba Negociação)", texto: `O que acontece: o painel de edição do campo Produto e valor permite alterar nome de exibição (texto) e uma configuração de obrigatoriedade com 2 estados exclusivos entre si: (a) não obrigatório; (b) obrigatório para 1 ou mais etapas específicas do funil ativo, selecionadas livremente, sem exigir sequência entre elas. (Imagem 7, wireframe da seleção de etapas inferido, sem imagem de referência real) Regra de validação, obrigatória no backend: o endpoint de mudança de etapa da negociação deve verificar, antes de persistir, se a etapa de destino está associada a essa obrigatoriedade condicionada; se estiver e o campo estiver vazio, a requisição é rejeitada com erro específico, e a negociação permanece na etapa atual. Regra de borda: esta funcionalidade de obrigatoriedade condicionada por etapa do funil é exclusiva da entidade Negociação; não existe conceito equivalente para Empresa, Contato ou Produto e Serviço.` },
      { titulo: "Edição dos campos padrão Fonte e Campanha (aba Negociação)", texto: `O que acontece: o painel de edição de Fonte e de Campanha permite alterar nome de exibição (texto), campo visível (booleano) e, condicionalmente, exibir no formulário (booleano). (Imagens 4 e 6) Regra de validação: exibir no formulário só tem efeito prático quando campo visível é verdadeiro. Regra de borda, dado histórico: desativar campo visível não deve disparar exclusão nem alteração de nenhum valor já persistido em negociações existentes. Regra de borda, MVP com funil único: o painel também exibe um seletor de Funis, fixo em "todos os funis" no MVP, sem outra opção selecionável; a granularidade por funil específico é escopo da Etapa 11, fora deste MVP.` },
      { titulo: "Promoção de item da lista de Sugestão de campos", texto: `O que acontece: a seção "Sugestão de campos", no topo de cada aba, exibe uma lista estática, própria daquela entidade e diferente das outras 3 abas: em Negociação, Budget, Cidade, Endereço; (Imagem 1) em Empresa, Bairro, Cidade, CNPJ, E-mail, Estado; (Imagem 10) em Contato, Bairro, CEP, Cidade, CPF, Endereço; (Imagem 8) em Produto e Serviço, pendente de confirmação (ver sub-etapa 2). A ação "+ Adicionar campo" cria um registro de Campo Personalizado real na entidade correspondente, usando nome e tipo pré-definidos daquele item, sem exigir que o usuário preencha o formulário completo de criação (sub-etapa 9). Regra de borda: o registro resultante é indistinguível de um campo personalizado criado manualmente.` },
      { titulo: "Tipos de campo, incluindo Campo com formatação", texto: `O sistema suporta 7 tipos de campo personalizado: Texto (campo aberto para escrita), Data (aceita somente DD/MM/AAAA), Seleção única (escolha de 1 item entre opções pré-cadastradas), Seleção múltipla (escolha de 1 ou mais itens), Número simples (campo numérico sem formato definido), Hiperlink (armazena e exibe uma URL clicável) e Campo com formatação (aceita máscara de entrada, usado nas sugestões de CNPJ e CPF observadas nas abas Empresa e Contato). (Imagens 3, 8, 10) Ponto de atenção: as regras específicas do tipo Campo com formatação (quais máscaras são suportadas além de CNPJ e CPF, se a máscara é fixa por tipo de dado ou configurável pelo Administrador na criação) não foram detalhadas pela Eliana; pendente de mais informações antes da implementação desse tipo específico.` },
      { titulo: "Criação de campo personalizado, com entidade pré-selecionada pela aba de origem", texto: `O que acontece: a ação "+ Criar campo" abre um formulário com os campos: entidade de destino (seleção, obrigatória), nome de exibição (texto, obrigatório), tipo do campo (seleção, obrigatória, entre os 7 tipos da sub-etapa 8) e 3 booleanos independentes: obrigatório, único, visível no cadastro. (Imagens 2, 3, 12) Regra de comportamento: quando o botão "+ Criar campo" é acionado a partir de uma aba específica (por exemplo, a partir da aba Empresa), o campo "Campo para cadastro" já vem pré-selecionado com aquela entidade; o Administrador pode alterar essa seleção livremente antes de salvar, escolhendo qualquer uma das 4 entidades disponíveis. Regra de validação: entidade, nome e tipo precisam estar preenchidos antes do botão de salvar ficar habilitado. Regra de borda, independência das 3 flags: é uma configuração válida ter obrigatório=verdadeiro e visível=falso ao mesmo tempo; cenário de uso: campo preenchido por integração externa. Ponto de atenção: o comportamento exato quando o campo é obrigatório, não visível, e não tem valor algum na tentativa de salvar não foi definido pela Eliana; não implementar até essa decisão ser tomada. Regra de validação, campo tipo data: aceita somente o formato DD/MM/AAAA.` },
      { titulo: "Cadastro de opções para campos de Seleção única e Seleção múltipla", texto: `O que acontece: quando o tipo escolhido é seleção única ou seleção múltipla, o formulário de criação exibe um sub-formulário adicional para cadastrar as opções da lista. (wireframe inferido, sem imagem de referência real) Regra de validação: o campo precisa ter ao menos 1 opção cadastrada antes de o botão de salvar ficar habilitado. Regra de borda, flag adicional "permitir novas opções" (booleano): quando verdadeira, o usuário final pode digitar uma opção nova, persistida permanentemente na lista; quando falsa, só pode escolher entre as opções já cadastradas.` },
      { titulo: "Ações sobre campo personalizado, menu de 3 pontinhos, Editar e os 2 fluxos de exclusão", texto: `O que acontece: diferente dos campos padrão (que usam o ícone de lápis quando editáveis, ver sub-etapa 3), todo campo personalizado, em qualquer uma das 4 abas, expõe suas ações através de um menu acionado por um ícone de 3 pontinhos verticais na coluna Ações da tabela, contendo Editar e Excluir. (Imagem 8) A opção Editar abre o mesmo tipo de formulário da criação (sub-etapa 9), pré-preenchido com os valores atuais do campo, permitindo alterar nome, obrigatório, único, visível, e as opções de lista quando aplicável; a entidade e o tipo permanecem bloqueados para edição (ver regra de imutabilidade, sub-etapa 1). A opção Excluir abre a escolha entre 2 fluxos distintos: Fluxo A, "Enviar para a lixeira", disponível para qualquer perfil, gera uma solicitação de exclusão no mecanismo de Lixeira já definido no projeto, aguardando aprovação do Administrador; Fluxo B, "Excluir permanentemente", disponível apenas para o perfil Administrador, remove o campo de forma síncrona e imediata, mediante confirmação explícita via checkbox, sem possibilidade de desfazer. Regra de borda: um usuário sem perfil Administrador não visualiza a opção "Excluir permanentemente" no menu, apenas "Enviar para a lixeira". Ponto de atenção, pendência formal para o time de TI decidir: o que acontece com os valores já preenchidos desse campo em registros existentes no momento em que a exclusão, por qualquer um dos 2 fluxos, se efetiva; não decidido ainda.` },
    ],
    acoes: [
      "Visualizar a lista de campos padrão e personalizados de cada uma das 4 entidades",
      "Reordenar campos padrão e personalizados por arraste, dentro de cada aba",
      "Editar as propriedades dos campos padrão editáveis de cada entidade (documentado em detalhe apenas para Negociação; demais entidades pendentes)",
      "Promover um item da lista de Sugestão de campos, própria de cada aba, para um Campo Personalizado real",
      "Criar um Campo Personalizado a partir de qualquer aba, com a entidade pré-selecionada pela aba de origem e alterável",
      "Cadastrar, editar, remover e renomear opções de um Campo Personalizado do tipo seleção única ou múltipla",
      "Definir a associação de obrigatoriedade condicionada por etapa do funil, exclusiva de Produto e valor em Negociação",
      "Editar um Campo Personalizado existente, em qualquer aba, via menu de 3 pontinhos",
      "Solicitar a exclusão de um Campo Personalizado via Lixeira, em qualquer aba",

    ],
    entidades: `<strong>Campo Personalizado → Entidade</strong>: muitos-para-um. Um Campo Personalizado pertence a exatamente 1 Entidade, entre Negociação, Empresa, Contato ou Produto e Serviço; uma Entidade tem 0 ou mais Campos Personalizados.</p><p><strong>Entidade → Campo Padrão</strong>: um-para-muitos, fixo no schema, lista própria por entidade. Negociação tem 12 Campos Padrão; Empresa tem 5; Contato tem 5; Produto e Serviço tem 3. Campos Padrão não são criados nem excluídos pelo usuário, e as 4 listas não se sobrepõem entre si.</p><p><strong>Campo Personalizado → Opção de Lista</strong>: um-para-muitos, aplicável apenas a campos do tipo seleção única ou seleção múltipla.</p><p><strong>Campo Personalizado ou Campo Padrão → Valor</strong>: um-para-muitos. Cada Valor pertence a exatamente 1 Campo e a exatamente 1 registro da entidade correspondente.</p><p><strong>Campo (Produto e valor, Negociação) → Etapa do Funil</strong>: muitos-para-muitos, exclusivo da entidade Negociação. Reaproveita a entidade Etapa do Funil já definida na Etapa 2.</p><p>Campos de Campo Personalizado: id (identificador único, obrigatório); entidade (enum: negociação/empresa/contato/produto_e_servico, obrigatório, imutável); nome (texto, obrigatório, editável); tipo (enum: texto/data/selecao_unica/selecao_multipla/numero_simples/hiperlink/campo_com_formatacao, obrigatório, imutável); obrigatorio (booleano, padrão falso); unico (booleano, padrão falso); visivel (booleano, padrão falso); ordem (número inteiro); permitir_novas_opcoes (booleano, opcional, só para tipos de seleção); criado_por (referência a Usuário); criado_em (data e hora, obrigatório, exibido na coluna "Criado em" de todas as abas).</p><p>Reaproveita o conceito de Lixeira já definido no projeto para o Fluxo A de exclusão (sub-etapa 11).`,
    telas: `<strong>Imagem 1: Configurar campos de cadastro, aba Negociação</strong>: tela principal, 12 campos padrão, 4 editáveis.</p><p><strong>Imagem 2: Criar campo personalizado, seleção de entidade</strong>: painel lateral, dropdown de entidade aberto.</p><p><strong>Imagem 3: Criar campo personalizado, toggles</strong>: mesmo painel, 3 controles booleanos em destaque.</p><p><strong>Imagem 4: Editar Campanha</strong>: painel de edição, nome, campo visível, exibir no formulário, seletor de funis.</p><p><strong>Imagem 5: Editar Empresa (campo padrão de Negociação)</strong>: painel de edição, nome e obrigatório.</p><p><strong>Imagem 6: Editar Fonte</strong>: painel de edição, estrutura idêntica à de Campanha.</p><p><strong>Imagem 7: Editar produto e valor</strong>: painel de edição, nome e obrigatoriedade condicionada por etapa.</p><p><strong>Imagem 8: Configurar campos de cadastro, aba Contato</strong>: mostra a seção Campos personalizados preenchida (8 campos reais), com coluna Criado em e menu de 3 pontinhos; Sugestão de campos própria; Campos padrão próprios (5 campos, 3 editáveis).</p><p><strong>Imagem 9: Configurar campos de cadastro, aba Produto e Serviço</strong>: Campos personalizados (1 campo real); Campos padrão próprios (3 campos, nenhuma edição visível na captura).</p><p><strong>Imagem 10: Configurar campos de cadastro, aba Empresa</strong>: Sugestão de campos própria; Campos padrão próprios (5 campos, 4 editáveis).</p><p><strong>Imagem 12: Criar campo personalizado, seleção de tipo</strong>: dropdown de tipo aberto, 6 das 7 opções visíveis na captura.</p><p>Sem imagem de referência real, wireframes inferidos: sub-formulário de cadastro de opções; menu de ações com as 2 opções de exclusão; modal de confirmação de exclusão permanente; painéis de edição dos campos editáveis de Empresa, Contato e Produto e Serviço.`,
    fluxo: `Existem 5 diagramas para esta etapa. Dois macros de Negociação: processo de campo padrão e processo de campo personalizado. Dois detalhados de Negociação: criação completa e exclusão completa. Um quinto diagrama, transversal às 4 abas, mostra que a criação de campo pode partir de qualquer entidade, com a entidade pré-selecionada pela aba de origem e alterável antes de salvar. Ponto de atenção: os 4 primeiros diagramas ainda refletem apenas o comportamento de Negociação em profundidade; não existem diagramas detalhados equivalentes para Empresa, Contato e Produto e Serviço, pendentes de mais imagens de referência.`,
    execucao: `<strong>Validações de campo obrigatório</strong></p><p>Entidade, nome e tipo são obrigatórios na criação; quando aberto a partir de uma aba específica, entidade já vem preenchida mas continua editável e sujeita à mesma validação. Um campo do tipo seleção exige ao menos 1 opção cadastrada.</p><p><strong>Regra de operação tudo ou nada</strong></p><p>A criação de um campo com opções de lista deve ser atômica.</p><p><strong>Síncrono vs. assíncrono</strong></p><p>Criação e edição são síncronas. Exclusão via Lixeira é assíncrona; exclusão permanente é síncrona e imediata.</p><p><strong>Confirmação visual (toast)</strong></p><p>Criação, edição e promoção de sugestão geram toast de sucesso. Solicitação de exclusão via Lixeira gera toast de "solicitação enviada". Exclusão permanente gera toast de confirmação definitiva.</p><p><strong>Dependência de outras regras já definidas</strong></p><p>O Fluxo A de exclusão segue o Lixeira já definida na Etapa 1. A obrigatoriedade condicionada por etapa depende de Etapa do Funil, já definida na Etapa 2, e é exclusiva de Negociação.</p><p><strong>Validação no backend</strong></p><p>A verificação de campo obrigatório condicionado por etapa ocorre no endpoint de mudança de etapa da negociação, não apenas no frontend.`,
    auditoria: `Formato padrão: Quem, Quando, O quê, Valor anterior e novo.</p><p>Casos específicos: criação de campo personalizado em qualquer entidade (quem, quando, entidade, configuração completa); edição de qualquer propriedade de campo padrão ou personalizado, em qualquer entidade (quem, quando, valor anterior e novo de cada propriedade); solicitação de exclusão via Lixeira; exclusão permanente (quem, sempre Administrador, quando, cópia completa da configuração no momento da exclusão).`,
    criteriosAceite: [
      "As listas de campos padrão de Negociação (12), Empresa (5), Contato (5) e Produto e Serviço (3) são totalmente independentes entre si",
      "Nenhum campo padrão, de nenhuma das 4 entidades, pode ser excluído por nenhum fluxo",
      "O botão \"+ Criar campo\" aberto a partir de uma aba específica pré-seleciona aquela entidade no formulário, permanecendo editável",
      "Um campo personalizado, em qualquer das 4 abas, expõe Editar e Excluir via menu de 3 pontinhos, nunca via ícone de lápis",
      "A coluna \"Criado em\" aparece na tabela de Campos personalizados de qualquer aba que tenha ao menos 1 campo cadastrado",
      "O sistema aceita 7 tipos de campo personalizado, incluindo Campo com formatação",
      "Um Administrador consegue editar nome e obrigatório do campo padrão Empresa em Negociação",
      "Um Administrador consegue ativar obrigatoriedade condicionada por etapa no campo Produto e valor (exclusivo de Negociação) e selecionar múltiplas etapas não sequenciais",
      "O sistema bloqueia a movimentação de uma negociação para uma etapa que exige Produto e valor preenchido, quando vazio",

  "4.fontes": {
    descricao: `Fonte é o cadastro que identifica o canal de origem pelo qual uma Negociação chegou ao CRM, como formulário do site, indicação, evento presencial ou prospecção ativa. É uma entidade de apoio simples, sem hierarquia interna, mantida em uma listagem única por conta.</p><p>A Fonte se relaciona diretamente com Negociação: toda Negociação pode ter uma Fonte associada, preenchida no momento da criação ou edição da Negociação, usando o campo padrão Fonte já previsto na Etapa 3, Campos Personalizados, aba Negociação. Fonte também se relaciona com Usuário e Perfil, já definidos na Etapa 1, Gestão de Acesso, porque a permissão de criar uma nova Fonte depende do perfil do usuário e de uma configuração de conta específica.`,
    porque: `Fonte precisa existir antes de qualquer negociação real ser criada no sistema, porque o campo Fonte da Negociação depende de uma lista de opções previamente cadastrada para funcionar como seleção, e não como texto livre. Sem esse cadastro, a atribuição de origem das negociações fica inconsistente e sem valor analítico.</p><p>Esta sub-etapa também resolve a dependência de permissão condicionada por perfil, um padrão já usado na Etapa 1, que precisa estar disponível antes de qualquer tela que restrinja ações por Administrador versus Usuário.`,
    subetapas: [
      { titulo: "Listagem de Fontes", texto: `A tela de Fontes mostra uma tabela com todas as Fontes cadastradas na conta, com as colunas Nome da Fonte, Criado em, Última Alteração em, e Opções (contendo o ícone de exclusão). O cabeçalho da coluna Nome da Fonte exibe entre parênteses a contagem total de itens na lista, por exemplo "Nome da Fonte (15)". Existe um campo de busca por nome acima da tabela, que filtra a lista em tempo real conforme o texto digitado. (Imagem 2, Imagem 8)` },
      { titulo: "Criação de Fonte", texto: `Ao clicar no botão "Adicionar Fonte", um formulário é exibido inline, entre o toggle de permissão e a tabela, com um único campo: Nome da Fonte, obrigatório para salvar, sem valor padrão, nascendo vazio. Ao clicar em "Salvar", a Fonte é criada e passa a aparecer na listagem; ao clicar em "Cancelar", o formulário fecha sem salvar nada.<br><br><strong>Regra de validação, nome único:</strong> o nome da Fonte precisa ser único na conta, comparação exata e sensível a maiúsculas/minúsculas e espaços, seguindo o mesmo padrão de unicidade já definido na Etapa 3 para campos personalizados marcados como "Único"; se o nome já existir, o sistema bloqueia o salvamento e exibe mensagem de erro. (Imagem 4)` },
      { titulo: "Sem edição", texto: `Uma vez criada, a Fonte não pode ser editada. Não existe tela, botão ou menu de edição para uma Fonte já cadastrada; a única ação disponível sobre um item existente é a exclusão.<br><br><em>Ponto de atenção: esta é uma decisão consciente que segue o comportamento do RD Station, usado como referência de comportamento neste levantamento; se o time de TI julgar tecnicamente simples adicionar edição no futuro, isso pode ser revisto, mas fica fora do escopo desta etapa.</em>` },
      { titulo: "Exclusão de Fonte", texto: `O ícone de lixeira, disponível tanto na linha individual quanto em uma barra de ação exibida quando um ou mais itens são selecionados via checkbox, abre um modal de confirmação com o título "Deseja excluir a Fonte?", o texto explicativo informando que a Fonte pode ser enviada para a lixeira ou excluída permanentemente, um checkbox de confirmação com o texto "Entendo que ao excluir não conseguirei recuperar a informação", e dois botões de ação: "Enviar para a lixeira" e "Excluir permanentemente". (Imagem 6, Imagem 7, Imagem 9)` },
      { titulo: "Regra de bloqueio por vínculo", texto: `<strong>Regra de validação, obrigatória no backend:</strong> antes de processar qualquer uma das duas ações de exclusão (lixeira ou permanente), o sistema verifica se existe ao menos 1 Negociação com essa Fonte associada; se existir, a exclusão é bloqueada nos dois fluxos, inclusive para o perfil Administrador tentando excluir permanentemente, e uma mensagem de bloqueio é exibida ao usuário.<br><br><em>Ponto de atenção: o formato exato dessa mensagem (aviso genérico de bloqueio, ou exibição da contagem de Negociações vinculadas) ainda não foi decidido pela Eliana; fica marcado como pendência para definição em rodada futura ou pelo TI.</em>` },
      { titulo: "Fluxo Enviar para a lixeira", texto: `Quando não há bloqueio por vínculo, este fluxo está disponível para qualquer perfil (Administrador ou Usuário) e não exige o checkbox de confirmação marcado. Ao confirmar, a Fonte sai da listagem ativa e entra no mecanismo transversal de Lixeira já definido nas etapas anteriores, com abas Exclusões Pendentes, Exclusões Aprovadas e Exclusões Negadas, sujeito à aprovação de um Administrador.` },
      { titulo: "Fluxo Excluir permanentemente", texto: `Disponível apenas para o perfil Administrador. O botão só fica habilitado depois que o checkbox de confirmação é marcado. Ao confirmar, a Fonte é removida definitivamente e de forma imediata, sem passar pela Lixeira, sem possibilidade de recuperação.` },
      { titulo: "Permissão de criação", texto: `Por padrão, apenas o perfil Administrador pode criar novas Fontes. A tela exibe um toggle "Permitir que usuários criem novas fontes"; quando ativado por um Administrador, o perfil Usuário passa a ter acesso ao botão "Adicionar Fonte" também.<br><br><strong>Regra de borda, toggle desligado:</strong> o botão "Adicionar Fonte" fica oculto ou desabilitado para o perfil Usuário. (Imagem 2, Imagem 4)` },
    ],
    acoes: [
      "Visualizar a listagem de Fontes cadastradas",
      "Buscar uma Fonte pelo nome",
      "Criar uma nova Fonte",
      "Selecionar uma ou mais Fontes via checkbox",
      "Enviar uma Fonte para a lixeira",
      "Excluir uma Fonte permanentemente",
      "Ativar ou desativar a permissão de criação de Fonte para o perfil Usuário",
    ],
    entidades: `Fonte → Negociação: associação opcional, 0 ou mais Negociações podem referenciar exatamente 1 Fonte.</p><p>Fonte → Usuário: criada por exatamente 1 Usuário.</p><p>Perfil → Fonte: permissão de criação condicionada, já definida na Etapa 1.</p><p><strong>Campos da entidade Fonte:</strong></p><ul><li>nome (texto, obrigatório, único na conta, comparação exata sensível a maiúsculas/minúsculas e espaços)</li><li>criadoEm (data e hora, preenchido automaticamente na criação)</li><li>ultimaAlteracaoEm (data e hora, preenchido automaticamente; ponto de atenção, dado que não há edição, este campo hoje só reflete a data de criação, a menos que o TI decida atualizar por outro motivo técnico)</li></ul>`,
    telas: `<p><strong>Imagem 2:</strong> Fontes, listagem: mostra a tabela de Fontes cadastradas, o toggle de permissão e o botão de criação em destaque.</p><p><strong>Imagem 4:</strong> Fontes, formulário de criação: mostra o campo Nome da Fonte preenchido, prestes a ser salvo.</p><p><strong>Imagem 6:</strong> Fontes, modal de exclusão: mostra a pergunta de confirmação com as duas opções de exclusão.</p><p><strong>Imagem 7:</strong> Fontes, modal de exclusão (variação de captura, mesmo conteúdo da Imagem 6).</p><p><strong>Imagem 8:</strong> Fontes, tela completa: mostra o contexto integral com sidebar e topbar do CRM, incluindo uma busca ativa filtrando um resultado.`,
    fluxo: `Esta sub-etapa tem 2 fluxogramas: um cobrindo o processo de criação de Fonte, incluindo a checagem de permissão por perfil, o toggle de conta e a validação de nome único; e outro cobrindo o processo de exclusão, com a verificação de vínculo por item antes da bifurcação entre lixeira e exclusão permanente.`,
    execucao: `<strong>Validações de campo obrigatório:</strong> o campo Nome da Fonte não pode ser salvo vazio; a mensagem de erro deve indicar claramente que o campo é obrigatório.</p><p><strong>Regra de operação tudo ou nada:</strong> a verificação de vínculo com Negociação e o bloqueio de exclusão devem ocorrer na mesma transação da tentativa de exclusão, nunca permitindo um estado intermediário onde a Fonte pareça excluída no frontend mas ainda exista no backend.</p><p><strong>Síncrono vs. assíncrono:</strong> a checagem de unicidade do nome e a checagem de vínculo com Negociação devem ser síncronas, respondendo antes de qualquer confirmação visual de sucesso ou erro ser exibida ao usuário.</p><p><strong>Confirmação visual:</strong> ao salvar uma Fonte com sucesso, exibir toast com texto aproximado "Fonte criada com sucesso"; ao enviar para a lixeira, toast "Fonte enviada para a lixeira"; ao excluir permanentemente, toast "Fonte excluída permanentemente".</p><p><strong>Dependência de outras regras já definidas:</strong> o mecanismo de Lixeira, com abas Pendentes/Aprovadas/Negadas e aprovação por Administrador, já foi definido na Etapa 1, Gestão de Acesso, e é reaproveitado integralmente aqui, sem recriação. A regra de unicidade exata, sensível a maiúsculas/minúsculas e espaços, já foi definida na Etapa 3, Campos Personalizados.`,
    auditoria: `<ul><li><strong>Quem:</strong> usuário que executou a ação</li><li><strong>Quando:</strong> data e hora da ação</li><li><strong>O quê:</strong> tipo de alteração (criação de Fonte, envio para lixeira, exclusão permanente, aprovação ou negação de exclusão pendente, alteração do toggle de permissão)</li><li><strong>Valor anterior e novo:</strong> no caso do toggle de permissão, registrar o estado anterior (ligado/desligado) e o novo estado</li></ul><p>Caso específico desta sub-etapa: toda tentativa de exclusão bloqueada por vínculo com Negociação também deve ser registrada no log de auditoria, mesmo não tendo produzido uma alteração de fato, para rastreabilidade de tentativas de exclusão de registros em uso.`,

  "4.campanhas": {
    descricao: `Campanha é o cadastro que identifica uma iniciativa de marketing específica pela qual uma Negociação chegou ao CRM, como um evento, um anúncio ou uma ação de e-mail marketing. Diferente de Fonte, que identifica o canal genérico, Campanha identifica a ação pontual dentro daquele canal, e por isso carrega um campo adicional de descrição.</p><p>Campanha se relaciona diretamente com Negociação, usando o campo padrão Campanha já previsto na Etapa 3, Campos Personalizados, aba Negociação, de forma independente do campo Fonte: uma Negociação pode ter Fonte, Campanha, ambos, ou nenhum dos dois preenchidos. Campanha também se relaciona com Usuário e Perfil, seguindo exatamente o mesmo modelo de permissão condicionada por perfil já descrito na sub-etapa Fontes.`,
    porque: `Campanha precisa existir como cadastro independente de Fonte porque a granularidade de análise de marketing exige diferenciar canal de iniciativa específica; uma mesma Fonte, como "Evento presencial", pode abrigar diversas Campanhas ao longo do tempo, como "Feira XYZ 2026" e "Workshop ABC 2026". Sem essa separação, o time de marketing perde a capacidade de medir o retorno de ações pontuais dentro de um mesmo canal.`,
    subetapas: [
      { titulo: "Listagem de Campanhas", texto: `A tela de Campanhas, acessada pela aba "Campanhas" na mesma tela de Fontes, mostra uma tabela com as colunas Nome da Campanha, Descrição, Criado em, Última alteração em, e Opções. O cabeçalho da coluna Nome da Campanha exibe a contagem total de itens, por exemplo "Nome da Campanha (15)". Existe campo de busca por nome. (Imagem 1)` },
      { titulo: "Criação de Campanha", texto: `Ao clicar em "Adicionar Campanha", um formulário inline exibe dois campos: Nome da Campanha, obrigatório, e Descrição, opcional, ambos nascendo vazios. Botões "Salvar" e "Cancelar" seguem o mesmo comportamento já descrito para Fonte.<br><br><strong>Regra de validação, nome único:</strong> o nome da Campanha precisa ser único na conta, mesma regra de comparação exata usada em Fonte; a Descrição não tem restrição de unicidade. (Imagem 3)` },
      { titulo: "Sem edição", texto: `Assim como Fonte, uma Campanha não pode ser editada depois de criada; apenas excluída. Mesmo ponto de atenção sobre esta ser uma decisão consciente alinhada ao comportamento do RD Station.` },
      { titulo: "Exclusão de Campanha", texto: `Segue exatamente o mesmo modal, com o título "Deseja excluir a Campanha?", o mesmo texto explicativo, o mesmo checkbox de confirmação, e os mesmos dois botões "Enviar para a lixeira" e "Excluir permanentemente". Suporta tanto exclusão individual quanto exclusão em lote, com uma barra de ação exibindo o texto "Apagar a(s) N campanha(s) selecionada(s)" quando um ou mais itens estão marcados via checkbox. (Imagem 5, Imagem 9)` },
      { titulo: "Regra de bloqueio por vínculo", texto: `Idêntica à regra já definida para Fonte: se a Campanha estiver associada a pelo menos 1 Negociação, a exclusão é bloqueada nos dois fluxos, inclusive para Administrador. Mesmo ponto de atenção sobre o formato da mensagem de bloqueio, ainda pendente de decisão.` },
      { titulo: "Fluxos de exclusão", texto: `"Enviar para a lixeira" e "Excluir permanentemente" seguem exatamente as mesmas regras de perfil, aprovação e caráter definitivo já descritas na sub-etapa Fontes, reaproveitando o mesmo mecanismo transversal de Lixeira.` },
      { titulo: "Exclusão em lote", texto: `<strong>Regra de validação:</strong> ao selecionar múltiplas Campanhas via checkbox e acionar a exclusão em lote, a verificação de bloqueio por vínculo com Negociação deve ser aplicada individualmente a cada item selecionado; se qualquer um dos itens selecionados estiver vinculado, esse item específico é bloqueado e os demais, se elegíveis, seguem o fluxo normalmente.<br><br><em>Ponto de atenção: o comportamento exato de feedback quando parte do lote é bloqueada e parte não (processar parcialmente ou bloquear o lote inteiro) não foi definido pela Eliana; fica como pendência explícita para o TI ou para decisão futura.</em> (Imagem 9)` },
      { titulo: "Permissão de criação", texto: `Segue o mesmo modelo: toggle "Permitir que usuários criem novas campanhas", independente do toggle de Fonte, controlando se o perfil Usuário enxerga o botão "Adicionar Campanha". (Imagem 1, Imagem 3)` },
    ],
    acoes: [
      "Visualizar a listagem de Campanhas cadastradas",
      "Buscar uma Campanha pelo nome",
      "Criar uma nova Campanha, com nome e descrição opcional",
      "Selecionar uma ou mais Campanhas via checkbox",
      "Excluir uma ou mais Campanhas em lote",
      "Enviar uma Campanha para a lixeira",
      "Excluir uma Campanha permanentemente",
      "Ativar ou desativar a permissão de criação de Campanha para o perfil Usuário",
    ],
    entidades: `Campanha → Negociação: associação opcional, 0 ou mais Negociações podem referenciar exatamente 1 Campanha.</p><p>Campanha → Usuário: criada por exatamente 1 Usuário.</p><p>Perfil → Campanha: permissão de criação condicionada, já definida na Etapa 1.</p><p>Fonte → Campanha: nenhuma relação direta entre as duas entidades; são cadastros independentes que se relacionam apenas indiretamente, cada um com a Negociação.</p><p><strong>Campos da entidade Campanha:</strong></p><ul><li>nome (texto, obrigatório, único na conta, comparação exata sensível a maiúsculas/minúsculas e espaços)</li><li>descricao (texto, opcional, sem restrição de unicidade)</li><li>criadoEm (data e hora, automático)</li><li>ultimaAlteracaoEm (data e hora, automático, mesmo ponto de atenção já descrito em Fonte por não haver edição)</li></ul>`,
    telas: `<p><strong>Imagem 1:</strong> Campanhas, listagem: mostra a tabela vazia de exemplo, toggle de permissão e botão de criação.</p><p><strong>Imagem 3:</strong> Campanhas, formulário de criação: mostra os campos Nome e Descrição, com contador de itens já refletido na tabela abaixo.</p><p><strong>Imagem 5:</strong> Campanhas, modal de exclusão: mostra a pergunta de confirmação sobre um item específico da listagem.</p><p><strong>Imagem 9:</strong> Campanhas, seleção em lote: mostra a barra de ação em lote acionada por checkbox múltiplo.`,
    fluxo: `Esta sub-etapa reaproveita a estrutura dos 2 fluxogramas da sub-etapa Fontes (criação e exclusão), com uma ramificação adicional no fluxo de exclusão para cobrir o caso de seleção em lote e a verificação individual de vínculo por item selecionado.`,
    execucao: `<strong>Validações de campo obrigatório:</strong> o campo Nome da Campanha não pode ser salvo vazio; o campo Descrição pode ser salvo vazio sem gerar erro.</p><p><strong>Regra de operação tudo ou nada:</strong> para exclusão individual, a mesma regra de transação única já descrita em Fonte se aplica. Para exclusão em lote, cada item é tratado como uma transação independente entre si, conforme a subetapa de exclusão em lote acima; o comportamento de UX diante de bloqueio parcial fica pendente.</p><p><strong>Síncrono vs. assíncrono:</strong> checagem de unicidade de nome e de vínculo com Negociação, síncronas, mesma regra de Fonte.</p><p><strong>Confirmação visual:</strong> ao salvar, toast "Campanha criada com sucesso"; ao enviar para lixeira (individual ou lote), toast "Campanha(s) enviada(s) para a lixeira"; ao excluir permanentemente, toast "Campanha(s) excluída(s) permanentemente".</p><p><strong>Dependência de outras regras já definidas:</strong> mecanismo de Lixeira, já definido na Etapa 1; regra de unicidade exata, já definida na Etapa 3; modelo de permissão condicionada por perfil e toggle de conta, já definido nesta mesma Etapa 4, sub-etapa Fontes.`,
    auditoria: `Mesma estrutura da sub-etapa Fontes: Quem, Quando, O quê, Valor anterior e novo. Caso específico desta sub-etapa: exclusão em lote deve registrar uma entrada de auditoria por item afetado, nunca uma única entrada agregada, para preservar rastreabilidade individual mesmo quando a ação foi disparada em lote.`,
    criteriosAceite: [

    foraDoMVP: [
      "Edição de Campanha após criada",

    ],
  },
  "5": {
    descricao: `Motivo de Perda é o cadastro que padroniza as razões pelas quais uma Negociação é marcada como perdida no CRM Vigos. É um cadastro de apoio, mantido pelo Administrador, que existe de forma independente dos Funis de Vendas, mas cujo efeito real só se concretiza quando associado a um ou mais funis: cada Funil de Vendas tem sua própria seleção de quais motivos ficam disponíveis para os vendedores no momento de encerrar uma negociação como perdida.</p><p>A lista de motivos começa <strong>vazia</strong>: o sistema não vem com nenhum motivo padrão pré-cadastrado, diferente de outras entidades de apoio do CRM. Cabe ao Administrador criar os motivos relevantes para o processo comercial da conta antes que qualquer negociação possa ser perdida.</p><p>Um motivo de perda tem 3 estados possíveis ao longo de sua vida: <strong>Ativo</strong> (disponível para seleção, associável a funis), <strong>Arquivado</strong> (removido das opções de seleção, mas preservado para consulta e reversível a qualquer momento) e <strong>excluído</strong> (removido definitivamente, apenas quando o motivo nunca foi usado em nenhuma negociação).`,
    porque: `Sem um cadastro padronizado, cada vendedor registraria o motivo de uma perda com suas próprias palavras, o que inviabiliza qualquer análise agregada de funil, taxa de perda por motivo, ou comparação entre períodos. Padronizar aqui é o que permite, mais adiante, que a camada de Dashboard/Relatórios (Etapa 15) produza números confiáveis sobre por que a empresa está perdendo negócios.</p><p>A associação por funil existe porque motivos de perda fazem sentido em contextos diferentes: um funil de vendas de cursos presenciais tem motivos que não fazem sentido em um funil de vendas de serviços de telecom, por exemplo. Sem essa segmentação, o vendedor veria uma lista longa e genérica de motivos, boa parte deles irrelevantes para o processo que ele está executando, o que aumenta o risco de seleção errada ou de uso do motivo genérico "Outros" por comodidade.`,
    subetapas: [
      { titulo: "Cadastro de motivo (criação e edição inline)", texto: `O Administrador cria e edita motivos de perda diretamente na tela de listagem, sem modal ou tela separada: ao clicar em "Adicionar Motivo de Perda", um formulário simples se expande no topo da própria lista, com um único campo obrigatório, <strong>Motivo de Perda</strong>, e os botões Salvar e Cancelar. O mesmo padrão vale para editar um motivo já existente: clicar no nome do motivo na listagem expande o mesmo formulário inline, agora preenchido, para edição.<br><br><strong>Regra de nome único</strong>: o nome do motivo precisa ser único na conta, com comparação <strong>exata, sensível a maiúsculas/minúsculas e a espaços</strong> (mesmo padrão já usado em Campos Personalizados). O sistema bloqueia o salvamento e exibe mensagem de erro se o nome já existir.<br><br>Ao salvar um motivo novo, ele nasce com status <strong>Ativo</strong> e fica automaticamente disponível para seleção em qualquer funil que esteja configurado para exibir "todos os motivos de perda" (comportamento padrão de um funil que ainda não teve sua lista de motivos customizada). Um aviso na própria tela de cadastro lembra o Administrador desse comportamento e aponta o caminho para restringir a visibilidade por funil.` },
      { titulo: "Associação por funil (tela de Preferências do Funil)", texto: `A visibilidade de um motivo em um funil específico é configurada em uma tela nova, <strong>Preferências do Funil</strong>, acessada pelo menu de contexto (⋮) de cada funil na tela de Funil de Vendas (Etapa 2), ao lado de opções já existentes como Renomear e Excluir funil. Essa tela tem 2 abas: <strong>Produtos e serviços do funil</strong> (fora do escopo desta etapa) e <strong>Motivos de perda do funil</strong>.<br><br>Dentro da aba Motivos de perda do funil, o Administrador vê a lista de todos os motivos Ativos da conta, cada um com um toggle "Exibir no funil". Ativar o toggle torna aquele motivo selecionável pelos vendedores ao perder uma negociação naquele funil específico; desativar remove essa disponibilidade, sem apagar o motivo em si.<br><br>A tela oferece busca por nome e um filtro dropdown com 3 opções: <strong>Todos os motivos de perda</strong>, <strong>Motivos de perda visíveis no funil</strong> e <strong>Motivos de perda ocultos no funil</strong>, para facilitar a configuração em contas com muitos motivos cadastrados.` },
      { titulo: "Estados do motivo: Ativo, Arquivado e excluído", texto: `Um motivo de perda percorre um ciclo de vida com regras diferentes dependendo de estar ou não em uso (associado a pelo menos 1 negociação já perdida com aquele motivo):<br><br><strong>Motivo Ativo, nunca usado</strong>: pode ser enviado diretamente para a exclusão (lixeira), sem passar por arquivamento.<br><strong>Motivo Ativo, em uso</strong>: não pode ser excluído em nenhuma hipótese; a única ação disponível é <strong>Arquivar</strong>.<br><strong>Motivo Arquivado</strong>: estado final e permanente enquanto o Administrador não agir; o motivo some das opções de seleção em qualquer funil, mas continua visível na listagem geral (com indicação visual de que está arquivado) para preservar rastreabilidade. Um motivo Arquivado <strong>nunca</strong> vai para a lixeira nem pode ser excluído; a única transição possível a partir daqui é <strong>Desarquivar</strong>, disponível a qualquer momento e sem restrição, que devolve o motivo ao estado Ativo.<br><br>Essa distinção existe porque o nome de um motivo usado em uma perda antiga precisa continuar existindo, para que o histórico daquela negociação não perca informação; arquivar preserva isso, excluir não.` },
      { titulo: "Mecânica de exclusão (lixeira e exclusão permanente)", texto: `Quando um motivo Ativo sem uso é excluído, ele segue o mesmo mecanismo de Lixeira já padronizado em outras etapas do CRM Vigos: um modal pergunta se o Administrador quer "Enviar para a lixeira" ou "Excluir permanentemente". A opção de exclusão permanente começa <strong>desabilitada</strong> e só é liberada após o Administrador marcar um checkbox de confirmação explícita ("Entendo que ao excluir não conseguirei recuperar a informação").<br><br>Um motivo enviado à lixeira entra no fluxo padrão de aprovação já usado em outras entidades do sistema (abas Exclusões Pendentes, Exclusões Aprovadas, Exclusões Negadas); a exclusão permanente e irreversível só acontece de fato após a aprovação nesse fluxo.<br><br><strong>Exclusão em massa</strong>: a listagem permite selecionar múltiplos motivos via checkbox, com uma barra de ação ("Apagar o(s) N motivo(s) de perda selecionado(s)") que abre o mesmo modal de exclusão, agora aplicado ao lote inteiro. Se qualquer um dos motivos selecionados estiver em uso, o modal se ajusta e oferece apenas a opção de arquivamento para o lote, seguindo a mesma regra de proteção de motivo individual em uso.` },
      { titulo: "Obrigatoriedade do motivo ao marcar negociação como perdida", texto: `Ao encerrar uma Negociação como Perdida, a seleção de um motivo é <strong>obrigatória</strong>; o sistema não confirma a perda sem essa seleção, exibindo mensagem de erro se o vendedor tentar prosseguir sem escolher um motivo. A lista de opções mostrada ao vendedor contém apenas os motivos marcados como visíveis (toggle "Exibir no funil" ativo) para o funil específico onde aquela negociação está.<br><br><strong>Regra de borda, funil sem nenhum motivo ativo</strong>: se um funil não tiver nenhum motivo com o toggle ativado, o botão de marcar a negociação como Perdida fica <strong>desabilitado</strong>, com uma explicação (tooltip ou aviso) orientando que um Administrador precisa ativar ao menos 1 motivo em Preferências do Funil antes de continuar. Essa é uma decisão deliberada do CRM Vigos, e é <strong>diferente</strong> do comportamento observado no RD Station (usado como referência de mercado), onde um funil sem motivos configurados exibe todos os motivos disponíveis da conta em vez de bloquear a ação; o CRM Vigos prioriza a integridade da configuração por funil em vez de um comportamento de fallback permissivo.` },
    ],
    acoes: [
      "Criar motivo de perda (Administrador): informar nome único, salvar via formulário inline na listagem",
      "Editar motivo de perda existente (Administrador): mesmo formulário inline, agora preenchido",
      "Listar e pesquisar motivos de perda por nome",
      "Selecionar 1 ou mais motivos via checkbox para ação em massa",
      "Arquivar motivo de perda em uso (Administrador): remove das opções de seleção, preserva histórico",
      "Desarquivar motivo de perda (Administrador): reverte ao estado Ativo a qualquer momento",
      "Enviar motivo de perda sem uso para a lixeira (Administrador), individual ou em massa",
      "Excluir motivo de perda permanentemente após aprovação no fluxo de lixeira, com checkbox de confirmação explícita",

    ],
    entidades: `<strong>MotivoDePerda</strong>: id, nome (único, exato, sensível a maiúsculas/minúsculas e espaços), status (ativo | arquivado), data de criação, data da última alteração.</p><p><strong>MotivoDePerda → Funil</strong>: relação N:N, mediada pela configuração "Exibir no funil" dentro de Preferências do Funil; um motivo pode estar visível em 0 ou mais funis, e um funil pode ter 0 ou mais motivos visíveis (com a regra de borda de que 0 motivos visíveis bloqueia a perda naquele funil).</p><p><strong>MotivoDePerda → Negociação</strong>: relação 1:N: uma Negociação marcada como Perdida referencia exatamente 1 motivo; um motivo pode estar associado a 0 ou mais negociações perdidas. Essa relação é o que determina se um motivo está "em uso" (1 ou mais negociações referenciando-o) para fins da regra de arquivamento versus exclusão.</p><p><strong>Negociação → Funil</strong>: relação já existente desde a Etapa 2, reaproveitada aqui para determinar quais motivos são elegíveis para seleção no momento da perda.`,
    telas: `<strong>Tela 1: Listagem de Motivos de Perda</strong>: tabela com colunas Nome, Criado em, Última alteração, e ação de excluir por linha; busca por nome; seleção múltipla via checkbox com barra de ação em massa; botão "Adicionar Motivo de Perda" que expande o formulário inline de cadastro no topo da lista. Motivos arquivados aparecem na mesma listagem, visualmente diferenciados (texto atenuado, indicador "arquivado"), com ação de desarquivar no lugar da exclusão.</p><p><strong>Tela 2: Formulário de cadastro/edição inline</strong>: não é modal nem tela separada; expande no topo da Tela 1. Campo único Motivo de Perda, botões Salvar e Cancelar, aviso sobre visibilidade padrão em todos os funis e link para Preferências do Funil.</p><p><strong>Tela 3: Modal de exclusão</strong>: 2 estados. Estado inicial, com opções "Enviar para a lixeira" e "Excluir permanentemente" (esta desabilitada até o checkbox de confirmação ser marcado). Quando qualquer motivo selecionado está em uso, o modal muda de conteúdo e oferece apenas "Arquivar motivo", com uma explicação de por que a exclusão não está disponível.</p><p><strong>Tela 4: Preferências do Funil, aba Motivos de perda do funil</strong>: tela nova, documentada pela primeira vez nesta etapa, acessada pelo menu de contexto do funil na Etapa 2. Aviso de bloqueio quando o funil não tem nenhum motivo ativo; lista de motivos com toggle "Exibir no funil"; busca e filtro dropdown (Todos / Visíveis / Ocultos); estado vazio quando a busca ou filtro não retorna nenhum motivo.</p><p><strong>Tela 5 (inferida): Encerramento de Negociação como Perdida</strong>: botão "Perdida" desabilitado com tooltip explicativo quando o funil não tem motivo ativo; formulário de seleção obrigatória de motivo quando o funil tem ao menos 1 motivo disponível, com mensagem de erro caso o vendedor tente confirmar sem selecionar.</p><p><strong>Tela 6 (inferida): Confirmação de arquivamento</strong>: explica ao Administrador, no momento da tentativa de exclusão de um motivo em uso, por que a exclusão não está disponível e o que acontece ao arquivar (preservação de histórico).`,
    fluxo: `1 mapa mental macro, com 6 ramos: Cadastro de Motivos, Associação por Funil, Estados do Motivo, Mecânica da Exclusão, Obrigatoriedade na Perda, e Regras Gerais Consolidadas.</p><p>2 fluxogramas detalhados de decisão: o primeiro cobre o caminho do Administrador ao tentar excluir um motivo (decisão em cascata: está arquivado? está em uso? vai para lixeira ou é bloqueado e oferece arquivar); o segundo cobre o caminho do Vendedor ao marcar uma negociação como perdida (decisão: o funil tem motivo ativo? o vendedor selecionou um motivo? confirma ou bloqueia). Os diagramas completos estão logo abaixo.`,
    execucao: `<strong>Validação de nome</strong>: a checagem de unicidade (exata, sensível a maiúsculas/minúsculas e espaços) deve ocorrer tanto no salvamento de um motivo novo quanto na edição de um existente, excluindo o próprio registro da comparação ao editar.</p><p><strong>Consistência entre exclusão e uso</strong>: antes de permitir o fluxo de exclusão (lixeira/permanente), o sistema precisa verificar em tempo real se o motivo está referenciado por ao menos 1 negociação marcada como perdida; essa checagem determina qual variação do modal de exclusão é exibida. A mesma checagem se aplica a cada item de uma seleção em massa, individualmente.</p><p><strong>Consistência entre funil e motivo</strong>: o botão de marcar negociação como Perdida precisa consultar, em tempo real, se existe ao menos 1 motivo com o toggle "Exibir no funil" ativo para aquele funil específico; essa é uma condição dinâmica, que muda conforme o Administrador ativa ou desativa motivos em Preferências do Funil.</p><p><strong>Preservação de histórico</strong>: ao arquivar um motivo, o nome do motivo já usado em negociações passadas não deve ser alterado nem removido; a listagem histórica de uma negociação perdida deve continuar exibindo o nome do motivo tal como estava no momento da perda, mesmo que o motivo seja arquivado ou, futuramente, renomeado.</p><p><strong>Síncrono vs. em segundo plano</strong>: todas as ações desta etapa (criar, editar, arquivar, desarquivar, excluir, ativar/desativar visibilidade por funil) são síncronas, com confirmação visual imediata (toast) ao concluir.</p><p><strong>Confirmação visual</strong>: segue o padrão já estabelecido nas etapas anteriores; toast de confirmação para toda ação de salvar, arquivar, desarquivar ou excluir (ex: "Motivo criado", "Motivo arquivado", "Enviado para a lixeira").`,
    auditoria: `Toda ação relevante sobre um motivo de perda deve ser registrada em log de auditoria, contendo:</p><ul><li><strong>Quem</strong>: o Administrador que realizou a ação</li><li><strong>Quando</strong>: data e hora exatas</li><li><strong>O quê</strong>: tipo de alteração (criação, edição de nome, arquivamento, desarquivamento, envio à lixeira, exclusão permanente, alteração de visibilidade por funil)</li><li><strong>Valor anterior e novo</strong>: por exemplo, nome anterior → nome novo na edição; status anterior → status novo ao arquivar ou desarquivar</li></ul><p>Casos específicos a registrar:</p><ul><li><strong>Alteração de visibilidade por funil</strong>: qual motivo, qual funil, toggle ativado ou desativado</li><li><strong>Exclusão em massa</strong>: lista completa dos motivos incluídos na operação, e o resultado individual de cada um (alguns podem ter sido bloqueados e arquivados em vez de excluídos, dentro da mesma operação em lote)</li></ul><p>O nome do motivo usado no momento de uma perda de negociação é preservado no histórico daquela negociação, independente de alterações futuras no cadastro do motivo.`,
