<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Vigos — Arquitetura Funcional</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#F7F9FB;color:#16232F}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
#loading strong{display:block;font-size:18px;margin-bottom:8px}
#loading span{color:#64748B;font-size:13px}
</style>
</head>
<body>
<div id="loading"><div><strong>Carregando CRM Vigos…</strong><span>Arquitetura funcional</span></div></div>
<script>
(async()=>{
  const base='runtime/negociacoes-final-20260924/';
  const files=Array.from({length:10},(_,i)=>base+'part_'+String(i).padStart(2,'0')+'.txt?v=20260924-1543');
  try{
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f+' '+r.status);
      return r.text();
    }));
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML='<div><strong>Não foi possível carregar o protótipo.</strong><span>'+String(err)+'</span></div>';
  }
})();
</script>
</body>
</html>
