<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Vigos: Arquitetura Funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0B1929;
    --navy-panel: #0F2942;
    --navy-panel-hover: #14324f;
    --teal: #00D9C0;
    --teal-dim: #0a5f56;
    --bg-content: #F7F9FB;
    --text-dark: #16232F;
    --text-muted: #64748B;
    --text-sidebar-muted: #7F92A8;
    --border-light: #E2E8F0;
    --amber: #F5A623;
    --amber-bg: #FEF3E2;
    --red: #E45858;
    --red-bg: #FCEAEA;
    --green: #1FAA6E;
    --green-bg: #E7F7EF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-content);
    color: var(--text-dark);
    display: flex;
    min-height: 100vh;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--navy-deep);
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.06);
  }

  .sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .sidebar-header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--teal);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .sidebar-header h1 {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
  }

  .sidebar-header .subtitle {
    font-size: 12.5px;
    color: var(--text-sidebar-muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  .progress-block {
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-sidebar-muted);
    margin-bottom: 8px;
  }

  .progress-label strong {
    color: var(--teal);
  }

  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal-dim), var(--teal));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .nav-groups {
    flex: 1;
    padding: 12px 12px 24px;
  }

  .nav-group {
    margin-bottom: 4px;
  }

  .nav-group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease;
    user-select: none;
  }

  .nav-group-header:hover {
    background: rgba(255,255,255,0.04);
  }

  .nav-group-header .chevron {
    font-size: 10px;
    color: var(--text-sidebar-muted);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .nav-group.collapsed .chevron {
    transform: rotate(-90deg);
  }

  .nav-group-header .group-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--teal);
    background: rgba(0,217,192,0.12);
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-group-header .group-title {
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    flex: 1;
  }

  .nav-group-header .group-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-sidebar-muted);
  }

  .nav-items {
    overflow: hidden;
    max-height: 800px;
    transition: max-height 0.3s ease;
  }

  .nav-group.collapsed .nav-items {
    max-height: 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px 9px 44px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
    position: relative;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .nav-item.active {
    background: rgba(0,217,192,0.1);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: var(--teal);
    border-radius: 0 2px 2px 0;
  }

  .nav-item .item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-sidebar-muted);
    width: 18px;
    flex-shrink: 0;
  }

  .nav-item.active .item-num {
    color: var(--teal);
  }

  .nav-item .item-title {
    font-size: 13px;
    color: #D6E2ED;
    flex: 1;
    line-height: 1.3;
  }

  .nav-item.active .item-title {
    color: #fff;
    font-weight: 600;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.pendente { background: #3A4B5C; }
  .status-dot.revisao { background: var(--amber); box-shadow: 0 0 0 3px rgba(245,166,35,0.15); }
  .status-dot.aprovado { background: var(--green); box-shadow: 0 0 0 3px rgba(31,170,110,0.15); }

  .nav-item-parent {
    cursor: default;
  }

  .nav-item-parent:hover {
    background: transparent;
  }

  .nav-subitem {
    padding-left: 62px;
  }

  .nav-subitem .item-title {
    font-size: 12.5px;
    color: #B8C6D4;
  }

  .nav-subitem.active .item-title {
    color: #fff;
  }

  .subsecao-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 32px;
  }

  .subsecao-tab {
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s ease;
  }

  .subsecao-tab:hover {
    color: var(--text-dark);
  }

  .subsecao-tab.active {
    color: var(--teal-dim);
    border-bottom-color: var(--teal);
  }

  .nota-ordem {
    background: #F0F9F7;
    border: 1px solid #B8E6DC;
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #0a5f56;
    margin-bottom: 28px;
  }

  .nota-ordem strong {
    color: #085041;
  }

  .prototipo-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #0B1929, #14324f);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 28px;
    color: #fff;
  }

  .prototipo-card-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,217,192,0.15);
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .prototipo-card-body {
    flex: 1;
  }

  .prototipo-card-body strong {
    font-size: 14px;
    display: block;
    margin-bottom: 4px;
  }

  .prototipo-card-body p {
    font-size: 12.5px;
    color: #B8C6D4;
    line-height: 1.5;
    margin: 0;
  }

  .prototipo-card-btn {
    background: var(--teal);
    color: #062b26;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }

  .prototipo-card-btn:hover {
    transform: translateY(-1px);
  }

  .criterio-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .criterio-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13.5px;
  }

  .criterio-check {
    font-size: 15px;
    color: var(--teal-dim);
    flex-shrink: 0;
    line-height: 1.3;
  }

  .fora-mvp {
    background: #FBFAF7;
    border-color: #E8E2D5;
  }

  .fora-mvp li {
    color: #7A6F58;
  }

  .etapa-subsecoes-preview {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: -4px;
  }

  /* ============ MAIN CONTENT ============ */
  .main {
    flex: 1;
    min-width: 0;
  }

  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border-light);
    padding: 18px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .breadcrumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .breadcrumb .sep { margin: 0 8px; color: #C7D2DD; }
  .breadcrumb .current { color: var(--text-dark); font-weight: 600; }

  .content {
    padding: 56px 64px 120px;
    max-width: 980px;
  }

  /* Landing / index page */
  .hero {
    margin-bottom: 48px;
  }

  .hero .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal-dim);
    font-weight: 700;
    margin-bottom: 14px;
  }

  .hero h1 {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 18px;
  }

  .hero p {
    font-size: 16px;
    color: var(--text-muted);
    line-height: 1.65;
    max-width: 680px;
  }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-top: 32px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: #fff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 22px;
    min-width: 140px;
  }

  .stat-card .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-card.pendente .stat-num { color: #3A4B5C; }
  .stat-card.revisao .stat-num { color: var(--amber); }
  .stat-card.aprovado .stat-num { color: var(--green); }

  .stat-card .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .rule {
    height: 1px;
    background: var(--border-light);
    margin: 48px 0;
  }

  .camada-section {
    margin-bottom: 40px;
  }

  .camada-heading {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }

  .camada-heading .camada-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-dim);
    background: rgba(0,217,192,0.1);
    padding: 3px 9px;
    border-radius: 5px;
  }

  .camada-heading h2 {
    font-size: 19px;
    font-weight: 700;
  }

  .camada-heading .camada-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .etapa-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .etapa-card {
    background: #fff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .etapa-card:hover {
    border-color: var(--teal);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(11,25,41,0.06);
  }

  .etapa-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .etapa-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .status-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-pill.pendente { background: #EEF1F4; color: #5B6B7C; }
  .status-pill.revisao { background: var(--amber-bg); color: #9A6314; }
  .status-pill.aprovado { background: var(--green-bg); color: #147A4E; }

  .status-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .etapa-card h3 {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }

  /* Etapa detail page */
  .etapa-detail .status-pill {
    font-size: 11px;
    padding: 5px 12px;
  }

  .etapa-detail-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .etapa-detail .camada-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--teal-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  .etapa-detail h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 24px;
    line-height: 1.2;
  }

  .section-block {
    margin-bottom: 36px;
  }

  .section-block h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--teal-dim);
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-block h4::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-light);
  }

  .placeholder-box {
    border: 1.5px dashed #CBD5E1;
    border-radius: 10px;
    padding: 32px 28px;
    background: #FBFCFD;
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.7;
  }

  .placeholder-box strong {
    color: var(--text-dark);
  }

  .filled-box {
    background: #fff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px 26px;
    font-size: 14.5px;
    line-height: 1.75;
    color: #2B3B4A;
  }

  .filled-box strong { color: var(--text-dark); font-weight: 600; }
  .filled-box p + p { margin-top: 14px; }
  .filled-box ul { margin: 10px 0 0 20px; }
  .filled-box li { margin-bottom: 6px; }

  .acoes-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .acoes-list li {
    position: relative;
    padding: 10px 0 10px 28px;
    border-bottom: 1px solid #F0F3F6;
    font-size: 14px;
  }

  .acoes-list li:last-child { border-bottom: none; }

  .acoes-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    top: 10px;
    color: var(--teal-dim);
    font-weight: 700;
    font-size: 12px;
    width: 18px;
    height: 18px;
    background: rgba(0,217,192,0.12);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .subetapa-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .subetapa-item {
    display: flex;
    gap: 16px;
    background: #fff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 20px 22px;
  }

  .subetapa-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-dim);
    background: rgba(0,217,192,0.1);
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .subetapa-body h5 {
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-dark);
  }

  .subetapa-body p {
    font-size: 13.5px;
    line-height: 1.7;
    color: #47576A;
  }

  .subetapa-body strong { color: var(--text-dark); }

  .diagram-card {
    background: #fff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .diagram-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--teal-dim);
    margin-bottom: 16px;
  }

  .diagram-svg-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .diagram-svg-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    margin-bottom: 24px;
    font-weight: 500;
    cursor: pointer;
  }

  .back-link:hover { color: var(--teal-dim); }

  .page { display: none; }
  .page.visible { display: block; }

  @media (max-width: 900px) {
    .sidebar { position: fixed; left: -320px; z-index: 100; transition: left 0.25s ease; box-shadow: 20px 0 40px rgba(0,0,0,0.3); }
    .sidebar.open { left: 0; }
    .content { padding: 32px 24px 100px; }
    .topbar { padding: 14px 20px; }
    .menu-toggle { display: flex !important; }
    .hero h1 { font-size: 28px; }
  }

  .menu-toggle {
    display: none;
    background: var(--navy-deep);
    color: #fff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="eyebrow">Arquitetura Funcional</div>
    <h1>CRM Vigos</h1>
    <div class="subtitle">Documento de referência para times de TI e Desenvolvimento. Construído camada por camada, com aprovação antes de avançar.</div>
  </div>

  <div class="progress-block">
    <div class="progress-label"><span>Progresso geral</span><strong id="progress-text">0 / 21</strong></div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div></div>
  </div>

  <nav class="nav-groups" id="nav-groups"></nav>
</aside>

<button class="menu-toggle" id="menu-toggle">☰</button>

<main class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">CRM Vigos <span class="sep">/</span> <span class="current">Índice Geral</span></div>
  </div>

  <div class="content" id="content"></div>
</main>

<script>
const DATA = [
  {
    camada: 0,
    nome: "Fundação (Acesso e Governança)",
    desc: "Quem acessa e o que pode fazer",
    etapas: [
      { num: 1, titulo: "Gestão de Acesso", status: "revisao", subsecoes: [
        { id: "usuarios", titulo: "Usuários" },
        { id: "equipes", titulo: "Equipes" },
        { id: "permissoes", titulo: "Permissões Personalizadas" },
      ] },
    ]
  },
  {
    camada: 1,
    nome: "Estrutura Comercial",
    desc: "Como o processo de venda é organizado",
    etapas: [
      { num: 2, titulo: "Funil de Vendas", status: "revisao" },
      { num: 3, titulo: "Campos Personalizados", status: "revisao" },
    ]
  },
  {
    camada: 2,
    nome: "Cadastros de Apoio",
    desc: "Entidades e configurações que a Negociação exige para existir",
    etapas: [
      { num: 4, titulo: "Fontes e Campanhas", status: "revisao", subsecoes: [
        { id: "fontes", titulo: "Fontes" },
        { id: "campanhas", titulo: "Campanhas" },
      ] },
      { num: 5, titulo: "Motivos de Perda", status: "revisao" },

const CONTEUDO = {
  "1.usuarios": {
    descricao: `Perfil de Usuário é o mecanismo que define <strong>o que uma pessoa pode fazer</strong> dentro do CRM. Todo usuário com acesso ao CRM pertence a exatamente um perfil, e é esse perfil que determina quais telas, ações e configurações ficam disponíveis para ele.</p><p><strong>Importante</strong>: o CRM não cadastra pessoas; os usuários já existem como usuários da <strong>plataforma Vigos Cloud</strong>. O que acontece aqui é o Administrador <strong>conceder acesso ao CRM</strong> a alguém que já existe na Vigos, e definir o perfil que essa pessoa tem dentro do CRM especificamente. O CRM e a Vigos Cloud possuem controles de acesso <strong>independentes</strong> entre si (ver regra de borda na sub-etapa de Status do usuário).</p><p>Nesta tela, o Administrador escolhe entre os perfis já existentes (Administrador, Usuário, ou algum perfil personalizado) através de um dropdown simples; a definição de <strong>o que cada perfil pode fazer</strong> em detalhe fica na sub-seção <strong>Permissões Personalizadas</strong>, que é onde essa configuração é criada e mantida.</p><p>Esta tela vive junto com <strong>Equipes</strong> e <strong>Permissões Personalizadas</strong> em uma única área de configuração ("Convites, usuários e equipes"), com um painel de resumo mostrando Licenças ativas, Licenças disponíveis, Equipes e Perfis de usuário.`,
    porque: `Sem essa camada, qualquer pessoa com acesso ao CRM teria os mesmos poderes; o que é inviável operacionalmente (um vendedor não deveria conseguir excluir a conta inteira) e arriscado do ponto de vista de dados (nem todo mundo deveria ver ou exportar tudo).</p><p>Definir perfis antes de qualquer outra etapa é o que permite que, quando o Funil de Vendas, Negociações e demais módulos forem construídos, cada ação dentro deles já nasça com uma regra clara de "quem pode fazer isso".`,
    subetapas: [
      { titulo: "Conceder acesso a um usuário existente (Vigos Cloud)", texto: `O CRM <strong>não cadastra pessoas novas</strong>: os usuários já existem na plataforma Vigos Cloud. O que o Administrador faz aqui é <strong>conceder acesso ao CRM</strong> a alguém que já é usuário da Vigos: busca a pessoa em uma lista/busca de usuários da conta Vigos, seleciona, e define o <strong>perfil inicial</strong> dela dentro do CRM.<br><br>A busca retorna <strong>todos os usuários da conta Vigos Cloud</strong>, incluindo quem já tem acesso ao CRM; esses aparecem na lista de forma <strong>oculta/desabilitada</strong>, para deixar claro que já possuem acesso e não podem ser selecionados novamente.<br><br>Não existe fluxo de convite com aceite; o acesso já é concedido imediatamente. Ao concluir, o sistema <strong>dispara automaticamente um e-mail</strong> avisando a pessoa que seu <strong>acesso ao CRM foi liberado</strong> (notificação, não convite pendente de aceite).<br><br><strong>Regra de unicidade</strong>: não é possível conceder acesso a um usuário que já possui acesso ao CRM nesta conta; o sistema bloqueia a ação e exibe mensagem de erro informando que aquele usuário já tem acesso concedido.` },
      { titulo: "Limite de licenças (controlado pela Vigos Cloud)", texto: `O CRM <strong>não controla licenças por conta própria</strong>: ele consulta essa informação diretamente da <strong>Vigos Cloud</strong>, que é quem gerencia o plano contratado e a quantidade de licenças disponíveis. O painel de resumo do CRM ("Licenças ativas" e "Licenças disponíveis") apenas <strong>reflete</strong> o dado vindo da Vigos, em tempo real.<br><br>Se <strong>Licenças disponíveis = 0</strong> (segundo a consulta à Vigos Cloud), o botão "Conceder acesso" fica bloqueado; o Administrador só consegue conceder acesso a mais alguém se desativar o acesso de outro usuário no CRM (liberando 1 licença) ou se a conta contratar mais licenças diretamente na Vigos Cloud (botão "Comprar mais licenças" direciona para lá).<br><br>Um usuário com acesso <strong>Inativo no CRM não consome licença</strong>: ao desativar o acesso de alguém, a licença volta ao pool disponível imediatamente (sempre validado via consulta à Vigos Cloud). Isso também significa que, ao <strong>reativar</strong> o acesso de um usuário, o sistema precisa consultar a Vigos Cloud para checar se há licença disponível antes de permitir.` },
      { titulo: "Atribuição de perfil (único)", texto: `Cada usuário tem <strong>exatamente um perfil</strong> por vez (Administrador, Usuário, ou um perfil customizado). Não há acúmulo de perfis; se a pessoa precisa de permissões adicionais, ou ela recebe um perfil customizado novo com essas permissões, ou o Administrador ajusta as permissões do perfil customizado já atribuído a ela.` },
      { titulo: "Configuração de visibilidade de dados", texto: `Independente do perfil, cada usuário tem uma configuração de <strong>visibilidade</strong> por módulo de dado (Negociações, Empresas, Contatos), com 3 níveis possíveis:<br><br><strong>Restrita</strong>: só enxerga os próprios registros<br><strong>Equipe</strong>: enxerga os registros de todas as equipes a que pertence<br><strong>Geral</strong>: enxerga todos os registros da conta, de qualquer equipe<br><br>Perfil e visibilidade são controles independentes: perfil define o que a pessoa pode <em>fazer</em>; visibilidade define o que ela pode <em>ver</em> de dados de terceiros.<br><br><strong>Regra confirmada</strong>: um usuário pode pertencer a mais de 1 equipe. Com visibilidade "Equipe", ele enxerga a <strong>soma dos registros de todas</strong> as equipes às quais pertence; não apenas de uma equipe "principal".` },
      { titulo: "Status do usuário (Ativo/Inativo)", texto: `Usuário tem um status simples (Ativo/Inativo) <strong>dentro do CRM</strong>, visível na listagem. Desativar o acesso de um usuário não apaga seu histórico de ações, e libera a licença que ele consumia.<br><br><strong>Regra de borda, independência entre CRM e Vigos Cloud</strong>: se uma pessoa for desativada ou desligada diretamente na Vigos Cloud, isso <strong>não desativa automaticamente</strong> o acesso dela ao CRM; o acesso permanece ativo até que um Administrador desative manualmente, também dentro do CRM. Os dois sistemas têm controles de status independentes; não existe desativação em cascata automática.<br><br>⚠️ <em>Fora do MVP, como sugestão futura: um alerta ou relatório para o Administrador identificar usuários desligados da Vigos Cloud que ainda têm acesso ativo no CRM; não é obrigatório neste momento, fica apenas registrado como ideia.</em>` },
      { titulo: "Reatribuição ao desativar usuário", texto: `Ao desativar o acesso de um usuário, o sistema <strong>não reatribui automaticamente</strong>. Se o usuário não tiver nenhum registro em aberto, a desativação acontece direto, sem tela extra. Se tiver, o Administrador passa por 2 passos:<br><br><strong>Passo 1: Escolha rápida</strong>: define um destino único que se aplica a todos os registros de uma vez. As opções dependem de a equipe do usuário ter gestor definido: <strong>se tiver</strong>, aparece a opção "Gestor da equipe" (ou um gestor por equipe, se o usuário pertencer a mais de uma); <strong>se não tiver gestor definido</strong>, o Administrador vê diretamente as opções "Outro usuário específico" ou "Deixar sem responsável por enquanto"; gestor de equipe não é obrigatório, então essa opção simplesmente não aparece quando não existe.<br><br><strong>Passo 2: Ajuste individual (opcional)</strong>: cada registro aparece em uma lista simples mostrando para quem vai; o Administrador pode trocar o destino de um item específico sem precisar refazer a escolha geral.<br><br>Uma frase de resumo mostra o resultado final antes de confirmar (ex: "Todos os 4 itens serão reatribuídos para Juliana"). Registros que ficarem sem destino são marcados como "sem responsável", gerando um <strong>alerta visível para todos os Administradores</strong>.<br><br><strong>Regra de quais registros entram nessa tela:</strong><br>• <strong>Negociações</strong>: todas as que não estão marcadas como Ganha nem Perdida (ou seja, qualquer negociação ainda em andamento no funil). Negociações já fechadas não entram; ficam como histórico, sem precisar de dono ativo.<br>• <strong>Contatos</strong>: só entram os contatos vinculados a pelo menos 1 negociação em aberto. Um contato sem negociação em aberto (ou sem negociação nenhuma) permanece registrado com o usuário desativado, mas <strong>não aparece</strong> nesta tela nem gera alerta; decisão consciente de não tratar isso como urgente.` },
      { titulo: "Reativação de usuário", texto: `Ao reativar um usuário inativo, o sistema primeiro verifica se há <strong>licença disponível</strong>: se não houver, bloqueia a reativação até que uma licença seja liberada ou comprada. Se houver licença, o usuário volta automaticamente com o <strong>mesmo Perfil e Visibilidade</strong> que tinha antes da desativação. As negociações/contatos que foram reatribuídos <strong>não retornam automaticamente</strong>: permanecem com quem os recebeu. O Administrador pode, como ação manual separada, revisar e devolver registros específicos ao usuário reativado, se desejar.` },
      { titulo: "Regra de borda, conta precisa ter sempre 1 Administrador ativo", texto: `O sistema <strong>não permite</strong> desativar, remover ou trocar o perfil do último Administrador ativo da conta. Ao tentar essa ação, o sistema bloqueia e exibe mensagem explicando o motivo, orientando a atribuir o perfil de Administrador a outro usuário antes de continuar. Isso garante que a conta sempre tenha pelo menos uma pessoa capaz de administrá-la.` },
      { titulo: "Ações rápidas por usuário (menu de contexto)", texto: `Cada linha da listagem tem um menu de ações (ícone de três pontos) com: <strong>Editar usuário</strong> (abre o painel lateral de Perfil e Visibilidade), <strong>Copiar ID</strong> (copia o identificador do usuário, útil para suporte técnico) e <strong>Desativar usuário</strong> (aciona o fluxo de reatribuição descrito acima).` },
      { titulo: "Ciclo de vida completo do usuário", texto: `Resumindo todas as ações possíveis sobre um usuário, na ordem em que normalmente ocorrem: <strong>Criar → Editar (perfil/visibilidade) → Alterar equipe → Desativar → Reativar</strong>.<br><br>⚠️ <strong>Nota sobre "Excluir"</strong>: neste MVP não existe uma ação de "exclusão permanente" separada de "Desativar"; desativar já preserva o histórico do usuário (conforme definido anteriormente) e é reversível via reativação. Uma exclusão permanente e irreversível (que apagaria o usuário e seu histórico de vez) <strong>não foi definida como necessidade de negócio até o momento</strong> e fica registrada aqui como decisão em aberto, a ser resolvida se e quando essa necessidade surgir; por exemplo, por exigência de LGPD/direito ao esquecimento.` },

    telas: `<strong>Tela 1: Usuários, equipes e permissões (tela-mãe)</strong>: painel de resumo com 4 cards (Licenças ativas, Licenças disponíveis, Equipes, Perfis de usuário; os dados de licença refletidos diretamente da Vigos Cloud) e navegação por abas: Usuários / Equipes / Permissões personalizadas.</p><p><strong>Tela 2: Listagem de Usuários</strong>: tabela com colunas Foto, Nome e e-mail, Perfil (dropdown editável inline), Visibilidade (resumo por módulo), Status, e menu de ações (⋮). Busca e filtro por perfil/status. Botão "Conceder acesso" (desabilitado sem licença disponível, com indicador do motivo). <strong>Ponto de partida do fluxo</strong>: leva a duas rotas: conceder acesso a um usuário da Vigos Cloud, ou agir sobre um usuário que já tem acesso via o menu de ações.</p><p><strong>Tela 3: Modal: Conceder acesso</strong>: busca/seleção de um usuário já existente na Vigos Cloud (usuários que já têm acesso ao CRM aparecem ocultos/desabilitados na lista), seletor de Perfil já mostrando os 2 perfis padrão do sistema (Administrador e Usuário), com nota de que novos perfis personalizados aparecem aqui assim que forem criados na aba Permissões Personalizadas. Exibe contador de licenças disponíveis no topo e aviso de e-mail automático de acesso ao CRM liberado.</p><p><strong>Tela 4: Menu de ações rápidas</strong>: o ponto único de acesso às ações sobre um usuário já com acesso. Abre ancorado no ícone (⋮) da linha correspondente na listagem, e reúne: <strong>Editar usuário</strong> (leva à Tela 5), <strong>Copiar ID</strong>, e <strong>Desativar acesso</strong> (leva à Tela 6): este último item alterna para "Ativar acesso" quando o status já é Inativo.</p><p><strong>Tela 5: Painel lateral: Editar Usuário</strong>: acionada a partir do menu de ações. Seletor de Perfil (dropdown) + legenda explicando os 3 níveis de visibilidade + bloco de Visibilidade com 3 grupos de radio button (Negociações / Empresas / Contatos), cada um com Restrita / Equipe / Geral.</p><p><strong>Tela 6: Reatribuição em 2 passos ao desativar</strong>: acionada ao escolher "Desativar acesso" no menu de ações, só quando o usuário tem ao menos 1 registro em aberto. Passo 1: escolha rápida de um destino único para tudo (opção "Gestor da equipe" só aparece se a equipe tiver gestor definido). Passo 2 (opcional): lista simples de cada registro com o destino herdado, ajustável individualmente. Frase de resumo mostra o resultado antes de confirmar. Só entram nesta tela negociações não fechadas (nem Ganha, nem Perdida) e contatos vinculados a alguma dessas negociações.</p><p><strong>Tela 7: Painel/alerta de registros sem responsável</strong>: só aparece quando a Tela 6 resulta em ao menos 1 registro sem destino. Visível para qualquer Administrador, com ação rápida de reatribuir por registro.</p><p><strong>Tela 8: Modal: Reativar acesso</strong>: acionada a partir do menu de ações de um usuário Inativo. Mostra a checagem de licença disponível (via Vigos Cloud) antes de permitir a reativação, o resumo de Perfil e Visibilidade que serão restaurados automaticamente, e a nota de que registros reatribuídos não voltam sozinhos. Se não houver licença disponível, o modal exibe o bloqueio (Tela 8.1) em vez do formulário normal.`,
    fluxo: `Três fluxos cobrem esta sub-seção: <strong>concessão de acesso</strong> a um usuário já existente na Vigos Cloud (com verificação de acesso já concedido e de licença), <strong>desativação</strong> (com as verificações de administrador único, registros ativos e escolha de reatribuição) e <strong>reativação</strong> (com verificação de licença, retorno automático de perfil/visibilidade, e decisão manual sobre devolução de registros). Os diagramas completos estão logo abaixo.`,
    entidades: `<strong>Usuário → Perfil</strong>: cada usuário tem exatamente 1 perfil (Administrador, Usuário, ou customizado).</p><p><strong>Usuário → Equipe(s)</strong>: <strong>confirmado</strong>: um usuário pode pertencer a 1 ou mais equipes simultaneamente (detalhado na sub-seção Equipes).</p><p><strong>Usuário → Licença</strong>: todo usuário com status Ativo ocupa exatamente 1 licença do plano; um usuário Inativo não ocupa nenhuma.</p><p><strong>Perfil → Permissões</strong>: cada perfil carrega um conjunto de permissões (detalhado na sub-seção Permissões Personalizadas).</p><p><strong>Negociação → Usuário responsável</strong>: cada negociação tem exatamente 1 responsável, que pode ser trocado via reatribuição.</p><p><strong>Contato → Negociações</strong>: um contato pode estar ligado a 0 ou mais negociações; para fins de reatribuição, o "responsável" de um contato é herdado das negociações em aberto às quais ele está vinculado.`,
    execucao: `<strong>Tratamento de falhas</strong></p><p><strong>Conceder acesso a um usuário</strong>: a seleção do usuário na Vigos Cloud e o perfil são salvos como uma operação única; ou tudo é salvo, ou nada é. Se o e-mail de notificação automática falhar ao ser enviado, a concessão de acesso <strong>não é desfeita</strong> (o acesso já existe e está ativo); o sistema deve registrar essa falha para permitir reenvio manual do e-mail pelo Administrador depois.</p><p><strong>Reatribuição em massa</strong>: é uma operação "tudo ou nada"; se o sistema falhar ao mover parte dos registros, <strong>nenhum registro é reatribuído</strong>, evitando o cenário de parte dos itens movidos e parte não. O Administrador vê uma mensagem de erro e pode tentar novamente.</p><p><strong>Edição simultânea por 2 administradores</strong>: não há bloqueio de edição concorrente nesta fase; quem salvar por último sobrescreve a versão anterior. Complexidade de lock/merge fica fora do escopo do MVP.</p><p><strong>Síncrono vs. em segundo plano</strong></p><p><strong>Conceder acesso</strong>: a confirmação na tela acontece assim que o usuário selecionado e o perfil são salvos (síncrono). O envio do e-mail de notificação acontece depois, em segundo plano; o Administrador não espera o e-mail sair para continuar usando o sistema.</p><p><strong>Reatribuição em massa</strong>: o Administrador espera a confirmação de que tudo foi movido antes do modal fechar (síncrono), consistente com a regra de "tudo ou nada" acima.</p><p><strong>Notificações por e-mail em geral</strong> (concessão de acesso, reativação): nunca geram espera visível ao Administrador.</p><p><strong>Confirmação visual após salvar</strong></p><p>Toda ação de salvar (conceder acesso, editar perfil/visibilidade, desativar, reativar) exibe uma <strong>mensagem rápida de confirmação (toast)</strong> que aparece por alguns segundos e some sozinha; por exemplo, "Acesso concedido", "Alterações salvas", "Acesso desativado". Não há tela de confirmação separada nem necessidade de clique adicional para dispensar a mensagem.</p><p><strong>Seleção de "outro usuário específico" na reatribuição</strong></p><p>O campo de destino, quando o Administrador escolhe reatribuir para uma pessoa específica (fora o gestor da equipe), usa uma <strong>lista simples em dropdown</strong> com todos os usuários com acesso ativo ao CRM; não é necessário campo de busca com autocomplete nesta fase, dado o volume de usuários esperado por conta.`,
    auditoria: `Toda ação relevante sobre um usuário deve ser registrada em um log de auditoria, contendo:</p><ul><li><strong>Quem</strong>: o Administrador que realizou a ação</li><li><strong>Quando</strong>: data e hora exatas</li><li><strong>O quê</strong>: qual tipo de alteração (criação, edição de perfil, edição de visibilidade, mudança de equipe, ativação, desativação, reatribuição)</li><li><strong>Valor anterior</strong>: o dado antes da mudança (ex: perfil "Usuário")</li><li><strong>Valor novo</strong>: o dado depois da mudança (ex: perfil "Vendedor")</li></ul><p>Casos específicos a registrar:</p><ul><li><strong>Alteração de perfil</strong>: perfil anterior → perfil novo</li><li><strong>Alteração de equipe</strong>: equipe(s) anterior(es) → equipe(s) nova(s)</li><li><strong>Alteração de status</strong>: Ativo → Inativo ou Inativo → Ativo, incluindo o destino de reatribuição escolhido (se houve desativação com registros em aberto)</li></ul><p>⚠️ <em>Retenção e visualização do log de auditoria (por quanto tempo fica guardado, se existe uma tela para o Administrador consultar esse histórico) ainda não foram definidas; ficam como pendência para quando avaliarmos a Etapa de Configurações Avançadas.</em>`,

  "1.equipes": {
    descricao: `Equipe é o mecanismo de <strong>agrupamento de usuários</strong>: normalmente por área comercial, função ou frente de atuação (ex: "Closers", "Gestores", "Sucesso do Cliente"). É a peça que conecta Usuários com Visibilidade de dados e com Funis de Vendas: uma equipe define quem vê o quê, e quais funis cada grupo de pessoas enxerga.</p><p>Um usuário pode pertencer a <strong>mais de 1 equipe simultaneamente</strong>. Uma equipe pode existir <strong>sem nenhum usuário</strong> dentro dela; é um estado normal, não um erro (útil quando a equipe está sendo preparada antes de alguém entrar nela).`,
    porque: `Equipes existem para responder duas perguntas que Perfil e Permissões sozinhos não respondem: "quem vê os dados de quem" (visibilidade) e "quem enxerga qual funil" (conexão com a Etapa Funil de Vendas). Sem esse agrupamento, a única alternativa seria dar visibilidade Geral (vê tudo) ou Restrita (só vê o próprio) para cada pessoa; sem meio-termo por área ou time, o que não reflete como empresas reais se organizam.`,
    subetapas: [
      { titulo: "Criação de equipe (2 passos)", texto: `O Administrador cria uma equipe em 2 passos: primeiro define apenas o <strong>Nome da equipe</strong> (campo obrigatório) e avança; depois entra na tela de <strong>Adicionar usuário</strong>, com um campo de busca por nome que lista os usuários disponíveis da conta. Uma equipe pode ser criada e salva <strong>sem nenhum usuário</strong> adicionado; isso é permitido e não gera erro.<br><br><strong>Gestor da equipe é opcional</strong>: não é obrigatório definir um gestor ao criar ou editar uma equipe. Se a equipe não tiver gestor definido, isso não impede nenhuma operação; apenas significa que, na hora da reatribuição ao desativar um usuário daquela equipe, a opção "Gestor da equipe" simplesmente não aparece como destino disponível (ver sub-etapa de Reatribuição em Usuários).` },
      { titulo: "Visibilidade por usuário, dentro do contexto da equipe", texto: `Ao editar uma equipe, cada usuário listado tem seu próprio campo de <strong>Visibilidade</strong> (com as mesmas opções Restrita/Equipe/Geral já definidas na Etapa Usuários). <strong>Importante</strong>: isso não é um campo novo ou separado; é o <strong>mesmo dado de visibilidade</strong> do usuário, exibido aqui também por conveniência, para o Administrador poder ajustar a visibilidade de várias pessoas sem precisar abrir a tela de Editar Usuário de cada uma individualmente.<br><br><strong>Regra de borda, usuário sem nenhuma equipe</strong>: se um usuário com visibilidade "Equipe" for removido de todas as equipes às quais pertencia, ele passa a <strong>ver zero registros</strong>: a visibilidade "Equipe" sem nenhuma equipe vinculada não faz uma busca alternativa nem cai para "Restrita" automaticamente. ⚠️ <em>Ponto de atenção de UX: essa situação pode confundir o usuário final, que de repente não vê mais nada sem entender por quê; vale considerar um aviso na interface quando isso acontecer, a definir com o time de UX.</em>` },
      { titulo: "Remover usuário de uma equipe", texto: `Cada usuário listado na tela de Editar Equipe tem um botão de remover (✕) ao lado. Remover um usuário da equipe não desativa o usuário nem afeta seu acesso ao sistema; apenas tira o vínculo dele com aquela equipe específica. Se o usuário estiver em outras equipes, esses vínculos permanecem.` },
      { titulo: "Exclusão de equipe", texto: `Uma equipe pode ser excluída mesmo tendo usuários vinculados; nesse caso, os usuários simplesmente <strong>deixam de pertencer</strong> àquela equipe (continuam existindo e ativos no sistema, só perdem esse vínculo específico). Se a equipe excluída estava marcada como "quem pode ver" em algum Funil de Vendas, ela é <strong>removida silenciosamente</strong> da lista de visibilidade daquele funil; o funil continua existindo normalmente, só com uma equipe a menos na lista de quem pode vê-lo.` },
      { titulo: "Equipe como filtro de Negociações", texto: `As equipes cadastradas aparecem como opção de filtro na tela de Negociações (dentro do funil), permitindo ao usuário filtrar a visualização por "Todas as negociações", "Minhas negociações", ou marcar 1 ou mais equipes específicas para ver apenas as negociações dos usuários daquelas equipes.` },
      { titulo: "Equipe na configuração de visibilidade do Funil", texto: `Ao criar ou editar um Funil de Vendas, existe o campo "Selecione quem pode ver este funil", com a opção "Todas as equipes" ou a seleção de equipes específicas. Essa configuração usa Equipe como unidade de controle: quem está em uma equipe marcada aqui enxerga o funil, quem não está, não vê.` },
      { titulo: "Duas camadas de visibilidade que atuam juntas", texto: `A partir daqui, existem <strong>2 camadas independentes de visibilidade</strong> que precisam ser pensadas em conjunto; não são a mesma regra, e ambas se aplicam ao mesmo tempo:<br><br><strong>1. Visibilidade do usuário</strong> (Restrita/Equipe/Geral, configurada na sub-seção Usuários): controla, por módulo (Negociações/Empresas/Contatos), quais <em>registros</em> uma pessoa pode ver.<br><strong>2. Visibilidade do funil</strong> ("Todas as equipes" ou equipes específicas, configurada na tela de Editar Funil): controla se uma pessoa enxerga o <em>funil inteiro</em>, independente do que a visibilidade dela permitiria ver dentro dele.<br><br>Na prática, as duas se combinam: uma pessoa só vê uma negociação se (a) ela tiver visibilidade suficiente para aquele registro específico, <strong>e</strong> (b) sua equipe tiver acesso ao funil onde aquela negociação está.<br><br>⚠️ <em>Esse cruzamento entre as 2 camadas precisa ser detalhado com a lógica exata de combinação (é "E" ou existe alguma exceção?) quando chegarmos na Etapa Funil de Vendas; por ora, ficam registradas as 2 camadas existentes e o fato de que elas atuam juntas, não isoladamente.</em>` },
    ],
    acoes: [
      "Criar nova equipe (nome, depois adicionar usuários)",
      "Adicionar usuário a uma equipe existente (busca por nome)",
      "Remover usuário de uma equipe (sem afetar seu acesso ao sistema)",
      "Editar visibilidade de um usuário a partir da tela da equipe",
      "Renomear equipe existente",
      "Excluir equipe (mesmo com usuários vinculados)",
      "Filtrar negociações por 1 ou mais equipes",
      "Selecionar quais equipes podem ver um determinado funil",
    ],
    entidades: `<strong>Equipe → Usuários</strong>: relação muitos-para-muitos; uma equipe tem 0 ou mais usuários, e um usuário pode pertencer a 0 ou mais equipes simultaneamente.</p><p><strong>Equipe → Visibilidade</strong>: não existe um campo de visibilidade "da equipe"; o que existe é a visibilidade "do usuário", exibida também na tela da equipe por conveniência. É o mesmo dado em 2 lugares, não 2 dados diferentes.</p><p><strong>Equipe → Funil de Vendas</strong>: relação muitos-para-muitos; um funil pode ser visível para "todas as equipes" ou para uma seleção específica; uma equipe pode estar vinculada à visibilidade de 0 ou mais funis. Excluir a equipe apenas remove essa referência, sem afetar o funil.`,
    telas: `<strong>Tela 1: Listagem de Equipes</strong>: dentro da tela-mãe (aba Equipes). Tabela com Nome da equipe, contagem e avatares dos usuários, e menu de ações (⋮) por linha. Botão "Criar nova equipe".</p><p><strong>Tela 2: Modal: Criar equipe, passo 1: nome</strong>: campo único "Nome da equipe", botão "Próximo".</p><p><strong>Tela 3: Painel: Adicionar usuários (passo 2)</strong>: campo de busca por nome, lista de usuários disponíveis para adicionar, botão "Concluir".</p><p><strong>Tela 4: Painel: Editar equipe</strong>: nome da equipe editável, campo de busca para adicionar novo usuário, e lista dos usuários já na equipe, cada um com seu campo de Visibilidade (dropdown) e botão de remover (✕). O dropdown de Visibilidade tem as mesmas 3 opções já definidas na sub-seção Usuários: <strong>Restrita</strong> (só vê os próprios registros), <strong>Equipe</strong> (vê os registros de todas as equipes a que pertence) e <strong>Geral</strong> (vê todos os registros da conta); é o mesmo campo, editável aqui por conveniência, não uma configuração nova.</p><p><strong>Integração 1: Filtro de equipes na tela de Negociações</strong>: checkboxes por equipe dentro do filtro "Todas as negociações / Minhas negociações".</p><p><strong>Integração 2: Seleção de equipes na tela de Editar Funil</strong>: campo multi-seleção "Selecione quem pode ver este funil", com opção "Todas as equipes" ou equipes específicas.`,
    fluxo: `Dois fluxos cobrem esta sub-seção: <strong>criação de equipe</strong> (nome → adicionar usuários → concluir) e <strong>exclusão de equipe</strong> (com a regra de que usuários e funis vinculados não são afetados, apenas perdem essa referência específica). Os diagramas estão logo abaixo.`,
    execucao: `<strong>Equipe vazia</strong>: é um estado permitido e esperado do sistema; nenhuma validação deve impedir salvar uma equipe sem usuários.</p><p><strong>Exclusão em cascata</strong>: ao excluir uma equipe, a operação deve (1) remover o vínculo com todos os usuários que pertenciam a ela, e (2) remover a equipe de qualquer lista de visibilidade de funil onde estivesse marcada; <strong>sem</strong> excluir os usuários nem os funis em si. Essa é uma operação "tudo ou nada": ou a equipe some de todos os lugares que a referenciam, ou a exclusão inteira falha e nada muda.</p><p><strong>Confirmação visual</strong>: seguindo o padrão já definido em Usuários, toda ação de salvar (criar equipe, editar, excluir) exibe uma mensagem rápida de confirmação (toast) que some sozinha.`,
    auditoria: `Toda ação relevante sobre uma equipe deve ser registrada em um log de auditoria, contendo:</p><ul><li><strong>Quem</strong>: o Administrador que realizou a ação</li><li><strong>Quando</strong>: data e hora exatas</li><li><strong>O quê</strong>: tipo de alteração (criação de equipe, renomeação, usuário adicionado, usuário removido, alteração de visibilidade a partir da tela da equipe, exclusão de equipe)</li><li><strong>Valor anterior</strong>: o dado antes da mudança (ex: nome "Equipe Comercial")</li><li><strong>Valor novo</strong>: o dado depois da mudança (ex: nome "Closers")</li></ul><p>Casos específicos a registrar:</p><ul><li><strong>Usuário adicionado/removido de equipe</strong>: qual usuário, qual equipe, e a data</li><li><strong>Exclusão de equipe</strong>: nome da equipe excluída, lista de usuários que perderam o vínculo, e lista de funis que perderam a referência de visibilidade; importante para rastrear o impacto em cascata depois</li></ul><p>⚠️ <em>Assim como em Usuários, retenção e tela de consulta ao histórico de auditoria ficam como pendência para a Etapa de Configurações Avançadas.</em>`,

  "1.permissoes": {
    descricao: `Permissões Personalizadas é onde o Administrador define, em detalhe granular, <strong>o que cada perfil pode fazer</strong> dentro do CRM. É aqui que os "perfis customizados" mencionados na sub-seção Usuários ganham forma concreta.</p><p>O sistema tem 2 perfis fixos, que <strong>não podem ser alterados nem excluídos</strong>: <strong>Administrador</strong> (acesso geral a tudo) e <strong>Usuário</strong> (permissões básicas; acesso a negociações, análises, empresas e contatos). Qualquer perfil adicional é um <strong>perfil personalizado</strong>, criado pelo Administrador, que nasce automaticamente com as mesmas permissões básicas do perfil Usuário; o Administrador então <strong>adiciona</strong> permissões extras específicas, marcando checkboxes organizados em 6 categorias fixas: <strong>Análises, Configurações avançadas, Negociações e tarefas, Contatos, Empresas, e Dados da conta</strong>.`,
    porque: `Um cargo raramente encaixa perfeitamente em "acesso básico" ou "acesso total". Um Gestor Comercial, por exemplo, pode precisar ver relatórios de performance e alterar responsável em negociações; mas não precisa (e não deveria) ter acesso a Conta e Planos ou Integrações. Permissões Personalizadas existe justamente para desenhar esses papéis intermediários com precisão, em vez de forçar a escolha entre os 2 extremos fixos do sistema.`,
    subetapas: [
      { titulo: "Criação de perfil personalizado (2 passos)", texto: `Assim como em Equipes, a criação segue 2 passos: primeiro o Administrador define apenas o <strong>Nome do perfil</strong> (campo obrigatório); ao confirmar, o novo perfil já existe e nasce automaticamente com <strong>as mesmas permissões básicas do perfil Usuário</strong>: nenhuma permissão extra vem marcada por padrão. Em seguida, o Administrador é levado à tela de configuração, onde pode <strong>adicionar</strong> permissões extras marcando os checkboxes desejados nas 6 categorias.<br><br><strong>Regra de nome único</strong>: diferente de Equipes (onde nomes podem se repetir), o nome de um perfil personalizado <strong>precisa ser único</strong> na conta; o sistema bloqueia a criação de um perfil com nome já existente, exibindo mensagem de erro. Isso porque cada perfil carrega um conjunto próprio de permissões, e nomes repetidos gerariam confusão sobre qual conjunto de permissões está sendo atribuído a um usuário.<br><br>⚠️ <em>Nota para o TI: o RD Station (referência usada neste levantamento) limita a quantidade de perfis personalizados por plano contratado (ex: 1 no plano equivalente ao Pro, até 10 no plano equivalente ao Advanced). Fica como observação/sugestão para avaliação; não foi definida como regra obrigatória para o CRM Vigos neste momento.</em>` },
      { titulo: "As 6 categorias de permissão", texto: `Cada perfil (exceto os 2 fixos) tem suas permissões organizadas em <strong>6 categorias fixas do sistema</strong>: Análises, Configurações avançadas, Negociações e tarefas, Contatos, Empresas, e Dados da conta; navegáveis por uma barra lateral dentro da tela do perfil.<br><br>Cada permissão listada dentro de uma categoria tem uma descrição de 1 linha explicando exatamente o que ela libera, e é um <strong>checkbox independente</strong> (ligado/desligado), sem hierarquia entre elas dentro da categoria.<br><br>A lista completa de permissões de cada categoria está detalhada nos wireframes (Telas 3.1 a 3.6, abaixo).` },
      { titulo: "Permissão com dependência de outra tela", texto: `Duas permissões ("Alterar responsável na Negociação" e "Alterar responsável de Empresa") têm uma particularidade: mesmo marcadas, elas só têm efeito se a tela de <strong>Preferências</strong> estiver configurada com a opção "Apenas Administradores e perfis que tenham permissão". Ou seja, existe uma <strong>configuração-mestra</strong> em outro lugar do sistema que precisa estar ativada para essa permissão específica funcionar; isso precisa ficar claro na interface para não confundir o Administrador que marca a permissão aqui e não vê efeito nenhum.<br><br>⚠️ <em>Essa tela de "Preferências" ainda não foi detalhada no nosso índice; fica registrada como dependência a resolver quando chegarmos na Etapa de Configurações Avançadas/Preferências Gerais.</em>` },
      { titulo: "Edição de perfil existente", texto: `O Administrador pode reabrir qualquer perfil personalizado (não os 2 fixos) e alterar suas permissões a qualquer momento; adicionando ou removendo checkboxes. A alteração é salva por categoria (botão "Salvar" ao final de cada tela de categoria), <strong>não</strong> em um salvamento único para todas as 6 categorias de uma vez.` },
      { titulo: "Exclusão de perfil personalizado", texto: `Um perfil personalizado pode ser excluído pelo menu de ações da listagem, <strong>mesmo que ainda tenha usuários vinculados a ele</strong>. A exclusão é permitida sem bloqueio: os usuários que estavam com aquele perfil <strong>voltam automaticamente para o perfil "Usuário" (básico)</strong>, nunca ficam sem nenhum perfil atribuído, já que essa condição não é permitida no sistema. A tela confirma com um toast "Perfil excluído".` },
    ],
    acoes: [
      "Criar novo perfil personalizado (nome, nascendo com permissões básicas do perfil Usuário)",
      "Marcar/desmarcar permissões dentro das 6 categorias (Análises, Configurações avançadas, Negociações e tarefas, Contatos, Empresas, Dados da conta)",
      "Editar nome de um perfil personalizado existente",
      "Salvar alterações de permissão por categoria",
      "Excluir um perfil personalizado",
      "Visualizar quais usuários estão em determinado perfil (\"Ver usuários neste perfil\")",
    ],
    entidades: `<strong>Perfil → Permissões</strong>: um perfil (exceto os 2 fixos) tem 0 ou mais permissões marcadas, organizadas em 6 categorias fixas do sistema.</p><p><strong>Perfil → Usuário</strong>: relação um-para-muitos; um perfil pode estar atribuído a 0 ou mais usuários; cada usuário tem exatamente 1 perfil (relação já definida na sub-seção Usuários).</p><p><strong>Permissão → Configuração-mestra (Preferências)</strong>: algumas permissões (ex: alterar responsável) dependem de uma configuração em outra tela do sistema para surtir efeito; não é uma relação direta de dados, mas uma dependência funcional que precisa ser respeitada na lógica de verificação de acesso.`,
    telas: `<strong>Tela 1: Listagem de Perfis</strong>: dentro da tela-mãe (aba Permissões personalizadas). Lista os 2 perfis fixos (Administrador, Usuário; marcados como "não pode ser alterado") e os perfis personalizados criados, cada um com nome, badge de tipo, descrição curta, e menu de ações (⋮). Botão "Criar novo perfil".</p><p><strong>Tela 2: Modal: Criar novo perfil</strong>: campo único "Nome do perfil", botão "Criar perfil".</p><p><strong>Tela 3: Detalhe do perfil (com navegação por categoria)</strong>: nome do perfil editável (ícone de lápis), botão "Ver usuários neste perfil", e uma barra lateral com as 6 categorias de permissão (Análises, Configurações avançadas, Negociações e tarefas, Contatos, Empresas, Dados da conta). Ao clicar em cada categoria da barra lateral, o conteúdo à direita troca para mostrar as permissões daquela categoria específica; são 6 variações da mesma tela-base (Telas 3.1 a 3.6), cada uma com sua própria lista de permissões, descrições e botão "Salvar". A lista completa de permissões de cada categoria está nos wireframes correspondentes, logo abaixo.`,
    fluxo: `Dois fluxos cobrem esta sub-seção: <strong>criação de perfil personalizado</strong> (nome → nasce com permissões básicas → Admin adiciona extras por categoria) e <strong>exclusão de perfil</strong> (com a pendência registrada sobre usuários vinculados). Os diagramas estão logo abaixo.`,
    execucao: `<strong>Perfil personalizado nasce com permissões do Usuário</strong>: tecnicamente, isso significa que o novo perfil deve copiar o conjunto de permissões básicas do perfil Usuário no momento da criação; não deve haver referência viva a "herdar do perfil Usuário para sempre"; se o perfil Usuário mudar depois, os perfis personalizados já criados não devem mudar retroativamente.</p><p><strong>Salvamento por categoria</strong>: diferente de Usuários e Equipes (que salvam a tela inteira de uma vez), aqui cada categoria de permissão é uma operação de salvamento independente; o Administrador pode sair da tela de "Análises" com alterações salvas e ainda não ter mexido em "Contatos".</p><p><strong>Confirmação visual</strong>: segue o mesmo padrão; toast de confirmação ao criar, salvar ou excluir um perfil.`,
    auditoria: `Toda ação relevante sobre um perfil personalizado deve ser registrada em log de auditoria, contendo:</p><ul><li><strong>Quem</strong>: o Administrador que realizou a ação</li><li><strong>Quando</strong>: data e hora exatas</li><li><strong>O quê</strong>: tipo de alteração (criação de perfil, renomeação, permissão marcada/desmarcada; com indicação de qual categoria e qual permissão específica, exclusão de perfil)</li><li><strong>Valor anterior e novo</strong>: ex: permissão "Excluir negociações" mudou de desmarcada para marcada</li></ul><p>Esse log é particularmente sensível porque envolve mudança de poder de acesso; vale considerar prioridade alta para essa auditoria específica.`,
