  "6.contatos": {
    descricao: `Contato é a entidade que representa a pessoa física com quem a Vigos se relaciona comercialmente. Diferente de Fontes, Campanhas e Motivos de Perda, já documentados nas Etapas 4 e 5, Contato não é um cadastro de apoio consumido por dropdown dentro de outra tela; é uma entidade própria, com tela de listagem dedicada no menu lateral principal, busca, filtros e ciclo de vida completo (criação, edição, exclusão). Reaproveita os 5 campos padrão já definidos na Etapa 3, Campos Personalizados, aba Contato.</p><p>Um Contato pode existir de forma independente, sem estar vinculado a nenhuma Empresa nem a nenhuma Negociação; o vínculo com uma Empresa é sempre opcional. Quando vinculado, a relação é de N Contatos para 1 Empresa: cada Contato pertence a, no máximo, 1 Empresa por vez, nunca a mais de uma simultaneamente (detalhado na sub-seção Empresas desta mesma etapa). Contato é a base sobre a qual a Etapa 8, Negociações, será construída: toda Negociação exige exatamente 1 Contato vinculado no momento da criação.</p><p>Contato pode ser criado em 4 pontos diferentes do sistema: pela tela de listagem própria (menu Contatos), pelo menu global "+ Criar" disponível a partir da tela de Negociações, de forma inline dentro do formulário de criação de uma Negociação, e a partir da tela de uma Empresa já existente.`,
    porque: `Contato precisa existir antes da Etapa 8, Negociações, porque toda Negociação depende de ter exatamente 1 Contato vinculado no momento da criação; sem essa entidade pronta, não há o que selecionar no formulário de Negociação.</p><p>A separação de Contato como entidade independente, e não como texto livre dentro da Negociação, é o que permite ao vendedor reaproveitar a mesma pessoa em múltiplas Negociações ao longo do tempo, sem recadastrar os dados a cada nova oportunidade comercial.`,
    subetapas: [
      { titulo: "Estrutura de dados de um Contato", texto: `Todo Contato é um registro independente com ID próprio, existindo fora e antes de qualquer Negociação. Atributos: Nome do contato (texto, obrigatório), Cargo (texto, opcional), Telefones (lista de 0 ou mais, cada um com código de país e número), E-mails (lista de 0 ou mais, cada um validado por formato), Empresa do contato (referência a 1 Empresa, opcional), Contato e envio de comunicação (seleção de base legal), Origem de Marketing (texto ou seleção, opcional).<br><br><strong>Regra de validação, campo obrigatório</strong>: Nome do contato não pode estar vazio para o registro ser persistido.<br><br><strong>Regra de validação, tamanho mínimo</strong>: qualquer campo de texto preenchido (Nome, Cargo, cada Telefone, cada E-mail) precisa ter no mínimo 2 caracteres; validar no backend, não apenas no frontend.<br><br><strong>Regra de validação, formato de e-mail</strong>: cada e-mail rejeita acento, espaço, letra maiúscula, os símbolos #, & e %, e qualquer conteúdo reconhecível como hyperlink; validar via expressão regular no backend antes de persistir.<br><br><strong>Regra de borda, duplicidade</strong>: o backend não aplica nenhuma constraint de unicidade sobre Nome nem sobre E-mail; mais de um registro de Contato pode existir com o mesmo valor nesses campos.` },
      { titulo: "Pontos de entrada para criação, mesmo endpoint, contextos diferentes", texto: `Existem 4 pontos de entrada na interface que levam ao mesmo formulário e ao mesmo endpoint de criação de Contato; o que muda entre eles é apenas o que vem pré-preenchido e o que fica bloqueado para edição:<br><br><strong>Tela de listagem</strong> (menu Contatos): formulário em branco, nenhum campo pré-preenchido, nenhum campo travado. (Imagem 1)<br><br><strong>Menu global "+ Criar"</strong> (a partir da tela de Negociações): formulário em branco, idêntico ao ponto anterior; não herda contexto de nenhuma Negociação específica, mesmo sendo acessado a partir dessa tela. (Imagem 3, Imagem 6)<br><br><strong>Inline, dentro do formulário de Criar Negociação</strong>: formulário em branco, mas a persistência do Contato acontece antes da persistência da Negociação, e o ID gerado é usado para vincular o card da Negociação (ver sub-etapa "Vínculo Contato → Negociação"). (Imagem 4, Imagem 6, Imagem 10)<br><br><strong>A partir da tela de detalhe de uma Empresa</strong> (botão "+ Adicionar contato"): campo Empresa do contato vem pré-preenchido com o ID da Empresa de origem, e esse campo específico fica bloqueado para edição neste formulário; os demais campos ficam em branco e editáveis normalmente. (Imagem 1, sub-seção "Criar contato em uma Empresa existente")<br><br><strong>Regra de borda</strong>: em nenhum dos 4 pontos de entrada o backend distingue a origem da requisição para aplicar regra de negócio diferente; a única diferença é o payload inicial que a interface envia.` },
      { titulo: "Vínculo Contato → Empresa", texto: `O campo Empresa do contato armazena uma referência (chave estrangeira) a, no máximo, 1 registro de Empresa por vez; nunca mais de uma Empresa simultânea para o mesmo Contato. O campo é opcional em todos os pontos de entrada, exceto o de criação a partir da Empresa, onde nasce preenchido. Trocar ou remover essa referência depois da criação é permitido livremente via edição do Contato, sem nenhuma restrição adicional.` },
      { titulo: "Vínculo Contato → Negociação, ordem de criação e propagação de edição", texto: `<strong>Regra de operação, ordem de criação</strong>: quando o Contato é criado de forma inline dentro do formulário de Negociação, o backend persiste o Contato primeiro, obtendo seu ID; só então a Negociação é criada, armazenando esse ID como referência. Não é uma transação atômica única entre as duas entidades: o Contato passa a existir como registro independente e consultável mesmo que a criação da Negociação falhe em uma etapa posterior do mesmo fluxo. O mesmo padrão vale para Empresa criada inline.<br><br><strong>Regra de propagação, edição por referência</strong>: a Negociação armazena o ID do Contato, nunca uma cópia dos seus dados; qualquer edição posterior no Contato (nome, telefone, e-mail, Empresa vinculada) é refletida automaticamente em toda Negociação que o referencia, sem necessidade de sincronização manual.<br><br><strong>Ponto de atenção</strong>: como toda Negociação exige exatamente 1 Contato (Etapa 8), e o vínculo é por referência, a exclusão de um Contato precisa de uma regra explícita de tratamento da Negociação que fica sem essa referência válida; essa regra específica pertence à Etapa 8, Negociações, e não deve ser presumida aqui.` },
      { titulo: "Editar Contato", texto: `Todo campo de Contato, incluindo Empresa do contato, é editável livremente a qualquer momento, sem campo travado, diferente do padrão de Fonte e Campanha (Etapa 4), que não permitem edição após a criação.<br><br><strong>Regra de operação</strong>: cada edição é uma atualização direta do registro existente (mesmo ID), não a criação de um novo registro; por isso a propagação por referência se aplica automaticamente, sem lógica adicional a implementar.` },
      { titulo: "Excluir Contato", texto: `Segue o mesmo mecanismo transversal de Lixeira já usado no projeto: modal com 2 caminhos, "Enviar para a lixeira" (qualquer perfil, gera solicitação pendente de aprovação nas abas Exclusões Pendentes/Aprovadas/Negadas) e "Excluir permanentemente" (síncrono, imediato, habilitado somente após checkbox de confirmação explícita).<br><br><strong>Regra de borda, Contato vinculado a Negociação</strong>: diferente de Fonte e Campanha, que bloqueiam a exclusão quando há vínculo ativo, a exclusão de um Contato referenciado por 1 ou mais Negociações é permitida; o backend deve remover essa referência de cada Negociação afetada como parte da mesma operação de exclusão.<br><br><strong>Ponto de atenção, pendência formal para a Etapa 8</strong>: como toda Negociação exige exatamente 1 Contato, o comportamento da Negociação após perder essa referência (bloqueio de novas ações, exigência de novo Contato antes de continuar, ou outro tratamento) ainda não foi definido pela Eliana; não implementar a remoção de referência sem essa regra estar resolvida na Etapa 8.` },
    ],

    entidades: `<strong>Contato → Empresa</strong>: relação N para 1, 0 ou 1 Empresa por Contato. Cada Contato referencia no máximo 1 Empresa por vez; a mesma Empresa pode ser referenciada por 0 ou mais Contatos.</p><p><strong>Contato → Negociação</strong>: relação 1 para N, exatamente 1 Contato por Negociação, 0 ou mais Negociações por Contato. Toda Negociação exige exatamente 1 Contato (já definido no projeto); um Contato pode não estar vinculado a nenhuma Negociação, ou estar vinculado a várias.</p><p><strong>Campos da entidade Contato</strong>: id (identificador único, gerado pelo sistema), nome (texto, obrigatório, mínimo 2 caracteres), cargo (texto, opcional, mínimo 2 caracteres se preenchido), telefones (lista de 0 ou mais objetos, cada um com código de país e número, mínimo 2 caracteres no número), emails (lista de 0 ou mais textos, cada um validado por formato, mínimo 2 caracteres), empresa_id (referência opcional a 1 registro de Empresa), base_legal (seleção de valor pré-definido, opcional), origem_marketing (texto ou seleção, opcional), criado_em (data e hora, gerado pelo sistema), atualizado_em (data e hora, gerado pelo sistema).`,
    telas: `<strong>Imagem 1</strong>: Tela de listagem de Contatos: tabela com todos os Contatos da conta, busca por nome, botão "Criar contato" que abre o painel lateral de cadastro.</p><p><strong>Imagem 3</strong>: Menu global "+ Criar", a partir da tela de Negociações: dropdown com as opções Criar Negociação, Criar Contato, Criar Empresa e Criar Tarefa.</p><p><strong>Imagem 4</strong>: Painel lateral "Criar Negociação", seção "INFORMAÇÕES DO CONTATO": campo de seleção de Contato existente e link "+ Adicionar contato".</p><p><strong>Imagem 6</strong>: Painel lateral "Criar Negociação", mesma seção, em estado inicial antes de qualquer seleção.</p><p><strong>Imagem 10</strong>: Sub-formulário expandido "Adicionar contato" dentro do painel de Criar Negociação: Nome, Cargo, Telefone com múltiplos números, E-mail com múltiplos endereços.</p><p><strong>Imagem 11</strong>: Painel lateral "Criar Negociação" completo, mostrando Contato e Empresa preenchidos simultaneamente, incluindo os campos Contato e envio de comunicação e Origem de Marketing.</p><p>Referência de central de ajuda, sub-seção "Criar contato via menu": painel lateral "Criar Contato" com todos os campos padrão, incluindo Empresa do contato e Contato e envio de comunicação.</p><p>Referência de central de ajuda, sub-seção "Criar contato a partir de uma nova Negociação": mesmo painel, acessado via menu "+ Criar" a partir da tela de Negociações.</p><p>Referência de central de ajuda, sub-seção "Criar contato em uma Empresa existente": tela de detalhe da Empresa com botão "+ Adicionar contato", e o painel resultante com o campo Empresa pré-preenchido e travado.`,
    fluxo: `2 fluxogramas cobrem esta sub-seção: o primeiro é o macro, mostrando os 4 pontos de entrada de criação convergindo para o mesmo formulário e mesmo endpoint; o segundo é o fluxo detalhado de criação inline dentro de uma Negociação, decidindo a ordem de persistência (Contato criado antes da Negociação) e o vínculo por referência resultante. Um terceiro fluxograma cobre a decisão de exclusão (Enviar para a lixeira versus Excluir permanentemente), reaproveitando o padrão visual já usado nas Etapas 2, 4 e 5. Os diagramas completos estão logo abaixo.`,
    execucao: `<strong>Validações de campo obrigatório</strong>: Nome do contato é o único campo obrigatório para salvar; validado no backend em todos os 4 pontos de entrada, nunca apenas no frontend.</p><p><strong>Regra de operação tudo ou nada</strong>: a criação de um Contato isolado (sem Negociação envolvida) é uma operação única e atômica; ou o registro é salvo por completo, ou nada é salvo. Já a criação inline dentro de uma Negociação não é atômica entre as duas entidades: o Contato é persistido primeiro, como registro independente, e a Negociação é criada em seguida, referenciando o ID já existente. Se a criação da Negociação falhar depois do Contato já ter sido salvo, o Contato permanece existindo no sistema, disponível para seleção manual em uma nova tentativa.</p><p><strong>Síncrono vs. assíncrono</strong>: toda criação, edição e exclusão de Contato é síncrona; a interface aguarda a confirmação do backend antes de fechar o painel ou atualizar a listagem, sem processamento em segundo plano.</p><p><strong>Confirmação visual</strong>: toda ação de salvar exibe uma mensagem rápida de confirmação (toast), por exemplo "Contato criado", "Alterações salvas", "Contato enviado para a lixeira", "Contato excluído permanentemente", seguindo o mesmo padrão já usado nas Etapas 1, 4 e 5.</p><p><strong>Dependência de outras regras já definidas</strong>: o mecanismo de exclusão reaproveita integralmente o fluxo de Lixeira já definido na Etapa 2 e usado também nas Etapas 3, 4 e 5. A regra de tamanho mínimo de 2 caracteres é aplicada aqui pela primeira vez no CRM Vigos e deve ser reaproveitada em qualquer campo de texto livre de etapas futuras que envolvam cadastro de pessoa ou organização.`,
    auditoria: `Toda ação relevante sobre um Contato deve ser registrada em log de auditoria, contendo Quem (usuário que realizou a ação), Quando (data e hora exatas), O quê (criação, edição, envio para lixeira, exclusão permanente), Valor anterior e Valor novo, no mesmo padrão já definido na Etapa 1.</p><p>Casos específicos a registrar: criação de Contato, com o ponto de entrada usado (listagem, menu global, inline em Negociação, a partir de Empresa) e o payload completo enviado; edição de qualquer campo, com o valor anterior e o novo lado a lado, incluindo mudança de Empresa vinculada (Empresa anterior → Empresa nova, ou "nenhuma" quando aplicável); exclusão, registrando se foi via lixeira (pendente de aprovação) ou permanente, e a lista de Negociações que tiveram a referência a este Contato removida como consequência.`,

      "Toda ação de salvar, enviar para lixeira ou excluir exibe confirmação visual (toast)",

  "6.empresas": {
    descricao: `Empresa é a entidade que representa a organização à qual um ou mais Contatos podem estar vinculados. Assim como Contato, é uma entidade própria, com tela de listagem dedicada no menu lateral principal, e não um cadastro de apoio dentro de outra tela. Reaproveita os 5 campos padrão já definidos na Etapa 3, Campos Personalizados, aba Empresa.</p><p>A relação entre Empresa e Contato, já detalhada na sub-seção Contatos desta mesma etapa, é de 1 Empresa para N Contatos: uma Empresa pode ter vários Contatos associados, e o vínculo é sempre opcional para os dois lados. Diferente do nome do Contato, o nome da Empresa é único em toda a conta; o sistema bloqueia a criação de uma Empresa com um nome já existente. Empresa também se relaciona com Negociação, de forma opcional: uma Negociação pode existir vinculada apenas a um Contato, sem nenhuma Empresa associada.</p><p>Empresa pode ser criada em 3 pontos diferentes do sistema: pela tela de listagem própria (menu Empresas), pelo menu global "+ Criar" disponível a partir da tela de Negociações, e de forma inline dentro do formulário de criação de uma Negociação.`,
    porque: `Empresa precisa existir antes da Etapa 8, Negociações, porque o formulário de criação de Negociação permite vincular uma Empresa existente ou criar uma nova no mesmo fluxo; embora opcional, essa opção depende da entidade já estar pronta.</p><p>Separar Empresa de Contato como entidades distintas, cada uma com seu próprio cadastro, é o que permite ao vendedor consultar todas as pessoas de uma mesma organização em um único lugar, e acompanhar o relacionamento comercial da Vigos com a organização como um todo, não apenas com um contato isolado dentro dela.`,
    subetapas: [
      { titulo: "Estrutura de dados de uma Empresa", texto: `Toda Empresa é um registro independente com ID próprio, existindo fora e antes de qualquer Negociação e de qualquer Contato vinculado a ela. Atributos: Nome da empresa (texto, obrigatório, único), Segmento (referência opcional a 1 registro de Segmento, entidade própria detalhada na sub-etapa "Vínculo Empresa → Segmento"), URL (texto, opcional), Resumo (texto, opcional), Endereço (texto, opcional).<br><br><strong>Regra de validação, campo obrigatório</strong>: Nome da empresa não pode estar vazio para o registro ser persistido.<br><br><strong>Regra de validação, tamanho mínimo</strong>: qualquer campo de texto preenchido precisa ter no mínimo 2 caracteres; validar no backend.<br><br><strong>Regra de validação, unicidade</strong>: o Nome da empresa precisa ser único em toda a conta; o backend deve rejeitar a criação ou edição de uma Empresa cujo nome já exista em outro registro, retornando erro específico antes de persistir.<br><br><strong>Regra de borda, comparação de unicidade</strong>: esta regra usa o mesmo padrão de comparação já definido na Etapa 5 para Motivo de Perda, exata, sensível a maiúsculas/minúsculas e a espaços; nomes diferentes apenas por capitalização ou espaçamento são tratados como distintos e, portanto, não bloqueados entre si.<br><br><strong>Ponto de atenção</strong>: a Eliana ainda não confirmou se esse é o comportamento desejado para Empresa especificamente; usar o padrão já definido na Etapa 5 até uma decisão em contrário.` },
      { titulo: "Vínculo Empresa → Segmento", texto: `Segmento não é uma lista fixa de valores embutida no campo da Empresa; é uma entidade própria de cadastro de apoio, com tela de gestão dedicada em Configurações, seguindo o mesmo padrão já definido para Fonte e Campanha na Etapa 4. Cada Segmento tem: nome (texto, obrigatório, único), criado_em e atualizado_em (gerados pelo sistema).<br><br><strong>Regra de operação</strong>: uma Empresa referencia, no máximo, 1 Segmento por vez, seleção única (lista suspensa ou botões de opção no formulário de Empresa, nunca checkbox de múltipla seleção); um mesmo Segmento pode ser referenciado por 0 ou mais Empresas.<br><br><strong>Regra de criação de Segmento</strong>: o cadastro de novos Segmentos acontece na tela própria (Configurações → Segmentos), nunca dentro do formulário de Empresa; o formulário de Empresa apenas lista e permite selecionar 1 dos Segmentos já existentes.<br><br><strong>Regra de permissão</strong>: segue o mesmo padrão de Fonte e Campanha (Etapa 4): o Administrador sempre pode criar Segmento; um toggle "Permitir que usuários criem novos segmentos", controlado pelo Administrador, libera essa permissão também para o perfil Usuário. Nasce desligado por padrão.<br><br><strong>Regra de exclusão de Segmento</strong>: segue o mesmo mecanismo de Lixeira (Enviar para a lixeira / Excluir permanentemente) já usado no projeto; diferente de Contato e Empresa, a exclusão de um Segmento referenciado por 1 ou mais Empresas é bloqueada, seguindo o mesmo padrão de Fonte e Campanha, não o padrão de Contato/Empresa.<br><br><strong>Regra de validação, unicidade de nome de Segmento</strong>: mesmo padrão de comparação exata já usado em Empresa e em Motivo de Perda.` },
      { titulo: "Pontos de entrada para criação, mesmo endpoint, contextos diferentes", texto: `Existem 3 pontos de entrada na interface que levam ao mesmo formulário e ao mesmo endpoint de criação de Empresa:<br><br><strong>Tela de listagem</strong> (menu Empresas): formulário em branco. (Imagem 2, sub-seção "Criar Empresa via menu")<br><br><strong>Menu global "+ Criar"</strong> (a partir da tela de Negociações): formulário em branco; não herda contexto de nenhuma Negociação específica. (Imagem 2, sub-seção "Criar Empresa a partir de uma Negociação")<br><br><strong>Inline, dentro do formulário de Criar Negociação</strong>: formulário em branco, mas a persistência da Empresa acontece antes da persistência da Negociação, seguindo a mesma ordem já definida para Contato: a Empresa é criada primeiro, gerando seu ID, e esse ID é vinculado ao card da Negociação assim que criado. (Imagem 7, Imagem 8, Imagem 11)<br><br><strong>Regra de borda</strong>: em nenhum dos 3 pontos de entrada o backend distingue a origem da requisição para aplicar regra de negócio diferente; a única diferença é o payload inicial que a interface envia. A validação de unicidade de nome se aplica igualmente nos 3 pontos.` },
      { titulo: "Vínculo Empresa → Contato", texto: `Uma Empresa pode ser referenciada por 0 ou mais Contatos simultaneamente (relação inversa da entidade Contato → Empresa, já detalhada na sub-seção Contatos desta etapa, onde cada Contato referencia no máximo 1 Empresa). Não existe limite de quantidade de Contatos por Empresa. A tela de detalhe de uma Empresa exibe a lista de Contatos que a referenciam, com a ação "+ Adicionar contato", que cria um novo Contato já com essa referência pré-preenchida.<br><br><strong>Regra de borda</strong>: excluir ou editar um Contato vinculado não afeta o registro da Empresa; a relação é assimétrica, a Empresa não depende da existência de nenhum Contato específico para continuar existindo.` },
      { titulo: "Vínculo Empresa → Negociação", texto: `Diferente de Contato, o vínculo entre Empresa e Negociação é opcional em ambos os sentidos: uma Negociação pode ser criada e existir permanentemente sem nenhuma Empresa vinculada, apenas com o Contato obrigatório (Etapa 8, regra já consolidada no projeto). Quando vinculada, a Negociação armazena o ID da Empresa como referência, nunca uma cópia dos dados, seguindo o mesmo padrão de propagação por referência já definido para Contato: qualquer edição posterior na Empresa é refletida automaticamente em toda Negociação que a referencia.` },
      { titulo: "Editar Empresa", texto: `Todo campo de Empresa é editável livremente a qualquer momento, sem campo travado.<br><br><strong>Regra de validação</strong>: a edição do campo Nome da empresa está sujeita à mesma verificação de unicidade da criação; o backend deve excluir o próprio registro sendo editado da comparação, para não bloquear uma edição que não muda o nome.` },
      { titulo: "Excluir Empresa", texto: `Segue o mesmo mecanismo transversal de Lixeira já usado no projeto: modal com 2 caminhos, "Enviar para a lixeira" e "Excluir permanentemente", nas mesmas condições já descritas para Contato.<br><br><strong>Regra de borda, Empresa vinculada a Contato e/ou Negociação</strong>: a exclusão é permitida mesmo havendo vínculos ativos, tanto com Contatos quanto com Negociações; o backend deve remover a referência de cada Contato e de cada Negociação afetada como parte da mesma operação.<br><br><strong>Regra de borda, diferença em relação a Contato</strong>: como o vínculo de Negociação com Empresa é opcional, a Negociação afetada simplesmente passa a não ter Empresa vinculada, sem ficar em estado inválido, diferente do que acontece na exclusão de um Contato (Etapa 8, pendência formal já registrada). Como o vínculo de Contato com Empresa também é opcional, o mesmo vale para os Contatos afetados: passam a existir sem Empresa vinculada, sem ficar em estado inválido.` },
    ],

    entidades: `<strong>Empresa → Contato</strong>: relação 1 para N, 0 ou mais Contatos por Empresa. Já detalhada em Contatos (Etapa 6, sub-seção Contatos), entidade Contato → Empresa.</p><p><strong>Empresa → Negociação</strong>: relação 1 para N, 0 ou mais Negociações por Empresa, exatamente 0 ou 1 Empresa por Negociação. O vínculo é opcional dos dois lados; uma Negociação pode existir sem nenhuma Empresa vinculada.</p><p><strong>Empresa → Segmento</strong>: relação N para 1, 0 ou 1 Segmento por Empresa, 0 ou mais Empresas por Segmento. Cada Empresa referencia no máximo 1 Segmento por vez, seleção única. Detalhada na sub-seção Segmentos desta mesma etapa.</p><p><strong>Campos da entidade Empresa</strong>: id (identificador único, gerado pelo sistema), nome (texto, obrigatório, único em toda a conta, mínimo 2 caracteres), segmento_id (referência opcional a 1 registro de Segmento), url (texto, opcional, mínimo 2 caracteres se preenchido), resumo (texto, opcional, mínimo 2 caracteres se preenchido), endereco (texto, opcional, mínimo 2 caracteres se preenchido), criado_em (data e hora, gerado pelo sistema), atualizado_em (data e hora, gerado pelo sistema).`,
    telas: `<strong>Imagem 2</strong>: Tela de listagem de Empresas: tabela com Nome, Responsável, Segmento e contagem de Negociações vinculadas; botão "Criar empresa".</p><p><strong>Imagem 2, sub-seção "Criar Empresa a partir de uma Negociação"</strong>: botão "+ Criar" na tela de Negociações, com a opção "Criar Empresa" destacada no menu suspenso.</p><p><strong>Imagem 7</strong>: Sub-formulário "INFORMAÇÕES DA EMPRESA" expandido dentro do painel de Criar Negociação: Nome da empresa, Segmento, URL, Resumo, Endereço.</p><p><strong>Imagem 8</strong>: Detalhe do campo Segmento aberto na imagem de referência, mostrando seleção múltipla por checkbox; a Vigos diverge dessa referência e usa seleção única (ver sub-etapa "Vínculo Empresa → Segmento").</p><p><strong>Imagem 11</strong>: Painel lateral "Criar Negociação" completo, mostrando o bloco de Empresa preenchido junto com o bloco de Contato.</p><p>Referência de central de ajuda, sub-seção "Criar contato em uma Empresa existente": tela de detalhe da Empresa com a lista de Contatos vinculados e a ação "+ Adicionar contato".`,
    fluxo: `2 fluxogramas cobrem esta sub-seção: o primeiro é o macro, mostrando os 3 pontos de entrada de criação de Empresa e a validação de unicidade de nome, comum aos 3; o segundo é o fluxo de exclusão, incluindo a remoção automática de referência em Contatos e Negociações vinculados, sem bloqueio (diferente de Fonte e Campanha). Os diagramas completos estão logo abaixo.`,
    execucao: `<strong>Validações de campo obrigatório</strong>: Nome da empresa é o único campo obrigatório para salvar; a validação de obrigatoriedade e a validação de unicidade rodam juntas no backend, antes de qualquer persistência, em todos os 3 pontos de entrada.</p><p><strong>Regra de operação tudo ou nada</strong>: mesma lógica de Contato: criação isolada de Empresa é atômica; criação inline dentro de Negociação não é atômica entre as duas entidades, a Empresa é persistida primeiro, e a Negociação a referencia em seguida.</p><p><strong>Síncrono vs. assíncrono</strong>: toda criação, edição e exclusão de Empresa é síncrona.</p><p><strong>Confirmação visual</strong>: mesmo padrão de toast já usado no restante do projeto, por exemplo "Empresa criada", "Alterações salvas", "Empresa enviada para a lixeira", "Empresa excluída permanentemente".</p><p><strong>Dependência de outras regras já definidas</strong>: a regra de unicidade de nome já foi definida na Etapa 5 para Motivo de Perda e é reaproveitada aqui sem alteração. O mecanismo de exclusão reaproveita o mesmo fluxo de Lixeira das Etapas 2, 3, 4 e 5.`,
    auditoria: `Mesmo padrão de log (Quem, Quando, O quê, Valor anterior e novo) já definido na Etapa 1.</p><p>Casos específicos a registrar: criação de Empresa, com o ponto de entrada usado e o payload completo; edição de qualquer campo, valor anterior e novo lado a lado; tentativa de criação ou edição bloqueada por nome duplicado, registrando o nome rejeitado e o motivo; exclusão, registrando se foi via lixeira ou permanente, e a lista de Contatos e de Negociações que tiveram a referência a esta Empresa removida como consequência.`,
    criteriosAceite: [
      "Usuário consegue criar Empresa pelos 3 pontos de entrada",
      "Sistema bloqueia salvar sem Nome preenchido",
      "Sistema bloqueia Nome de Empresa duplicado, comparação exata, sensível a maiúsculas/minúsculas e espaços",
      "Usuário consegue vincular 1 Segmento a uma Empresa, com seleção única",
      "Usuário consegue ver Contatos vinculados na tela de detalhe da Empresa e adicionar novo Contato por lá",
      "Usuário consegue excluir Empresa mesmo vinculada a Contatos e/ou Negociações, com referências removidas automaticamente sem gerar estado inválido",

    descricao: `Segmento é o cadastro de apoio que classifica o nicho de mercado de uma Empresa, como "Advocacia", "Bancos" ou "Terceiro Setor". Não é um valor livre digitado dentro do formulário de Empresa; é uma entidade própria, com tela de gestão dedicada em Configurações, seguindo o mesmo padrão já definido para Fonte e Campanha na Etapa 4.</p><p>Segmento se relaciona com Empresa (Etapa 6, sub-seção Empresas) de forma N para 1: uma Empresa pode ser classificada em, no máximo, 1 Segmento por vez, e um mesmo Segmento pode classificar 0 ou mais Empresas. O formulário de Empresa consome a lista de Segmentos já cadastrados através de uma seleção única (lista suspensa ou botões de opção); a criação de um novo Segmento acontece exclusivamente na tela própria, nunca dentro do formulário de Empresa.`,

      { titulo: "Criação de Segmento e controle de permissão", texto: `A criação de um Segmento acontece exclusivamente na tela própria (Configurações → Segmentos), nunca dentro do formulário de Empresa. (Imagem 2)<br><br><strong>Regra de permissão</strong>: segue o mesmo padrão já definido para Fonte e Campanha na Etapa 4: o perfil Administrador sempre pode criar Segmento; um toggle "Permitir que usuários criem novos segmentos", controlado apenas pelo Administrador, libera essa mesma permissão para o perfil Usuário. O toggle nasce desligado por padrão. (Imagem 2)` },
      { titulo: "Vínculo Segmento → Empresa", texto: `Um Segmento pode ser referenciado por 0 ou mais Empresas simultaneamente, mas cada Empresa referencia no máximo 1 Segmento por vez. O formulário de Empresa exibe a lista de Segmentos cadastrados como uma lista de seleção única (lista suspensa ou botões de opção, nunca checkbox de múltipla escolha); o usuário seleciona 0 ou 1 Segmento. (Imagem 1)<br><br><strong>Regra de borda</strong>: se nenhum Segmento estiver selecionado, a Empresa é salva sem nenhum Segmento vinculado; o campo não é obrigatório.` },
      { titulo: "Editar Segmento", texto: `O nome de um Segmento é editável a qualquer momento pela tela própria.<br><br><strong>Regra de validação</strong>: a edição está sujeita à mesma verificação de unicidade da criação; o backend deve excluir o próprio registro sendo editado da comparação.<br><br><strong>Regra de propagação</strong>: como o vínculo de Empresa com Segmento é por referência de ID, a edição do nome de um Segmento é refletida automaticamente em toda Empresa que o referencia, sem necessidade de sincronização manual, mesmo padrão já usado em Contato e Empresa.` },
      { titulo: "Excluir Segmento", texto: `Segue o mesmo mecanismo transversal de Lixeira já usado no projeto: modal com 2 caminhos, "Enviar para a lixeira" e "Excluir permanentemente".<br><br><strong>Regra de borda, Segmento em uso</strong>: diferente do padrão adotado para Contato e Empresa (Etapa 6, sub-seções Contatos e Empresas), a exclusão de um Segmento referenciado por 1 ou mais Empresas é <strong>bloqueada</strong>; o sistema exibe mensagem informando a quantidade de Empresas vinculadas e impede a exclusão até que o vínculo seja removido manualmente em cada Empresa. Este é o mesmo padrão de bloqueio já usado para Fonte e Campanha na Etapa 4, não o padrão de remoção automática de referência usado em Contato e Empresa.` },

    telas: `<strong>Imagem 1</strong>: Drawer "Criar Empresa" com o campo Segmento aberto na imagem de referência, mostrando a lista de Segmentos cadastrados como checkboxes de múltipla seleção; a Vigos diverge dessa referência e usa seleção única (lista suspensa).</p><p><strong>Imagem 2</strong>: Tela própria "Segmentos", em Configurações: texto explicativo, toggle "Permitir que usuários criem novos segmentos", botão "Adicionar Segmento", busca, e listagem com colunas Nome do Segmento, Criado em, Última alteração em, Opções.`,
    fluxo: `1 fluxograma cobre esta sub-seção, mostrando a criação de Segmento pela tela própria, condicionada à checagem de perfil (Administrador ou Usuário com o toggle ligado), e a decisão de exclusão bloqueada quando o Segmento está em uso por 1 ou mais Empresas. O diagrama completo está logo abaixo.`,

  "7": {

      { titulo: "Estrutura de dados de um Produto e Serviço", texto: `Todo Produto é um registro independente com ID próprio, existindo fora e antes de qualquer Negociação. Atributos: nome (texto, obrigatório, único em toda a conta, mínimo 2 e máximo 255 caracteres), descrição (texto, opcional), valor (numérico em formato monetário, opcional, valor padrão R$ 0,00), exibir_na_negociacao (booleano, valor padrão verdadeiro).<br><br><strong>Regra de validação, campo obrigatório</strong>: nome não pode estar vazio para o registro ser persistido.<br><br><strong>Regra de validação, tamanho mínimo e máximo</strong>: nome precisa ter entre 2 e 255 caracteres; demais campos de texto preenchidos seguem o mínimo geral de 2 caracteres já usado no projeto.<br><br><strong>Regra de validação, unicidade</strong>: nome precisa ser único em toda a conta, comparação exata, mesmo padrão já usado em Empresa e Segmento.<br><br><strong>Regra de borda, criação sem permissão restrita</strong>: qualquer usuário com acesso ao CRM pode criar Produto, sem toggle de restrição por perfil, mesmo padrão de Contato e Empresa. (Imagem 1, Imagem 2)` },
      { titulo: "Pontos de entrada para criação", texto: `Existe 1 ponto de entrada principal: a tela de listagem própria, acessada via Configurações → Produtos e Serviços, através do botão "Cadastrar produto ou serviço". (Imagem 1, Imagem 2)<br><br><strong>Regra de borda</strong>: diferente de Contato e Empresa, não existe ponto de entrada inline dentro do formulário de Negociação para criar um Produto novo; o formulário de Negociação, Etapa 8, só permite selecionar Produtos já existentes no catálogo.` },
      { titulo: "Estados de visibilidade, Visível e Oculto", texto: `Todo Produto nasce com exibir_na_negociacao verdadeiro, estado Visível. O usuário pode alternar esse valor a qualquer momento clicando diretamente no interruptor "Exibir na Negociação" na linha correspondente da listagem. (Imagem 1)<br><br><strong>Regra de operação</strong>: quando exibir_na_negociacao é falso, estado Oculto, o Produto não aparece como opção selecionável no formulário de criação ou edição de Negociação, mas continua existindo normalmente em Negociações onde já havia sido adicionado antes de ser ocultado, e continua aparecendo em relatórios.<br><br><strong>Regra de borda</strong>: não existe um terceiro estado; a ausência de exclusão significa que todo Produto está sempre em um destes 2 estados, nunca removido da base.` },
      { titulo: "Produto nunca é excluído, apenas ocultado", texto: `Diferente de Contato, Empresa e Segmento, que seguem o mecanismo de Lixeira, Enviar para a lixeira ou Excluir permanentemente, Produto e Serviço não tem nenhuma ação de exclusão disponível na interface. O menu de 3 pontinhos na listagem não oferece opção de excluir. (Imagem 1)<br><br><strong>Regra de borda, justificativa técnica</strong>: a permanência do registro preserva a integridade de relatórios e do valor histórico de Negociações já fechadas que referenciam este Produto; excluir o registro quebraria esse histórico.<br><br><strong>Ponto de atenção</strong>: esta é uma divergência intencional em relação ao padrão de exclusão usado no restante do projeto, Contato, Empresa, Segmento, Fonte, Campanha, Motivo de Perda; documentar isso explicitamente para o time de TI, para não ser confundido com uma omissão.` },

      { titulo: "Vínculo com Negociação", texto: `Uma Negociação pode ter 0 ou mais Produtos vinculados. Cada vínculo é uma associação própria, com ID independente, contendo quantidade, preço, que pode divergir do valor de catálogo do Produto, e desconto.<br><br><strong>Regra de propagação, preço congelado</strong>: o preço de um item já lançado em uma Negociação não é afetado por uma edição posterior do valor de catálogo do Produto; cada item guarda seu próprio preço no momento em que foi adicionado à Negociação, sem sincronização retroativa.<br><br><strong>Regra de borda, remoção do item</strong>: remover um Produto de dentro de uma Negociação apaga apenas essa associação específica; o Produto continua existindo normalmente no catálogo, sem nenhuma restrição.<br><br><strong>Ponto de atenção</strong>: a estrutura completa deste vínculo, tela, fluxo de adicionar ou remover Produto de uma Negociação, cálculo do valor total, será detalhada por completo na Etapa 8, Negociações; esta sub-etapa apenas define os campos e regras que já podem ser fixados a partir do que se sabe sobre Produto.` },

function renderDiagramas(key) {
  const diagramas = DIAGRAMAS[key];
  if (!diagramas) return '';
  return diagramas.map(d => `
    <div class="diagram-card">
      <div class="diagram-title">${d.titulo}</div>
      <div class="diagram-svg-wrap">${d.svg}</div>
    </div>
  `).join('');
}


function renderSection(title, content) {
  if (!content) {
    return `<div class="section-block"><h4>${title}</h4><div class="placeholder-box">Aguardando conteúdo.</div></div>`;
  }
  return `<div class="section-block"><h4>${title}</h4><div class="filled-box"><p>${content}</p></div></div>`;
}

function renderSubetapas(subetapas) {
  if (!subetapas) {
    return `<div class="section-block"><h4>Sub-etapas</h4><div class="placeholder-box">Aguardando conteúdo. Serão adicionadas conforme detalharmos esta etapa.</div></div>`;
  }
  const items = subetapas.map((s, i) => `
    <div class="subetapa-item">
      <div class="subetapa-num">${i+1}</div>
      <div class="subetapa-body">
        <h5>${s.titulo}</h5>
        <p>${s.texto}</p>
      </div>
    </div>
  `).join('');
  return `<div class="section-block"><h4>Sub-etapas</h4><div class="subetapa-list">${items}</div></div>`;
}

function renderAcoes(acoes) {
  if (!acoes) {
    return `<div class="section-block"><h4>Ações esperadas</h4><div class="placeholder-box">Aguardando conteúdo.</div></div>`;
  }
  const items = acoes.map(a => `<li>${a}</li>`).join('');
  return `<div class="section-block"><h4>Ações esperadas</h4><div class="filled-box"><ul class="acoes-list">${items}</ul></div></div>`;
}

function renderCriteriosAceite(criterios) {
  if (!criterios) return '';
  const items = criterios.map(c => `
    <div class="criterio-item">
      <span class="criterio-check">☐</span>
      <span>${c}</span>
    </div>
  `).join('');
  return `<div class="section-block"><h4>Critérios de aceite</h4><div class="filled-box"><div class="criterio-list">${items}</div></div></div>`;
}

function renderForaDoMVP(itens) {
  if (!itens) return '';
  const items = itens.map(i => `<li>${i}</li>`).join('');
  return `<div class="section-block"><h4>Itens fora do MVP</h4><div class="filled-box fora-mvp"><ul class="acoes-list">${items}</ul></div></div>`;
}

function allEtapas() {
  return DATA.flatMap(c => c.etapas.map(e => ({...e, camada: c})));
}

// Retorna a lista de "unidades navegáveis": cada etapa sem sub-seções é 1 unidade;
// cada etapa com sub-seções vira N unidades (uma por sub-seção), todas contando status da etapa-mãe.
function allUnidades() {
  const out = [];
  allEtapas().forEach(e => {
    if (e.subsecoes && e.subsecoes.length) {
      e.subsecoes.forEach(s => out.push({ etapa: e, sub: s, key: `${e.num}.${s.id}` }));
    } else {
      out.push({ etapa: e, sub: null, key: `${e.num}` });
    }
  });
  return out;
}

function buildSidebar() {
  const nav = document.getElementById('nav-groups');
  nav.innerHTML = '';
  DATA.forEach(c => {
    const group = document.createElement('div');
    group.className = 'nav-group';
    group.dataset.camada = c.camada;

    const header = document.createElement('div');
    header.className = 'nav-group-header';
    header.innerHTML = `
      <span class="chevron">▾</span>
      <span class="group-num">${c.camada}</span>
      <span class="group-title">${c.nome}</span>
      <span class="group-count">${c.etapas.length}</span>
    `;
    header.addEventListener('click', () => group.classList.toggle('collapsed'));

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'nav-items';

    c.etapas.forEach(e => {
      if (e.subsecoes && e.subsecoes.length) {
        const parent = document.createElement('div');
        parent.className = 'nav-item nav-item-parent';
        parent.dataset.etapaKey = `${e.num}`;
        parent.innerHTML = `
          <span class="item-num">${e.num}</span>
          <span class="item-title">${e.titulo}</span>
          <span class="status-dot ${e.status}"></span>
        `;
        itemsWrap.appendChild(parent);

        e.subsecoes.forEach(s => {
          const key = `${e.num}.${s.id}`;
          const sub = document.createElement('div');
          sub.className = 'nav-item nav-subitem';
          sub.dataset.etapaKey = key;
          sub.innerHTML = `<span class="item-title">${e.num}.${s.titulo}</span>`;
          sub.addEventListener('click', () => showEtapa(e.num, s.id));
          itemsWrap.appendChild(sub);
        });
      } else {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.dataset.etapaKey = `${e.num}`;
        item.innerHTML = `
          <span class="item-num">${e.num}</span>
          <span class="item-title">${e.titulo}</span>
          <span class="status-dot ${e.status}"></span>
        `;
        item.addEventListener('click', () => showEtapa(e.num));
        itemsWrap.appendChild(item);
      }
    });

    group.appendChild(header);
    group.appendChild(itemsWrap);
    nav.appendChild(group);
  });
}

function updateProgress() {
  const all = allEtapas();
  const aprovado = all.filter(e => e.status === 'aprovado').length;
  document.getElementById('progress-text').textContent = `${aprovado} / ${all.length}`;
  document.getElementById('progress-fill').style.width = `${(aprovado/all.length)*100}%`;
}

  const sub = subId && e.subsecoes ? e.subsecoes.find(s => s.id === subId) : null;
  const key = sub ? `${e.num}.${sub.id}` : `${e.num}`;
  setActiveNav(key);

  const tabsHtml = e.subsecoes ? `
    <div class="subsecao-tabs">
      ${e.subsecoes.map(s => `
        <div class="subsecao-tab ${s.id === subId ? 'active' : ''}" onclick="showEtapa(${e.num}, '${s.id}')">${s.titulo}</div>

  const notaOrdemHtml = (e.num === 1) ? `

function openUserCtx(evt, userId) {
  const u = STATE.usuarios.find(x => x.id === userId);

  const menu = document.getElementById('ctx-menu');
  const isInactive = u.status === 'Inativo';
  menu.innerHTML = \`
    <div class="ctx-item" onclick="closeCtx(); openEditarUsuario(\${userId})">✏️ Editar usuário</div>

    }
  \`;
  const rect = evt.target.getBoundingClientRect();

function openConcederAcesso() {
  const disponiveis = STATE.vigosUsuarios.map(v => \`

      <div><span style="font-size:12.5px;">\${v.nome}</span><br><span style="font-size:10.5px;color:#94A3B8;">\${v.email}</span></div>
      \${v.jaTemAcesso ? '<span class="disabled-tag">já tem acesso</span>' : ''}
    </div>
  \`).join('');

  openModal(\`
    <div style="display:flex; justify-content:space-between; margin-bottom:14px;"><h3>Conceder acesso</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <div class="info-box">\${STATE.licencasTotal - STATE.usuarios.filter(u=>u.status==='Ativo').length} de \${STATE.licencasTotal} licenças disponíveis (Vigos Cloud)</div>

    <input class="field-input" placeholder="Digite o nome" style="margin-bottom:6px;">

    <p class="field-note">A busca traz todos os usuários da conta Vigos Cloud. Quem já tem acesso ao CRM aparece desabilitado.</p>
    <p class="field-note">Um e-mail de acesso ao CRM liberado será enviado automaticamente.</p>
    <div id="perfil-select-area" style="opacity:0.4; pointer-events:none;">
      <label class="field-label">Perfil inicial no CRM</label>
      <select class="field-input" id="novo-perfil-select">
        \${STATE.perfis.map(p => \`<option>\${p.nome}</option>\`).join('')}
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarConcessao()">Conceder acesso</button>
    </div>
  \`);
}

let selectedVigosUser = null;
function selecionarVigosUser(nome, email) {
  selectedVigosUser = { nome, email };
  document.querySelectorAll('.list-item-row').forEach(el => el.style.background = '');
  event.currentTarget.style.background = '#E6F1FB';
  document.getElementById('perfil-select-area').style.opacity = '1';
  document.getElementById('perfil-select-area').style.pointerEvents = 'auto';
}

function confirmarConcessao() {
  if (!selectedVigosUser) { showToast('Selecione um usuário da Vigos Cloud primeiro'); return; }
  const perfil = document.getElementById('novo-perfil-select').value;
  const newId = Math.max(...STATE.usuarios.map(u=>u.id)) + 1;
  STATE.usuarios.push({ id: newId, nome: selectedVigosUser.nome, email: selectedVigosUser.email, perfil, visibilidade: 'Equipe', status: 'Ativo', equipes: [] });
  selectedVigosUser = null;
  closeModal();
  showToast('Acesso concedido');
  render();
}

function salvarEdicaoUsuario(userId) {
  const u = STATE.usuarios.find(x => x.id === userId);
  u.perfil = document.getElementById('edit-perfil-select').value;
  closeDrawer();
  showToast('Alterações salvas');
  render();
}

function handleDesativarClick(userId) {
  const u = STATE.usuarios.find(x => x.id === userId);
  const admins = STATE.usuarios.filter(x => x.perfil === 'Administrador' && x.status === 'Ativo');
  if (u.perfil === 'Administrador' && admins.length <= 1) {
    openModal(\`
      <div style="display:flex; justify-content:space-between; margin-bottom:14px;"><h3>Não é possível desativar</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
      <div class="danger-box">Este usuário é o único Administrador ativo da conta. Atribua o perfil de Administrador a outro usuário antes de continuar.</div>
      <div class="modal-footer"><button class="btn primary" onclick="closeModal()">Entendi</button></div>
    \`);
    return;
  }
  // simula ter registros em aberto para Antonio Fernandes (id 4), sem para os demais
  const temRegistros = userId === 4;
  if (!temRegistros) {
    u.status = 'Inativo';
    showToast('Usuário desativado');
    render();
    return;
  }
  openReatribuicao(userId);
}

function openReatribuicao(userId) {
  const u = STATE.usuarios.find(x => x.id === userId);
  const equipeDoUsuario = STATE.equipes.find(e => u.equipes.includes(e.nome));
  const temGestor = equipeDoUsuario && equipeDoUsuario.gestor;
  const outrosUsuarios = STATE.usuarios.filter(x => x.id !== userId && x.status === 'Ativo');

  openModal(\`
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><h3>Antes de desativar \${u.nome}</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <p style="font-size:12px;color:#64748B;margin:0 0 14px;">Ele tem 3 itens em aberto. Escolha o que fazer com eles.</p>
    <div style="background:#F7F9FB;border-radius:8px;padding:12px;margin-bottom:10px;">
      <p style="font-size:11px;font-weight:600;margin:0 0 8px;">Escolha rápida (aplica a tudo)</p>
      <select class="field-input" style="margin:0;" id="reatrib-destino">
        \${temGestor ? \`<option value="gestor">Gestor da equipe (\${equipeDoUsuario.gestor})</option>\` : ''}
        \${outrosUsuarios.map(o => \`<option value="user-\${o.id}">\${o.nome}</option>\`).join('')}
        <option value="nenhum">Deixar tudo sem responsável por enquanto</option>
      </select>
      \${!temGestor ? '<p class="field-note" style="margin-top:6px;">Esta equipe não tem gestor definido, por isso essa opção não aparece.</p>' : ''}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn danger-fill" onclick="confirmarDesativacao(\${userId})">Desativar usuário</button>
    </div>
  \`);
}

function confirmarDesativacao(userId) {
  const destino = document.getElementById('reatrib-destino').value;
  const u = STATE.usuarios.find(x => x.id === userId);
  u.status = 'Inativo';
  closeModal();
  if (destino === 'nenhum') {
    showToast('Usuário desativado; 3 registros sem responsável');
  } else {
    showToast('Usuário desativado e registros reatribuídos');
  }
  render();
}

function openReativar(userId) {
  const u = STATE.usuarios.find(x => x.id === userId);
  const licDisponiveis = STATE.licencasTotal - STATE.usuarios.filter(x => x.status === 'Ativo').length;

  if (licDisponiveis <= 0) {
    openModal(\`
      <div style="display:flex; justify-content:space-between; margin-bottom:14px;"><h3>Reativar acesso</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px;">
        <div class="avatar" style="background:#F1EFE8;color:#5F5E5A;">\${initials(u.nome)}</div>
        <div><strong style="font-size:13px;">\${u.nome}</strong><br><span style="font-size:11px;color:#94A3B8;">Inativo</span></div>
      </div>
      <div class="danger-box">⚠ 0 licenças disponíveis (Vigos Cloud). Libere uma licença desativando outro usuário, ou contrate mais licenças na Vigos Cloud.</div>
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Fechar</button></div>
    \`);
    return;
  }

  openModal(\`
    <div style="display:flex; justify-content:space-between; margin-bottom:14px;"><h3>Reativar acesso</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px;">
      <div class="avatar" style="background:#F1EFE8;color:#5F5E5A;">\${initials(u.nome)}</div>
      <div><strong style="font-size:13px;">\${u.nome}</strong><br><span style="font-size:11px;color:#94A3B8;">Inativo</span></div>
    </div>
    <div class="info-box">✓ \${licDisponiveis} licença(s) disponível(is) (Vigos Cloud); pode reativar</div>
    <div class="visibility-legend">Ao reativar, o Perfil (\${u.perfil}) e a Visibilidade (\${u.visibilidade}) voltam automaticamente.</div>
    <p class="field-note">Registros reatribuídos não voltam sozinhos. Você poderá revisar e devolver depois, na tela do usuário.</p>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarReativacao(\${userId})">Reativar acesso</button>
    </div>
  \`);
}

function confirmarReativacao(userId) {
  const u = STATE.usuarios.find(x => x.id === userId);
  u.status = 'Ativo';
  closeModal();
  showToast('Acesso reativado');
  render();
}

function openEquipeCtx(evt, equipeId) {
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = \`
    <div class="ctx-item" onclick="closeCtx(); openEditarEquipe(\${equipeId})">✏️ Editar equipe</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" onclick="closeCtx(); excluirEquipe(\${equipeId})">🗑️ Excluir equipe</div>
  \`;
  const rect = evt.target.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  menu.style.left = (rect.left + window.scrollX - 170) + 'px';
  menu.classList.add('open');

function excluirEquipe(equipeId) {
  const e = STATE.equipes.find(x => x.id === equipeId);
  STATE.usuarios.forEach(u => { u.equipes = u.equipes.filter(n => n !== e.nome); });
  STATE.equipes = STATE.equipes.filter(x => x.id !== equipeId);
  showToast('Equipe excluída; usuários e funis vinculados não foram afetados');
  render();
}

function openCriarEquipe() {
  openModal(\`
    <div style="display:flex; justify-content:space-between; margin-bottom:14px;"><h3>Criar equipe</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>

}

function confirmarCriarEquipe() {
  const nome = document.getElementById('nova-equipe-nome').value || 'Nova equipe';
  const newId = Math.max(...STATE.equipes.map(e=>e.id)) + 1;
  STATE.equipes.push({ id: newId, nome, usuarios: [], gestor: null });
  closeModal();
  showToast('Equipe criada');
  render();
}

function openEditarEquipe(equipeId) {
  const e = STATE.equipes.find(x => x.id === equipeId);
  const membros = e.usuarios.map(uid => {
    const u = STATE.usuarios.find(x => x.id === uid);
    return \`
      <div class="list-item-row">
        <span style="font-size:12.5px;">\${u.nome}</span>
        <span style="display:flex;align-items:center;gap:6px;">

            <option \${u.visibilidade==='Equipe'?'selected':''}>Equipe</option>
            <option \${u.visibilidade==='Geral'?'selected':''}>Geral</option>
          </select>
          <span style="color:#94A3B8;cursor:pointer;" onclick="removerDaEquipe(\${equipeId}, \${uid})">✕</span>
        </span>

    <div class="subsection-title">Usuários nesta equipe</div>
    \${membros}
    <div class="drawer-footer">
      <button class="btn" onclick="closeDrawer()">Cancelar</button>
      <button class="btn primary" onclick="closeDrawer(); showToast('Alterações salvas')">Salvar</button>
    </div>
  \`);
}

function removerDaEquipe(equipeId, userId) {
  const e = STATE.equipes.find(x => x.id === equipeId);

function openPerfilCtx(evt, nome) {

  menu.innerHTML = \`
    <div class="ctx-item" onclick="closeCtx(); openDetalhePerfil('\${nome}')">✏️ Editar perfil</div>
    <div class="ctx-sep"></div>

  \`;

  menu.classList.add('open');

function excluirPerfil(nome) {
  const afetados = STATE.usuarios.filter(u => u.perfil === nome);
  afetados.forEach(u => u.perfil = 'Usuário');
  STATE.perfis = STATE.perfis.filter(p => p.nome !== nome);
  if (afetados.length) {
    showToast(\`Perfil excluído; \${afetados.length} usuário(s) movido(s) para "Usuário"\`);
  } else {
    showToast('Perfil excluído');
  }
  render();
}

function openCriarPerfil() {
  openModal(\`
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><h3>Criar novo perfil</h3><span style="cursor:pointer;color:#94A3B8;" onclick="closeModal()">✕</span></div>
    <p style="font-size:11.5px;color:#64748B;margin:0 0 14px;">Primeiro, escolha o nome do novo perfil.</p>
    <label class="field-label">Nome do perfil</label>
    <input class="field-input" id="novo-perfil-nome" placeholder="Digite aqui o nome do perfil">
    <p class="field-note" id="nome-perfil-erro" style="color:#E45858; display:none;">Já existe um perfil com esse nome.</p>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarCriarPerfil()">Criar perfil</button>
    </div>
  \`);
}

function confirmarCriarPerfil() {
  const nome = document.getElementById('novo-perfil-nome').value.trim();

  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function toggleSwitch(el) { el.classList.toggle('on'); }

function tipoLabel(tipo) {
  var map = { texto: 'Texto', data: 'Data', selecao_unica: 'Seleção única', selecao_multipla: 'Seleção múltipla', numero: 'Número simples', hiperlink: 'Hiperlink', formatacao: 'Com formatação' };
  return map[tipo] || tipo;
}

function renderTudo() {
  document.getElementById('attention-produto').style.display = (STATE.abaAtiva === 'produto') ? 'block' : 'none';
  renderPersonalizados();
  renderSugestoes();
  renderPadrao();
}

function renderPersonalizados() {
  var e = ent();
  var wrap = document.getElementById('sec-personalizados');
  var lista = document.getElementById('lista-personalizados');
  if (e.personalizados.length === 0) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  var parts = [];
  parts.push('<div class="row-header"><div class="col-drag"></div><div class="col-name">NOME</div><div class="col-type">TIPO</div><div class="col-created">CRIADO EM</div><div class="col-action"></div></div>');
  e.personalizados.forEach(function(c) {
    parts.push('<div class="row">' +
      '<div class="col-drag">::</div>' +
      '<div class="col-name">' + c.nome + '</div>' +
      '<div class="col-type">' + c.tipo + '</div>' +
      '<div class="col-created">' + (c.criadoEm || '') + '</div>' +
      '<div class="col-action"><span class="menu-actions"><span class="icon-btn" onclick="toggleMenu(' + c.id + ')">⋮</span>' +
      '<div class="menu-dropdown" id="menu-' + c.id + '">' +
      '<div class="menu-item" onclick="abrirEditarPersonalizado(' + c.id + ')">Editar</div>' +
      '<div class="menu-item" onclick="enviarParaLixeira(' + c.id + ')">Enviar para a lixeira</div>' +
      (STATE.perfil === 'admin' ? '<div class="menu-item danger" onclick="abrirModalPermanente(' + c.id + ')">Excluir permanentemente</div>' : '') +
      '</div></span></div>' +
      '</div>');
  });
  lista.innerHTML = parts.join('');
}

function renderSugestoes() {
  var e = ent();
  var wrap = document.getElementById('lista-sugestoes');
  if (e.sugestoes.length === 0) {
    wrap.innerHTML = '<div class="empty-state">Nenhuma sugestão disponível nesta aba.</div>';
    return;
  }
  var parts = [];
  parts.push('<div class="row-header"><div class="col-name" style="flex:1">NOME DO CAMPO</div><div class="col-type" style="flex:1">FORMATO</div><div style="width:110px"></div></div>');
  e.sugestoes.forEach(function(s, idx) {
    parts.push('<div class="row"><div style="flex:1">' + s.nome + '</div><div style="flex:1;color:#94A3B8">Campo do tipo ' + s.tipo.toLowerCase() + '</div><div style="width:110px"><span class="sugest-add" onclick="promoverSugestao(' + idx + ')">+ Adicionar campo</span></div></div>');
  });
  wrap.innerHTML = parts.join('');
}

function promoverSugestao(idx) {
  var e = ent();
  var s = e.sugestoes[idx];
  var novo = { id: STATE.proximoId++, nome: s.nome, tipoRaw: 'texto', tipo: 'Texto', obrigatorio: false, unico: false, visivel: false, criadoEm: 'hoje' };
  e.personalizados.push(novo);
  e.sugestoes.splice(idx, 1);
  renderTudo();
  showToast(s.nome + ' adicionado, agora é um campo personalizado');
}

function renderPadrao() {
  var e = ent();
  var wrap = document.getElementById('lista-padrao');
  var parts = [];
  e.padrao.forEach(function(c) {
    var obrigTexto = c.obrigatorio ? 'Obrigatório' : 'Não obrigatório';
    if (c.tipoEdicao === 'porEtapa') {
      obrigTexto = c.obrigatorioPorEtapa ? 'Obrigatório (' + c.etapas.length + ' etapa(s))' : 'Não obrigatório';
    }
    var actionHtml = c.editavel
      ? '<span class="icon-btn editable" onclick="abrirEditarPadrao(' + c.id + ')" title="Editar">✎</span>'
      : '<span class="badge-fixed" title="Campo padrão fixo, sem edição">—</span>';
    parts.push('<div class="row" draggable="true">' +
      '<div class="col-drag">::</div>' +
      '<div class="col-name">' + c.nome + '</div>' +
      '<div class="col-type">Campo padrão<br><span style="font-size:10px">' + c.tipo + '</span></div>' +
      '<div class="col-req">' + obrigTexto + '</div>' +
      '<div class="col-action">' + actionHtml + '</div>' +
      '</div>');
  });
  wrap.innerHTML = parts.join('');
}

function toggleMenu(id) {
  var all = document.querySelectorAll('.menu-dropdown');
  all.forEach(function(m) { if (m.id !== 'menu-' + id) m.classList.remove('open'); });
  var el = document.getElementById('menu-' + id);
  el.classList.toggle('open');
}
document.addEventListener('click', function(ev) {
  if (!ev.target.closest('.menu-actions')) {
    document.querySelectorAll('.menu-dropdown').forEach(function(m) { m.classList.remove('open'); });
  }
});

/* ---------- Abas ---------- */
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    STATE.abaAtiva = tab.dataset.tab;
    renderTudo();
  });
});

/* ---------- Criar campo ---------- */
document.getElementById('btn-criar-campo').addEventListener('click', abrirCriar);
function abrirCriar() {
  document.getElementById('criar-entidade').value = STATE.abaAtiva;
  document.getElementById('criar-nome').value = '';
  document.getElementById('criar-tipo').value = '';
  document.getElementById('bloco-opcoes').style.display = 'none';
  document.getElementById('lista-opcoes').innerHTML = '';
  STATE.opcoesTemp = [];
  ['toggle-obrigatorio', 'toggle-unico', 'toggle-visivel', 'toggle-permitir-novas'].forEach(function(id) {
    document.getElementById(id).classList.remove('on');
  });
  document.getElementById('criar-nome').classList.remove('error');
  document.getElementById('criar-tipo').classList.remove('error');
  document.getElementById('erro-opcoes').style.display = 'none';
  document.getElementById('overlay-criar').classList.add('open');
}
function fecharCriar() { document.getElementById('overlay-criar').classList.remove('open'); }

document.getElementById('criar-tipo').addEventListener('change', function() {
  var v = this.value;
  var isSelecao = (v === 'selecao_unica' || v === 'selecao_multipla');
  document.getElementById('bloco-opcoes').style.display = isSelecao ? 'block' : 'none';
});

document.getElementById('btn-add-opcao').addEventListener('click', function() {
  STATE.opcoesTemp.push('');
  renderOpcoesTemp();
});
function renderOpcoesTemp() {
  var wrap = document.getElementById('lista-opcoes');
  var parts = [];
  STATE.opcoesTemp.forEach(function(v, i) {
    parts.push('<div class="opt-row"><input value="' + v.replace(/"/g, '&quot;') + '" oninput="STATE.opcoesTemp[' + i + ']=this.value" placeholder="Nome da opção"><span class="opt-remove" onclick="removerOpcaoTemp(' + i + ')">✕</span></div>');
  });
  wrap.innerHTML = parts.join('');
}
function removerOpcaoTemp(i) {
  STATE.opcoesTemp.splice(i, 1);
  renderOpcoesTemp();
}

document.getElementById('btn-salvar-criar').addEventListener('click', function() {
  var entidade = document.getElementById('criar-entidade').value;
  var nome = document.getElementById('criar-nome').value.trim();
  var tipo = document.getElementById('criar-tipo').value;
  var ok = true;
  document.getElementById('criar-nome').classList.remove('error');
  document.getElementById('criar-tipo').classList.remove('error');
  document.getElementById('erro-opcoes').style.display = 'none';

  if (!nome || !tipo) {
    if (!nome) document.getElementById('criar-nome').classList.add('error');
    if (!tipo) document.getElementById('criar-tipo').classList.add('error');
    showToast('Preencha nome e tipo para continuar');
    ok = false;
  }
  var isSelecao = (tipo === 'selecao_unica' || tipo === 'selecao_multipla');
  var opcoesValidas = STATE.opcoesTemp.filter(function(v) { return v.trim().length > 0; });
  if (ok && isSelecao && opcoesValidas.length === 0) {
    document.getElementById('erro-opcoes').style.display = 'block';
    showToast('Cadastre ao menos 1 opção para este tipo de campo');
    ok = false;
  }
  if (!ok) return;

  var novo = {
    id: STATE.proximoId++,
    nome: nome,
    tipoRaw: tipo,
    tipo: tipoLabel(tipo),
    obrigatorio: document.getElementById('toggle-obrigatorio').classList.contains('on'),
    unico: document.getElementById('toggle-unico').classList.contains('on'),
    visivel: document.getElementById('toggle-visivel').classList.contains('on'),
    criadoEm: 'hoje',
  };
  if (isSelecao) {
    novo.opcoes = opcoesValidas;
    novo.permitirNovas = document.getElementById('toggle-permitir-novas').classList.contains('on');
  }
  STATE.entidades[entidade].personalizados.push(novo);
  if (entidade === STATE.abaAtiva) {
    renderTudo();
  }
  showToast('Campo criado com sucesso em ' + STATE.entidades[entidade].label);
  fecharCriar();
});

/* ---------- Editar campo padrão ---------- */
function abrirEditarPadrao(id) {
  var c = ent().padrao.find(function(x) { return x.id === id; });
  STATE.editandoTipo = 'padrao';
  STATE.editandoId = id;
  var titulo = document.getElementById('editar-titulo');
  var corpo = document.getElementById('editar-corpo');

  if (c.tipoEdicao === 'simples') {
    titulo.textContent = 'Editar ' + c.nome;
    corpo.innerHTML =
      '<div class="field-label">Nome do campo <span class="req">*</span></div>' +
      '<input class="field-input" id="ed-nome" value="' + c.nome + '">' +
      '<div class="toggle-row" style="border-top:none;"><div class="toggle-row-body"><strong>Obrigatório</strong><span>Ative para deixar este campo com preenchimento obrigatório</span></div><div class="toggle-switch ' + (c.obrigatorio ? 'on' : '') + '" id="ed-obrigatorio" onclick="toggleSwitch(this)"><div class="toggle-knob"></div></div></div>';
  } else if (c.tipoEdicao === 'porEtapa') {
    titulo.textContent = 'Editar ' + c.nome;
    var tagsHtml = STATE.etapasFunil.map(function(et) {
      var on = c.etapas.indexOf(et) > -1;
      return '<span class="stage-tag ' + (on ? 'on' : '') + '" data-etapa="' + et + '" onclick="toggleEtapaTag(this)">' + et + (on ? ' ✓' : '') + '</span>';
    }).join('');
    corpo.innerHTML =
      '<div class="field-label">Nome do campo <span class="req">*</span></div>' +
      '<input class="field-input" id="ed-nome" value="' + c.nome + '">' +
      '<div class="toggle-row" style="border-top:none;"><div class="toggle-row-body"><strong>Obrigatório para uma etapa</strong><span>Ao ativar, torna-se obrigatório em etapas específicas do funil</span></div><div class="toggle-switch ' + (c.obrigatorioPorEtapa ? 'on' : '') + '" id="ed-obrigatorio-etapa" onclick="toggleSwitchEtapaBloco(this)"><div class="toggle-knob"></div></div></div>' +
      '<div id="ed-bloco-etapas" style="display:' + (c.obrigatorioPorEtapa ? 'block' : 'none') + ';border-top:0.5px solid #F0F3F6;padding-top:12px;">' +
      '<div style="font-size:12px;color:#16232F;margin-bottom:6px;">Etapas do funil que exigem este campo</div>' +
      '<div class="stage-tags" id="ed-etapas-tags">' + tagsHtml + '</div></div>';
  } else if (c.tipoEdicao === 'visivel') {
    titulo.textContent = 'Editar ' + c.nome;
    corpo.innerHTML =
      '<div class="field-label">' + c.nome + ' <span class="req">*</span></div>' +
      '<input class="field-input" id="ed-nome" value="' + c.nome + '">' +
      '<div class="toggle-row" style="border-top:none;"><div class="toggle-row-body"><strong>Campo visível</strong><span>Define se esse campo é exibido no CRM Vigos</span></div><div class="toggle-switch ' + (c.campoVisivel ? 'on' : '') + '" id="ed-campo-visivel" onclick="toggleSwitch(this)"><div class="toggle-knob"></div></div></div>' +
      '<label style="display:flex;align-items:center;gap:6px;margin:12px 0;cursor:pointer;"><input type="checkbox" id="ed-exibir-formulario" ' + (c.exibirFormulario ? 'checked' : '') + '><span style="font-size:12px;">Exibir no formulário</span></label>' +
      '<div class="field-label">Funis</div>' +
      '<div style="border:1px solid #E2E8F0;border-radius:6px;padding:6px 10px;"><span style="display:inline-flex;align-items:center;gap:6px;background:#F8FAFC;border-radius:12px;padding:3px 10px;font-size:12px;">Todos os funis</span></div>';
  }
  document.getElementById('overlay-editar').classList.add('open');
}
function toggleEtapaTag(el) {
  var etapa = el.getAttribute('data-etapa');
  var c = ent().padrao.find(function(x) { return x.id === STATE.editandoId; });
  var i = c.etapas.indexOf(etapa);
  if (i > -1) { c.etapas.splice(i, 1); el.classList.remove('on'); el.textContent = etapa; }
  else { c.etapas.push(etapa); el.classList.add('on'); el.textContent = etapa + ' ✓'; }
}
function toggleSwitchEtapaBloco(el) {
  toggleSwitch(el);
  var bloco = document.getElementById('ed-bloco-etapas');
  bloco.style.display = el.classList.contains('on') ? 'block' : 'none';
}

function abrirEditarPersonalizado(id) {
  toggleMenu(id);
  var c = ent().personalizados.find(function(x) { return x.id === id; });
  STATE.editandoTipo = 'personalizado';
  STATE.editandoId = id;
  document.getElementById('editar-titulo').textContent = 'Editar campo personalizado';
  var corpo = document.getElementById('editar-corpo');
  var isSelecao = (c.tipoRaw === 'selecao_unica' || c.tipoRaw === 'selecao_multipla');
  var opcoesHtml = '';
  if (isSelecao) {
    opcoesHtml = '<div style="border-top:0.5px solid #F0F3F6;padding-top:14px;margin-bottom:14px;"><div style="font-size:13px;font-weight:600;margin-bottom:10px;">Opções da lista</div>' +
      (c.opcoes || []).map(function(o) { return '<div class="opt-row"><input value="' + o.replace(/"/g, '&quot;') + '" readonly></div>'; }).join('') + '</div>';
  }
  corpo.innerHTML =
    '<div class="field-label">Nome do campo <span class="req">*</span></div>' +
    '<input class="field-input" id="ed-nome" value="' + c.nome + '">' +
    opcoesHtml +
    '<div class="toggle-row" style="border-top:none;"><div class="toggle-row-body"><strong>Obrigatório</strong></div><div class="toggle-switch ' + (c.obrigatorio ? 'on' : '') + '" id="ed-obrigatorio" onclick="toggleSwitch(this)"><div class="toggle-knob"></div></div></div>' +
    '<div class="toggle-row"><div class="toggle-row-body"><strong>Único</strong></div><div class="toggle-switch ' + (c.unico ? 'on' : '') + '" id="ed-unico" onclick="toggleSwitch(this)"><div class="toggle-knob"></div></div></div>' +
    '<div class="toggle-row"><div class="toggle-row-body"><strong>Visível no cadastro</strong></div><div class="toggle-switch ' + (c.visivel ? 'on' : '') + '" id="ed-visivel" onclick="toggleSwitch(this)"><div class="toggle-knob"></div></div></div>';
  document.getElementById('overlay-editar').classList.add('open');
}

function fecharEditar() { document.getElementById('overlay-editar').classList.remove('open'); }

function salvarEdicao() {
  var nomeEl = document.getElementById('ed-nome');
  if (nomeEl && !nomeEl.value.trim()) {
    nomeEl.classList.add('error');
    showToast('Nome do campo é obrigatório');
    return;
  }
  if (STATE.editandoTipo === 'padrao') {
    var c = ent().padrao.find(function(x) { return x.id === STATE.editandoId; });
    c.nome = nomeEl.value.trim();
    if (c.tipoEdicao === 'simples') {
      c.obrigatorio = document.getElementById('ed-obrigatorio').classList.contains('on');
    } else if (c.tipoEdicao === 'porEtapa') {
      c.obrigatorioPorEtapa = document.getElementById('ed-obrigatorio-etapa').classList.contains('on');
    } else if (c.tipoEdicao === 'visivel') {
      c.campoVisivel = document.getElementById('ed-campo-visivel').classList.contains('on');
      c.exibirFormulario = document.getElementById('ed-exibir-formulario').checked;
    }
  } else {
    var cp = ent().personalizados.find(function(x) { return x.id === STATE.editandoId; });
    cp.nome = nomeEl.value.trim();
    cp.obrigatorio = document.getElementById('ed-obrigatorio').classList.contains('on');
    cp.unico = document.getElementById('ed-unico').classList.contains('on');
    cp.visivel = document.getElementById('ed-visivel').classList.contains('on');
  }
  renderTudo();
  fecharEditar();
  showToast('Alterações salvas');
}

/* ---------- Exclusão ---------- */
function enviarParaLixeira(id) {
  toggleMenu(id);
  showToast('Solicitação enviada, aguardando aprovação do Administrador');
}
function abrirModalPermanente(id) {
  toggleMenu(id);
  STATE.excluindoId = id;
  var c = ent().personalizados.find(function(x) { return x.id === id; });
  document.getElementById('modal-texto').textContent = 'O campo "' + c.nome + '" será removido de forma definitiva. Esta ação não pode ser desfeita.';
  document.getElementById('chk-confirma-exclusao').checked = false;
  atualizarBotaoExcluir();
  document.getElementById('modal-permanente').classList.add('open');
}
function fecharModalPermanente() { document.getElementById('modal-permanente').classList.remove('open'); }
function atualizarBotaoExcluir() {
  var checked = document.getElementById('chk-confirma-exclusao').checked;
  var btn = document.getElementById('btn-confirmar-exclusao');
  btn.className = checked ? 'btn-danger' : 'btn-disabled';
}
function confirmarExclusaoPermanente() {
  if (!document.getElementById('chk-confirma-exclusao').checked) return;
  var e = ent();
  e.personalizados = e.personalizados.filter(function(c) { return c.id !== STATE.excluindoId; });
  renderTudo();
  fecharModalPermanente();
  showToast('Campo excluído permanentemente');
}

/* ---------- Perfil ---------- */
document.getElementById('btn-perfil-admin').addEventListener('click', function() { setPerfil('admin'); });
document.getElementById('btn-perfil-usuario').addEventListener('click', function() { setPerfil('usuario'); });
function setPerfil(p) {
  STATE.perfil = p;
  document.getElementById('btn-perfil-admin').classList.toggle('active', p === 'admin');
  document.getElementById('btn-perfil-usuario').classList.toggle('active', p === 'usuario');
  renderTudo();
}

renderTudo();
<\/script>
</body>
</html>
`;

<script>
  var state = {

      { id: 2, nome: 'Indicação', criadoEm: '10/03/2026 09:14', alteradoEm: '10/03/2026 09:14', vinculada: false },
      { id: 3, nome: 'CRIAÇÃO DE FONTES - CRM VIGOS', criadoEm: '17/08/2026 15:34', alteradoEm: '17/08/2026 15:34', vinculada: false }
    ],
    campanhas: [
      { id: 1, nome: 'Oportunidade Capta Whatsapp', descricao: '', criadoEm: '25/09/2022 09:02', alteradoEm: '25/09/2022 09:02', vinculada: true },
      { id: 2, nome: 'Feira XYZ 2026', descricao: 'Ação de final de ano', criadoEm: '12/06/2026 14:20', alteradoEm: '12/06/2026 14:20', vinculada: false }
    ],
    selecionados: [],

    proximoIdCampanha: 3,

  function toast(msg) {
